<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07051a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Soirée Arena">
<title>Soirée Arena</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Bungee&display=swap" rel="stylesheet">
<style>
:root{--bg:#07051a;--card:#151036;--pink:#ff2bd6;--cyan:#22e4ff;--green:#39ff88;--yellow:#ffe14d;--red:#ff4d6d;--txt:#f4f1ff;--mut:#9a93c9;--fd:"Bungee",Impact,"Arial Black",system-ui,sans-serif;--fb:"Baloo 2",-apple-system,BlinkMacSystemFont,system-ui,sans-serif}
@property --b{syntax:'<number>';inherits:true;initial-value:0}
:root{transition:--b .16s ease-out}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--txt);font-family:var(--fb);overscroll-behavior:none;touch-action:none}
button{font-family:inherit;cursor:pointer;touch-action:none;color:inherit}
#stage{position:fixed;inset:0;overflow:hidden;z-index:1}

/* ===== Décors (un par univers de jeu) ===== */
.bgfx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0;background:#07051a}
.bgfx>*{position:absolute;opacity:0;transition:opacity .8s}
.bgfx>.sky,.bgfx>.vig,.bgfx>#fxc{opacity:1}
.sky{inset:0;background:var(--sky);transition:none}
.vig{inset:0;background:radial-gradient(120% 90% at 50% 45%,transparent 55%,#000a 100%)}
#fxc{inset:0;width:100%;height:100%}
.aur{inset:-20%;background:radial-gradient(40% 30% at 30% 30%,var(--a1,#7b2cff66),transparent 70%),radial-gradient(35% 28% at 70% 60%,var(--a2,#ff2bd655),transparent 70%),radial-gradient(30% 25% at 40% 80%,var(--a3,#22e4ff44),transparent 70%);animation:aur 18s ease-in-out infinite alternate}
@keyframes aur{50%{transform:translate(5%,-4%) rotate(8deg) scale(1.1)}100%{transform:translate(-4%,5%) rotate(-6deg) scale(1.05)}}
.rays{left:50%;top:45%;width:240vmax;height:240vmax;margin:-120vmax 0 0 -120vmax;background:repeating-conic-gradient(from 0deg,#ffffff16 0deg 8deg,transparent 8deg 20deg);animation:spin 40s linear infinite}
.dots{inset:0;background-image:radial-gradient(circle,#9fb6ff38 1.3px,transparent 1.8px);background-size:15px 15px;-webkit-mask-image:radial-gradient(90% 60% at 50% 30%,#000,transparent 80%);mask-image:radial-gradient(90% 60% at 50% 30%,#000,transparent 80%);opacity:0}
.beams i{position:absolute;bottom:-12%;width:46vmax;height:135vmax;margin-left:-23vmax;transform-origin:50% 100%;background:linear-gradient(to top,var(--bc),transparent 80%);clip-path:polygon(46% 100%,54% 100%,100% 0,0 0);mix-blend-mode:screen;opacity:.42;animation:sweep 6s ease-in-out infinite alternate}
.beams i:nth-child(1){left:8%;--bc:#ff2bd6;--r0:-35deg;--r1:20deg}
.beams i:nth-child(2){left:50%;--bc:#ffe14d;--r0:14deg;--r1:-14deg;animation-duration:8s;opacity:.25}
.beams i:nth-child(3){left:92%;--bc:#22e4ff;--r0:35deg;--r1:-20deg;animation-duration:7s}
@keyframes sweep{from{transform:rotate(var(--r0))}to{transform:rotate(var(--r1))}}
.sun{left:50%;border-radius:50%;transform:translateX(-50%)}
.planet{right:-8%;top:9%;width:min(52vw,260px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 32% 30%,#ffb3e6,#b14bff 45%,#3a1380 75%,#16063a);box-shadow:0 0 60px #b14bff66,inset -20px -18px 40px #0008;animation:float 9s ease-in-out infinite}
.planet::after{content:"";position:absolute;left:-28%;right:-28%;top:42%;height:16%;border-radius:50%;border:5px solid #ffd6f5aa;border-top-color:transparent;transform:rotate(-16deg)}
@keyframes float{50%{transform:translateY(-12px)}}
.floor{left:-60%;right:-60%;bottom:-6%;height:var(--fh,40%);background-image:linear-gradient(var(--fl,#ff2bd6aa) 2px,transparent 2px),linear-gradient(90deg,var(--fl,#ff2bd6aa) 2px,transparent 2px);background-size:54px 54px;transform:perspective(320px) rotateX(66deg);transform-origin:bottom;animation:floor 1.8s linear infinite;-webkit-mask-image:linear-gradient(transparent,#000 50%);mask-image:linear-gradient(transparent,#000 50%)}
@keyframes floor{to{background-position:0 54px}}
.land{left:0;width:100%;bottom:0;height:var(--lh,24%)}
.crowd{left:-2%;right:-2%;bottom:0;height:14%;display:flex;flex-direction:column;justify-content:flex-end}
.crowd svg{display:block;width:100%;height:100%;transform:translateY(calc(var(--b) * 5px));transition:transform .12s}
.crowd svg.crb{position:absolute;bottom:20%;height:80%;opacity:.7;transform:translateY(calc(var(--b) * -3px))}

/* Arène : concert néon */
[data-th=arena]{--sky:radial-gradient(110% 60% at 50% 100%,#ff2bd640,transparent 60%),linear-gradient(#08051f,#170a43 55%,#33115e)}
[data-th=arena] .aur,[data-th=arena] .beams,[data-th=arena] .crowd{opacity:1}
/* Far West : coucher de soleil */
[data-th=western]{--sky:linear-gradient(#22093a 0%,#6e1c55 28%,#d6423f 55%,#ff8f3c 74%,#ffd27a 100%)}
[data-th=western] .sun{opacity:1;bottom:22%;width:min(60vw,300px);aspect-ratio:1;background:radial-gradient(circle,#fff8d6,#ffd36b 50%,#ff8a3c 72%);box-shadow:0 0 90px 30px #ff8a3c77}
[data-th=western] .l-west{opacity:1}
/* Dojo : soleil levant, montagne et pétales */
[data-th=dojo]{--sky:linear-gradient(#26050d,#5e0d1f 40%,#b0283a 75%,#e8664a)}
[data-th=dojo] .sun{opacity:.9;top:12%;width:min(64vw,320px);aspect-ratio:1;background:radial-gradient(circle,#fff1dd,#ffd9b8 60%,#ffb08a);box-shadow:0 0 80px 20px #ffb08a55}
[data-th=dojo] .l-dojo{opacity:1}
/* Espace */
[data-th=space]{--sky:radial-gradient(70% 50% at 20% 80%,#2d1b8a55,transparent 70%),radial-gradient(60% 40% at 80% 20%,#8a1b7a44,transparent 70%),linear-gradient(#02010a,#090726 60%,#140a38)}
[data-th=space] .planet{opacity:1}
/* Plateau télé */
[data-th=studio]{--sky:radial-gradient(90% 55% at 50% 0%,#2f6bff50,transparent 70%),linear-gradient(#040a2c,#0f0a48 60%,#2a0b5e)}
[data-th=studio] .beams,[data-th=studio] .crowd{opacity:1}
[data-th=studio] .dots{opacity:1}
[data-th=studio] .beams i:nth-child(1){--bc:#2f8bff}[data-th=studio] .beams i:nth-child(3){--bc:#ff2bd6}
/* Glace */
[data-th=ice]{--sky:linear-gradient(#020d26,#0a3364 50%,#1f7fb3 82%,#a9e8ff);--a1:#39ff8844;--a2:#22e4ff55;--a3:#7b2cff33}
[data-th=ice] .aur,[data-th=ice] .l-ice{opacity:1}
/* Rétro-futur */
[data-th=synth]{--sky:linear-gradient(#0a0220 0%,#250844 38%,#6e1665 60%,#0d0322 60.3%,#0a0220)}
[data-th=synth] .sun{opacity:1;bottom:40%;width:min(58vw,280px);aspect-ratio:1;background:linear-gradient(#fff36b,#ff9a3c 40%,#ff2bd6 80%);box-shadow:0 0 70px #ff2bd688;-webkit-mask-image:linear-gradient(#000 52%,transparent 52% 56%,#000 56% 63%,transparent 63% 68%,#000 68% 75%,transparent 75% 81%,#000 81% 88%,transparent 88%);mask-image:linear-gradient(#000 52%,transparent 52% 56%,#000 56% 63%,transparent 63% 68%,#000 68% 75%,transparent 75% 81%,#000 81% 88%,transparent 88%)}
[data-th=synth] .floor,[data-th=synth] .l-synth{opacity:1}
/* Bonbons */
[data-th=candy]{--sky:radial-gradient(circle at 50% 45%,#ff6fb5 0%,#b81d7c 42%,#3d0b5e 100%)}
[data-th=candy] .rays{opacity:1}

/* ===== Menus ===== */
.scr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:max(22px,env(safe-area-inset-top)) 18px max(22px,env(safe-area-inset-bottom));text-align:center;z-index:2;animation:rise .5s cubic-bezier(.2,1.3,.4,1) both}
.scr.scroll{justify-content:flex-start;overflow-y:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch}
@keyframes rise{from{opacity:0;transform:translateY(30px) scale(.95)}}
.orbit{position:relative;width:min(320px,88vw);height:min(320px,88vw);display:flex;align-items:center;justify-content:center;flex:none}
.orb{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px;animation:orb 18s linear infinite;animation-delay:calc(var(--k) * -2.25s)}
.orb svg{filter:drop-shadow(0 0 10px #ff2bd6aa);animation:bob 2.4s ease-in-out infinite;animation-delay:calc(var(--k) * -.3s)}
@keyframes orb{from{transform:rotate(0deg) translateX(min(138px,38vw)) rotate(0deg)}to{transform:rotate(360deg) translateX(min(138px,38vw)) rotate(-360deg)}}
@keyframes bob{50%{transform:translateY(-4px) rotate(4deg)}}
.logo{font-family:var(--fd);line-height:.92;font-size:clamp(46px,15vw,74px);background:linear-gradient(180deg,#fff 0%,#fff3b0 30%,#ffb703 55%,#ff5e00 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 #9b1fd0) drop-shadow(0 8px 0 #2a0b4a) drop-shadow(0 0 26px #ff2bd6aa);transform:rotate(-5deg) scale(calc(1 + var(--b) * .04));position:relative;z-index:2}
.logo small{display:block;font-size:.62em;background:linear-gradient(180deg,#fff,#8ff6ff 45%,#1d6bff);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:3px}
.tag{font-size:18px;color:#e2dcff;margin:0;line-height:1.3;font-weight:700}
.foot{font-size:13px;color:var(--mut)}
.h{font-family:var(--fd);font-size:24px;margin:0;color:#fff;text-shadow:0 3px 0 #7a1fa8,0 0 18px #ff2bd666}
.hint{font-size:15px;color:#cfc8f7;margin:0;max-width:360px;line-height:1.3}
.btn{font-family:var(--fd);font-size:20px;letter-spacing:1px;border:0;border-radius:18px;padding:15px 24px;color:#2a0f00;background:linear-gradient(180deg,#fff27a,#ffb703);box-shadow:0 6px 0 #a35a00,0 12px 26px #0009;position:relative;overflow:hidden;transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #a35a00}
.btn::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,#ffffff77,transparent);transform:skewX(-20deg);animation:sh 3s infinite}
@keyframes sh{0%,55%{left:-60%}100%{left:130%}}
.btn.big{font-size:28px;padding:18px 46px;transform:scale(calc(1 + var(--b) * .03))}
.btn.pink{background:linear-gradient(180deg,#ff8aea,#ff2bd6);color:#fff;box-shadow:0 6px 0 #8a0f72,0 12px 26px #0009}
.btn.ghost{background:#ffffff14;color:#fff;box-shadow:0 4px 0 #0007;border:2px solid #ffffff35;font-size:16px}
.btn.sm{font-size:16px;padding:10px 18px;border-radius:14px}
.btn.sm::after{display:none}
.mute,.back{position:absolute;top:max(14px,env(safe-area-inset-top));width:44px;height:44px;border-radius:50%;border:2px solid #ffffff30;background:#0007;font-size:20px;z-index:5}
.mute{right:14px}.back{left:14px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:100%;max-width:380px}
.ccard{background:var(--card);border:3px solid #3a3380;border-radius:20px;padding:12px 6px 14px;font-family:var(--fd);font-size:36px;color:#fff;transition:transform .15s}
.ccard.on{border-color:var(--yellow);box-shadow:0 0 26px #ffe14d88;transform:scale(1.06)}
.ccard svg{display:block;margin:8px auto 0}
.pills{display:flex;gap:10px}
.pill{font-family:var(--fd);font-size:20px;min-width:74px;padding:10px;border-radius:14px;border:3px solid #3a3380;background:var(--card)}
.pill.on{border-color:var(--yellow);box-shadow:0 0 18px #ffe14d88}
.marq{width:100%;overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 15%,#000 85%,transparent);mask-image:linear-gradient(90deg,transparent,#000 15%,#000 85%,transparent)}
.marq div{display:inline-flex;gap:18px;font-size:30px;white-space:nowrap;animation:marq 22s linear infinite}
@keyframes marq{to{transform:translateX(-50%)}}
.ov{position:fixed;inset:0;z-index:90;background:#07051aee;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;animation:rise .35s both}
.steps{text-align:left;max-width:360px;font-size:16px;line-height:1.35;background:var(--card);border:2px solid #3a3380;border-radius:18px;padding:14px 16px}
.steps b{color:var(--yellow)}
.steps p{margin:0 0 8px}

/* ===== Table : zones des joueurs ===== */
.zone{position:absolute;z-index:1;overflow:hidden;border-radius:22px;background:linear-gradient(160deg,var(--ca),#0d0a26b8 78%);border:3px solid var(--c);box-shadow:inset 0 0 34px var(--cb),0 0 18px var(--ca);touch-action:none;transition:filter .3s,opacity .3s}
.zin{position:absolute;inset:0;display:flex;flex-direction:column;padding:8px 10px}
.zin.r{transform:rotate(180deg)}
.zh{display:flex;align-items:center;gap:6px;font-weight:800;font-size:15px;min-height:30px;flex:none}
.zh svg{flex:none}
.pn{font-family:var(--fd);font-size:11px;background:var(--c);color:#000;border-radius:7px;padding:3px 6px;flex:none}
.pn.big{font-size:15px;padding:4px 10px}
.nm{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;text-align:left}
.st{font-family:var(--fd);font-size:19px;color:var(--yellow);text-shadow:0 0 10px #ffe14d88;white-space:nowrap}
.zb{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;min-height:0}
.zhuge{font-family:var(--fd);font-size:clamp(30px,10vw,56px);line-height:1;text-shadow:0 0 20px var(--c),0 4px 0 #000}
.zhuge small{font-size:.45em}
.zbig{font-family:var(--fd);font-size:clamp(15px,4.8vw,23px);line-height:1.12}
.zsm{font-size:14px;color:#ddd7ff;font-weight:700}
.zone.wait{background:linear-gradient(160deg,#7a1228,#2a0610)}
.zone.go{background:linear-gradient(160deg,#18c862,#0a6a33)}
.zone.ok{background:linear-gradient(160deg,#1f9d5a,#0d3d24 80%)}
.zone.out{filter:grayscale(.9) brightness(.5)}
.zone.dim{opacity:.6}
.zone.win{animation:zwin .45s ease-in-out infinite alternate;border-color:#ffe14d}
@keyframes zwin{to{box-shadow:inset 0 0 60px #ffe14d77,0 0 44px #ffe14d}}
.zone.hot{animation:zhot .22s ease-in-out infinite alternate}
@keyframes zhot{to{background:linear-gradient(160deg,#ff3b3b,#5a0f1e);box-shadow:0 0 44px #ff3b3b;border-color:#fff}}
.zone.flashg{animation:zfg .4s}@keyframes zfg{30%{background:#1fbf6a}}
.zone.flashr{animation:zfr .4s}@keyframes zfr{30%{background:#c0213f}}
.zone.tapf{animation:ztap .12s}@keyframes ztap{50%{transform:scale(.97);filter:brightness(1.4)}}
.zone.ghost{opacity:.55;pointer-events:none}
.area{position:absolute;left:0;right:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
.mid{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);z-index:6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;pointer-events:none;text-align:center;padding:0 12px}
.mid>div{display:flex;flex-direction:column;align-items:center;gap:4px}
.mid .r,.dual .r,.r{transform:rotate(180deg)}
.mid button{pointer-events:auto}
.pz{position:absolute;left:6px;top:50%;margin-top:-19px;width:38px;height:38px;border-radius:50%;border:2px solid #ffffff40;background:#000a;font-size:15px;z-index:9}
.dual{display:flex;flex-direction:column;align-items:center;justify-content:space-around;height:100%;width:100%;padding:4px 12px;gap:4px}
.dual>div{display:flex;flex-direction:column;align-items:center;gap:4px}
.cd{font-family:var(--fd);font-size:86px;line-height:1;color:#fff;text-shadow:0 0 34px var(--pink),0 6px 0 #000;animation:cd .6s cubic-bezier(.2,1.6,.4,1) both}
.cd.go{color:var(--yellow);text-shadow:0 0 40px var(--yellow),0 6px 0 #000}
@keyframes cd{from{transform:scale(3) rotate(-10deg);opacity:0}}
.fin{font-family:var(--fd);font-size:58px;color:var(--yellow);text-shadow:0 0 34px var(--yellow),0 5px 0 #000;animation:cd .5s both;line-height:1}
.emo{font-size:58px;line-height:1}
.chrono{font-family:var(--fd);font-size:58px;font-variant-numeric:tabular-nums;color:#fff;text-shadow:0 0 22px var(--cyan),0 4px 0 #000;line-height:1}
.chrono.blur{filter:blur(7px);color:var(--pink)}
.ft{position:absolute;left:50%;top:42%;font-family:var(--fd);font-size:38px;color:var(--yellow);text-shadow:0 0 14px currentColor,0 3px 0 #000;animation:ft 1s forwards;pointer-events:none;z-index:6;white-space:nowrap}
@keyframes ft{0%{transform:translate(-50%,0) scale(.4);opacity:0}20%{transform:translate(-50%,-10px) scale(1.3);opacity:1}100%{transform:translate(-50%,-80px) scale(1);opacity:0}}

/* Sélection des héros */
.selav svg{filter:drop-shadow(0 0 18px var(--c));animation:bob 2.4s ease-in-out infinite}
.selrow{display:flex;align-items:center;justify-content:center;gap:6px;width:100%}
.arr{width:38px;height:38px;border-radius:50%;border:0;background:var(--c);color:#000;font-size:15px;box-shadow:0 4px 0 #0008;flex:none}
.arr:active{transform:translateY(3px);box-shadow:none}
.selnm{font-family:var(--fd);font-size:14px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-bottom:2px dotted #ffffff70;padding-bottom:2px}
.rdy{font-family:var(--fd);font-size:19px;border-radius:14px;padding:11px 22px;background:#ffffff1a;border:3px solid var(--c);box-shadow:0 4px 0 #0008}
.zone.ok .rdy{background:#39ff88;color:#04210f;border-color:#fff}

/* Roulette / intro / résultats */
.rt{font-family:var(--fd);font-size:13px;color:var(--cyan);letter-spacing:2px;text-shadow:0 0 10px #22e4ff88}
.rcard{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 20px;border-radius:24px;background:linear-gradient(180deg,#2e2380,#120c38);border:3px solid var(--cyan);box-shadow:0 0 34px #22e4ff88;min-width:72%;margin:8px 0}
.rcard .ri{font-size:68px;line-height:1}
.rcard .rn{font-family:var(--fd);font-size:20px}
.rcard.bump{animation:bump .12s}@keyframes bump{50%{transform:scale(1.07)}}
.rcard.land{animation:land .7s cubic-bezier(.2,1.6,.4,1);border-color:var(--yellow);box-shadow:0 0 60px #ffe14d}
@keyframes land{from{transform:scale(1.7) rotate(-6deg)}}
.gi{font-size:76px;line-height:1;animation:gi .8s cubic-bezier(.2,1.6,.4,1) both;filter:drop-shadow(0 0 22px #ff2bd6)}
@keyframes gi{from{transform:scale(0) rotate(-180deg)}}
.gname{font-family:var(--fd);font-size:22px;color:var(--yellow);text-shadow:0 0 14px #ffe14d88,0 3px 0 #000}
.grule{font-size:15px;line-height:1.2;font-weight:700;max-width:96%}
.medal{font-size:46px;line-height:1;animation:gi .6s both}
.medal.big{font-size:64px}
.plus{font-family:var(--fd);font-size:46px;color:var(--yellow);text-shadow:0 0 22px var(--yellow),0 4px 0 #000;animation:cd .6s both;line-height:1}
.stand{display:flex;gap:12px;justify-content:center;align-items:flex-end}
.sti{display:flex;flex-direction:column;align-items:center;font-family:var(--fd);font-size:17px}
.crn{height:20px;font-size:18px;line-height:1}
.champ svg{filter:drop-shadow(0 0 30px #ffe14d);animation:bob 1.6s ease-in-out infinite}

/* Mini-jeux */
.track{position:relative;width:94%;height:66px}
.lane{position:absolute;left:0;right:0;bottom:6px;height:6px;border-radius:3px;background:repeating-linear-gradient(90deg,#fff 0 12px,transparent 12px 22px);opacity:.5}
.flag{position:absolute;right:-6px;bottom:4px;font-size:30px}
.runner{position:absolute;bottom:8px;transition:left .1s;filter:drop-shadow(0 0 10px var(--c))}
.runner.hop svg{animation:hop .15s}
@keyframes hop{50%{transform:translateY(-12px) rotate(-10deg)}}
.cool{width:70%;height:10px;border-radius:5px;background:#ffffff22;overflow:hidden}
.cool i{display:block;height:100%;width:100%;background:var(--c);box-shadow:0 0 10px var(--c)}
.gcv{position:absolute;left:0;top:0;touch-action:none;z-index:3}
.bomb{position:absolute;left:50%;top:50%;font-size:92px;line-height:1;transform:translate(-50%,-50%) scale(var(--s,1));transition:left .35s cubic-bezier(.3,1.5,.5,1),top .35s cubic-bezier(.3,1.5,.5,1);filter:drop-shadow(0 0 22px #ff7b00)}
.bomb.exp{animation:exp .6s forwards}

let AC=null,NB=null,OUT=null,REV=null,DLY=null,muted=load("muted",false);
const mtof=n=>440*Math.pow(2,(n-69)/12);
function ac(){
  if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();const sr=AC.sampleRate;
    const b=AC.createBuffer(1,sr*2,sr),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;NB=b;
    const comp=AC.createDynamicsCompressor();comp.threshold.value=-16;comp.knee.value=8;comp.ratio.value=5;comp.attack.value=.003;comp.release.value=.18;comp.connect(AC.destination);
    OUT=AC.createGain();OUT.gain.value=.95;OUT.connect(comp);
    const len=sr*2.4|0,ir=AC.createBuffer(2,len,sr);for(let c=0;c<2;c++){const x=ir.getChannelData(c);for(let i=0;i<len;i++)x[i]=(Math.random()*2-1)*Math.pow(1-i/len,3.4)}
    REV=AC.createConvolver();REV.buffer=ir;const rg=AC.createGain();rg.gain.value=.34;REV.connect(rg);rg.connect(OUT);
    DLY=AC.createDelay(1.5);DLY.delayTime.value=.35;const fb=AC.createGain();fb.gain.value=.33;const dl=AC.createBiquadFilter();dl.type="lowpass";dl.frequency.value=2800;
    DLY.connect(dl);dl.connect(fb);fb.connect(DLY);const dg=AC.createGain();dg.gain.value=.45;dl.connect(dg);dg.connect(OUT)}
  if(AC.state==="suspended")AC.resume();return AC}
function sendTo(n,fx,v){if(!fx||!v)return;const s=AC.createGain();s.gain.value=v;n.connect(s);s.connect(fx)}
/* Voix de synthé générique */
function vo(type,f,t,d,v,dest,o={}){
  const os=AC.createOscillator(),g=AC.createGain(),a=o.a||.004;os.type=type;os.frequency.setValueAtTime(f,t);if(o.f2)os.frequency.exponentialRampToValueAtTime(o.f2,t+d);if(o.det)os.detune.value=o.det;
  let n=os;if(o.cut){const fl=AC.createBiquadFilter();fl.type="lowpass";fl.Q.value=o.q||1;fl.frequency.setValueAtTime(o.ce||o.cut,t);if(o.ce)fl.frequency.exponentialRampToValueAtTime(o.cut,t+Math.min(d,.3));os.connect(fl);n=fl}
  n.connect(g);g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+a+d);g.connect(dest);
  sendTo(g,REV,o.rev);sendTo(g,DLY,o.dly);os.start(t);os.stop(t+a+d+.05)}
function nz(t,d,v,dest,type,f,o={}){
  const s=AC.createBufferSource();s.buffer=NB;s.loop=true;const fl=AC.createBiquadFilter();fl.type=type;fl.frequency.setValueAtTime(f,t);if(o.f2)fl.frequency.exponentialRampToValueAtTime(o.f2,t+d);fl.Q.value=o.q||1;
  const g=AC.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(fl);fl.connect(g);g.connect(dest);sendTo(g,REV,o.rev);s.start(t,Math.random()*1.5);s.stop(t+d+.05)}

function tone(f,d=.15,type="sine",t0=0,v=.15,f2,rev=.12){if(muted)return;try{const a=ac();vo(type,f,a.currentTime+t0,d,v,OUT,{f2,rev})}catch(e){}}
function noise(d=.2,v=.3,type="lowpass",f=1200,t0=0,f2,rev=.1){if(muted)return;try{const a=ac();nz(a.currentTime+t0,d,v,OUT,type,f,{f2,rev})}catch(e){}}

  bot.forEach((p,k)=>{Z[p]={i:p,l:k/bot.length,t:1-edge,w:1/bot.length,h:edge,rot:0}});

}

/* ===================== SÉLECTION DES HÉROS ===================== */
function prepPlayers(){const n=G.n,S=G.slots,used=new Set();
  for(let i=0;i<n;i++){if(used.has(S[i].av))S[i].av=HEROES.findIndex((_,k)=>!used.has(k));used.add(S[i].av)}
  G.P=S.slice(0,n).map(s=>({name:s.custom&&s.name?s.name:HEROES[s.av].n,av:s.av}))}
function startMatch(){save("slots",G.slots);G.scores=Array(G.n).fill(0);G.round=0;G.bag=[];G.last=null}
function cycleHero(i,d){const n=G.n,S=G.slots,s=S[i],L=HEROES.length;let k=(s.av+d+L)%L;
  if(n<L){while(S.slice(0,n).some((o,j)=>j!==i&&o.av===k))k=(k+d+L)%L}
  else{const j=S.slice(0,n).findIndex((o,j)=>j!==i&&o.av===k);if(j>=0){S[j].av=s.av;G.P[j].av=s.av;if(!S[j].custom)G.P[j].name=HEROES[s.av].n}}
  s.av=k;G.P[i].av=k;if(!s.custom)G.P[i].name=HEROES[k].n;sfx.select()}
function editName(i,cb){const s=G.slots[i],v=prompt("Ton prénom (laisse vide pour garder le nom du héros) :",s.custom?s.name:"");if(v===null)return;
  const t=v.trim().slice(0,14);s.custom=!!t;s.name=t;G.P[i].name=t||HEROES[s.av].n;cb()}

/* ===================== DÉROULEMENT D'UNE PARTIE ===================== */
function avail(){return Object.keys(GAMES).filter(k=>{const g=GAMES[k];if(g.need&&!g.need())return false;return G.mode==="mix"||(G.mode==="tour")===!!g.solo})}
function drawGame(){const av=avail();G.bag=G.bag.filter(k=>av.includes(k));if(!G.bag.length){G.bag=shuffle(av);if(G.bag[0]===G.last&&G.bag.length>1)G.bag.push(G.bag.shift())}const k=G.bag.shift();G.last=k;return k}
function nextRound(){if(G.round>=G.rounds)return G.mode==="tour"?podiumList():podium();roulette()}
function scoreHeads(Z){Z.forEach(z=>{z.st.textContent="⭐ "+G.scores[z.i]})}

function roulette(){
  newRun();musicMode("menu");theme("arena");
  const key=drawGame(),keys=avail(),tour=G.mode==="tour";
  if(tour){plain();stage.innerHTML=`<div class="scr"><div class="rt">MANCHE ${G.round+1} / ${G.rounds}</div><div class="rcard solo1" id="rc"></div><div class="rt">PROCHAIN MINI-JEU</div>${standHTML()}</div>`;addPause()}
  else{const {Z,area}=buildStage(G.n,.22);scoreHeads(Z);
    Z.forEach(z=>{z.zb.innerHTML=`<div class="zsm">Manche</div><div class="zhuge">${G.round+1}<small>/${G.rounds}</small></div>`});
    area.innerHTML=`<div class="rt r">PROCHAIN MINI-JEU</div><div class="rcard" id="rc"></div><div class="rt">PROCHAIN MINI-JEU</div>`}
  const rc=$("#rc"),fill=k=>{const g=GAMES[k];rc.innerHTML=tour?`<div class="ri">${g.icon}</div><div class="rn">${g.name}</div>`:`<div class="rn r">${g.name}</div><div class="ri">${g.icon}</div><div class="rn">${g.name}</div>`};
  const seq=[];for(let s=0;s<19;s++)seq.push(pick(keys));seq.push(key);
  let s=0,d=55;
  const go=()=>{fill(seq[s]);sfx.tick();rc.classList.remove("bump");void rc.offsetWidth;rc.classList.add("bump");s++;
    if(s<seq.length){d*=1.11;T(d,go)}else{rc.classList.remove("bump");rc.classList.add("land");sfx.sting();flash("#ffe14d");T(1700,()=>wipe(()=>intro(key)))}};
  T(450,go);
}
function intro(key){

      if(rd.every(Boolean))T(450,()=>wipe(()=>(g.solo?playSolo:play)(key)))})});

function countdown(fn){
  let k=3;
  const step=()=>{if(k>0){midSet(`<div class="cd">${k}</div>`);sfx.beep();k--;T(650,step)}
    else{midSet(`<div class="cd go">GO !</div>`);sfx.go();flash("#ffffff");const tok=$("#mid").innerHTML;T(550,()=>{const m=$("#mid");if(m&&m.innerHTML===tok)midSet("")});fn()}};

function makeCtx(key,{Z,area}){
  const run=RUN,c={key,run,Z,area,n:G.n,P:G.P,go:false,done:false,
    mid:midSet,
    score:(i,v)=>{Z[i].st.textContent=v},

function play(key){

function calcPts(places){const n=places.length;return places.every(p=>p===places[0])?places.map(()=>0):places.map(p=>Math.max(0,n-1-p))}
function endGame(key,places,pts){

}
function showResult(key,places,pts,labels){(G.mode==="tour"?resultList:result)(key,places,pts,labels)}

function soloCountdown(s,fn){const o=document.createElement("div");o.className="scd";s.el.appendChild(o);let k=3;
  const step=()=>{if(k>0){o.innerHTML=`<div class="cd">${k}</div>`;sfx.beep();k--;T(600,step)}else{o.innerHTML=`<div class="cd go">GO !</div>`;sfx.go();T(500,()=>o.remove());fn()}};
  T(300,step)}
function playSolo(key){
  const g=GAMES[key],n=G.n,first=G.round%n,order=[...Array(n)].map((_,k)=>(first+k)%n),res=Array(n).fill(null),lab=Array(n).fill("");let j=0;
  const turn=()=>{if(j>=n)return done();const i=order[j];
    passScreen(key,i,j===0,()=>{newRun();musicMode(g.mus||"arena");theme(g.th||"arena");
      const s=soloCtx(key,i,(v,l)=>{res[i]=v;lab[i]=l;musicDuck(false);T(600,()=>after(s,i,l))});

  const after=(s,i,l)=>{const last=j>=n-1,o=document.createElement("div");o.className="tend";
    o.innerHTML=`<div class="rt">SCORE DE ${esc(G.P[i].name).toUpperCase()}</div><div class="tsc">${esc(l)}</div><button class="btn big">${last?"🏁 RÉSULTATS":"AU SUIVANT ▶"}</button>`;
    s.el.appendChild(o);sfx.win();on(o.querySelector("button"),once(()=>{j++;sfx.select();wipe(turn)}))};
  const done=()=>{const hi=g.hi!==false,v=res.map(x=>x==null?(hi?-1e9:1e9):x),places=rankBy(v,hi);showResult(key,places,calcPts(places),lab)};
  turn();
}

async function loadTracks(){
  if(G.tracks||G.loading)return;G.loading=true;
  const all=[...TRACKS["Hits français"],...TRACKS["Années 80"],...TRACKS["Années 90"],...TRACKS["Années 2000"],...TRACKS["Disney & Films"],...TRACKS["Rock"]];
  try{const res=await Promise.all(shuffle(all).slice(0,22).map(t=>jsonp("https://itunes.apple.com/search?media=music&entity=song&country=fr&limit=4&term="+encodeURIComponent(t))));
    const seen=new Set();G.tracks=res.map(r=>r&&r.results&&r.results.find(x=>x.previewUrl)).filter(t=>t&&!seen.has(t.trackId)&&seen.add(t.trackId));
  }catch(e){G.tracks=null}
  G.loading=false;
}
const cleanT=s=>String(s).replace(/\s*[\(\[].*?[\)\]]/g,"").trim();

/* Buzz : même question pour tous, réponses dans chaque coin */
function buzz(c,{rounds,gen,penalty=false,tmo=15000}){
  const pts=Array(c.n).fill(0);let k=0,cur=null,lock,solved;
  c.Z.forEach(z=>c.score(z.i,0));
  const ask=()=>{if(RUN!==c.run)return;if(k>=rounds)return c.finish(rankBy(pts));k++;cur=gen(k);lock=new Set();solved=false;
    c.area.innerHTML=cur.html;
    c.Z.forEach(z=>{c.cls(z.i,"out",false);c.body(z.i,`<div class="opts n${cur.opts.length}">${cur.opts.map((o,j)=>`<button class="opt" data-j="${j}">${o}</button>`).join("")}</div>`);
      z.zb.querySelectorAll(".opt").forEach(b=>on(b,()=>pickOpt(z.i,+b.dataset.j,b)))});
    if(cur.onShow)cur.onShow();
    cur.tm=T(tmo,()=>reveal(-1))};
  const pickOpt=(i,j,b)=>{if(solved||lock.has(i))return;
    if(j===cur.ok){pts[i]++;c.score(i,pts[i]);b.classList.add("good");c.cls(i,"win");c.ft(i,"+1");sfx.coin();reveal(i)}
    else{lock.add(i);b.classList.add("bad");c.cls(i,"out");sfx.bad();if(penalty){pts[i]--;c.score(i,pts[i]);c.ft(i,"−1","#ff4d6d")}if(lock.size>=c.n)reveal(-1)}};
  const reveal=w=>{if(solved)return;solved=true;clearTimeout(cur.tm);
    c.Z.forEach(z=>z.zb.querySelectorAll(".opt").forEach(b=>{if(+b.dataset.j===cur.ok)b.classList.add("good")}));
    if(cur.onEnd)cur.onEnd(w);
    T(1900,()=>{c.Z.forEach(z=>c.cls(z.i,"win",false));ask()})};
  ask();
}
/* Spot : quelque chose défile au centre, touchez au bon moment */
function spot(c,{next,isHit,render,goal=3,speed=[850,480]}){
  const pts=Array(c.n).fill(0),lock=Array(c.n).fill(0);let cur=null,claimed=false,over=false,k=0;
  c.Z.forEach(z=>c.score(z.i,0));
  const step=()=>{if(over)return;cur=next(cur);claimed=false;render(cur);k++;T(Math.max(speed[1],speed[0]-k*14),step)};
  c.Z.forEach(z=>c.tap(z.i,()=>{const i=z.i;if(over||cur==null||performance.now()<lock[i])return;
    if(isHit(cur)){if(claimed)return;claimed=true;pts[i]++;c.score(i,pts[i]);c.blink(i,"flashg");c.ft(i,"+1");sfx.coin();
      if(pts[i]>=goal){over=true;c.cls(i,"win");T(1000,()=>c.finish(rankBy(pts)))}}
    else{pts[i]--;c.score(i,pts[i]);c.blink(i,"flashr");c.ft(i,"−1","#ff4d6d");sfx.bad();lock[i]=performance.now()+700}}));
  T(1900,step);T(45000,()=>{if(!over){over=true;c.finish(rankBy(pts))}});
}

etoiles:{name:"Attrape-étoiles",icon:"⭐",edge:.5,
 rule:"Des étoiles apparaissent dans votre coin, au même endroit pour tout le monde. Touchez-les avant les autres ! Attention aux bombes : moins 1 point.",
 start(c){const pts=Array(c.n).fill(0);let k=0,cur=null,over=false;
  c.Z.forEach(z=>{c.score(z.i,0);c.body(z.i,`<div class="field"></div>`)});
  const clearAll=()=>c.Z.forEach(z=>{const f=z.zb.querySelector(".field");if(f)f.innerHTML=""});
  const spawn=()=>{if(over)return;if(k>=12){over=true;return c.finish(rankBy(pts))}k++;
   const bomb=k>2&&Math.random()<.3,x=12+Math.random()*76,y=14+Math.random()*72,id=k;cur={bomb,id};
   c.Z.forEach(z=>{const f=z.zb.querySelector(".field");f.innerHTML=`<button class="tgt ${bomb?"bm":""}" style="left:${x}%;top:${y}%">${bomb?"💣":"⭐"}</button>`;on(f.firstChild,()=>hit(z.i,id,f))});
   T(bomb?1300:2400,()=>{if(cur&&cur.id===id){cur=null;clearAll();T(350,spawn)}})};
  const hit=(i,id,f)=>{if(over||!cur||cur.id!==id)return;
   if(cur.bomb){pts[i]--;c.score(i,pts[i]);c.blink(i,"flashr");c.ft(i,"−1","#ff4d6d");sfx.bad();f.innerHTML="";return}
   cur=null;pts[i]++;c.score(i,pts[i]);c.blink(i,"flashg");c.ft(i,"+1");sfx.coin();clearAll();T(rnd(400,900),spawn)};
  T(500,spawn)}},

hockey:{name:"Air Hockey",icon:"🏒",edge:.5,
 rule:"Glissez le doigt dans votre zone pour bouger votre palet. Marquez dans le but d'en face ! Équipe du bas contre équipe du haut, premier à 3 buts (80 secondes max).",
 setup(c){c.Z.forEach(z=>{z.el.classList.add("ghost");c.body(z.i,"")});
  const{cv,x,w,h}=canvasIn(stage),pr=Math.min(w,h)*.08,kr=pr*.72,gw=w*.44;
  const bot=c.Z.filter(z=>!z.rot).map(z=>z.i),top=c.Z.filter(z=>z.rot).map(z=>z.i);
  const pads=c.Z.map(z=>({i:z.i,z,x:(z.l+z.w/2)*w,y:z.rot?h*.2:h*.8,vx:0,vy:0,tx:null,ty:null,img:avImg(c.P[z.i].av)}));
  const pk={x:w/2,y:h/2,vx:0,vy:0},own=new Map();let sb=0,stp=0,over=false,pause=0,tt=0;
  const pos=e=>{const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
  cv.addEventListener("pointerdown",e=>{e.preventDefault();const[px,py]=pos(e),p=pads.find(q=>px>=q.z.l*w&&px<=(q.z.l+q.z.w)*w&&py>=q.z.t*h&&py<=(q.z.t+q.z.h)*h);if(!p)return;own.set(e.pointerId,p);try{cv.setPointerCapture(e.pointerId)}catch(_){}p.tx=px;p.ty=py});
  cv.addEventListener("pointermove",e=>{const p=own.get(e.pointerId);if(!p)return;const[px,py]=pos(e);p.tx=px;p.ty=py});
  const up=e=>own.delete(e.pointerId);cv.addEventListener("pointerup",up);cv.addEventListener("pointercancel",up);
  c.hscore=()=>{bot.forEach(i=>c.score(i,"⚽ "+sb+" – "+stp));top.forEach(i=>c.score(i,"⚽ "+stp+" – "+sb))};
  const goal=b=>{if(b)sb++;else stp++;c.hscore();sfx.goal();flash(PCOL[(b?bot:top)[0]]);shake();(b?bot:top).forEach(i=>c.ft(i,"BUT !"));
   if(sb>=3||stp>=3){over=true;const W=sb>=3?bot:top;W.forEach(i=>{c.Z[i].el.classList.remove("ghost");c.cls(i,"win")});T(1600,()=>c.finish(c.Z.map(z=>W.includes(z.i)?0:1),c.Z.map(z=>W.includes(z.i)?c.n-1:0)));return}
   pk.x=w/2;pk.y=h/2;pk.vx=0;pk.vy=(b?-1:1)*h*.12;pause=1};
  LOOP(dt=>{
   pads.forEach(p=>{if(p.tx==null||!c.go){p.vx=p.vy=0;return}const z=p.z,nx=Math.min(Math.max(p.tx,z.l*w+pr),(z.l+z.w)*w-pr),ny=Math.min(Math.max(p.ty,z.t*h+pr),(z.t+z.h)*h-pr);p.vx=(nx-p.x)/Math.max(dt,.008);p.vy=(ny-p.y)/Math.max(dt,.008);p.x=nx;p.y=ny});
   if(c.go&&!over){tt+=dt;if(tt>80){over=true;if(sb===stp){c.finish(c.Z.map(()=>0),c.Z.map(()=>0));return false}const W=sb>stp?bot:top;W.forEach(i=>{c.Z[i].el.classList.remove("ghost");c.cls(i,"win")});sfx.win();T(1500,()=>c.finish(c.Z.map(z=>W.includes(z.i)?0:1),c.Z.map(z=>W.includes(z.i)?c.n-1:0)));return}
    if(pause>0)pause-=dt;else{pk.x+=pk.vx*dt;pk.y+=pk.vy*dt}
    const f=Math.pow(.75,dt);pk.vx*=f;pk.vy*=f;
    if(pk.x<kr){pk.x=kr;pk.vx=Math.abs(pk.vx)*.9;sfx.wall()}else if(pk.x>w-kr){pk.x=w-kr;pk.vx=-Math.abs(pk.vx)*.9;sfx.wall()}
    const ing=Math.abs(pk.x-w/2)<gw/2-kr*.3;
    if(pk.y<kr&&!ing){pk.y=kr;pk.vy=Math.abs(pk.vy)*.9;sfx.wall()}else if(pk.y>h-kr&&!ing){pk.y=h-kr;pk.vy=-Math.abs(pk.vy)*.9;sfx.wall()}
    if(pk.y<-kr)goal(true);else if(pk.y>h+kr)goal(false);
    pads.forEach(p=>{const dx=pk.x-p.x,dy=pk.y-p.y,d=Math.hypot(dx,dy)||1;if(d<pr+kr){const nx=dx/d,ny=dy/d;pk.x=p.x+nx*(pr+kr);pk.y=p.y+ny*(pr+kr);const rv=(pk.vx-p.vx)*nx+(pk.vy-p.vy)*ny;if(rv<0){pk.vx-=1.85*rv*nx;pk.vy-=1.85*rv*ny;sfx.hit()}}});
    const sp=Math.hypot(pk.vx,pk.vy),mx=h*2.4;if(sp>mx){pk.vx*=mx/sp;pk.vy*=mx/sp}}
   x.clearRect(0,0,w,h);
   x.strokeStyle="#22e4ff66";x.lineWidth=3;x.beginPath();x.moveTo(0,h/2);x.lineTo(w,h/2);x.stroke();x.beginPath();x.arc(w/2,h/2,Math.min(w,h)*.16,0,7);x.stroke();
   x.save();x.shadowBlur=22;x.fillStyle=x.shadowColor=PCOL[top[0]];x.fillRect(w/2-gw/2,0,gw,8);x.fillStyle=x.shadowColor=PCOL[bot[0]];x.fillRect(w/2-gw/2,h-8,gw,8);x.restore();
   pads.forEach(p=>{const col=PCOL[p.i];x.save();x.translate(p.x,p.y);x.beginPath();x.arc(0,0,pr,0,7);x.fillStyle=col;x.shadowColor=col;x.shadowBlur=24;x.fill();x.shadowBlur=0;x.beginPath();x.arc(0,0,pr*.8,0,7);x.fillStyle="#0d0a26";x.fill();
    if(p.img.complete&&p.img.naturalWidth){x.beginPath();x.arc(0,0,pr*.74,0,7);x.clip();x.drawImage(p.img,-pr*.74,-pr*.74,pr*1.48,pr*1.48)}x.restore()});
   x.save();x.beginPath();x.arc(pk.x,pk.y,kr,0,7);x.fillStyle="#fff";x.shadowColor="#22e4ff";x.shadowBlur=28;x.fill();x.restore();
  })},
 start(c){T(650,()=>c.hscore&&c.hscore())}},

dessin:{name:"Dessin éclair",icon:"✏️",edge:.5,
 rule:"Un joueur tiré au sort dessine un mot secret, les autres crient leurs réponses. Celui qui trouve gagne des points, le dessinateur aussi !",
 start(c){const d=Math.random()*c.n|0,word=pick([...WORDS["Facile"],...WORDS["Moyen"]]),nm=esc(c.P[d].name);

  function draw(){c.cls(d,"win",false);c.mid("");
   const wr=document.createElement("div");wr.className="draww";
   wr.innerHTML=`<canvas></canvas><div class="dbar"><div class="dt" id="dt">60</div>${COLORS.map((col,k)=>`<button class="dot ${k?"":"on"}" style="background:${col}" data-c="${col}"></button>`).join("")}<button class="dot" data-c="#ffffff" style="background:#fff">🧽</button><button class="btn sm" id="fnd">TROUVÉ !</button></div>`;
   stage.appendChild(wr);
   const cv=wr.querySelector("canvas"),dpr=Math.min(2,window.devicePixelRatio||1),w=cv.clientWidth,h=cv.clientHeight;cv.width=w*dpr;cv.height=h*dpr;
   const x=cv.getContext("2d");x.scale(dpr,dpr);x.fillStyle="#fff";x.fillRect(0,0,w,h);x.lineCap=x.lineJoin="round";
   let col=COLORS[0],sz=5,dr=false,lx=0,ly=0,left=60,ended=false;
   const ps=e=>{const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
   cv.addEventListener("pointerdown",e=>{e.preventDefault();dr=true;[lx,ly]=ps(e);try{cv.setPointerCapture(e.pointerId)}catch(_){}x.strokeStyle=col;x.lineWidth=sz;x.beginPath();x.moveTo(lx,ly);x.lineTo(lx+.1,ly+.1);x.stroke()});
   cv.addEventListener("pointermove",e=>{if(!dr)return;const[px,py]=ps(e);x.strokeStyle=col;x.lineWidth=sz;x.beginPath();x.moveTo(lx,ly);x.lineTo(px,py);x.stroke();lx=px;ly=py});
   cv.addEventListener("pointerup",()=>dr=false);cv.addEventListener("pointercancel",()=>dr=false);
   wr.querySelectorAll(".dot").forEach(b=>on(b,()=>{col=b.dataset.c;sz=col==="#ffffff"?26:5;wr.querySelectorAll(".dot").forEach(o=>o.classList.toggle("on",o===b))}));
   const iv=IV(1000,()=>{left--;const e=$("#dt");if(e)e.textContent=left;if(left<=5&&left>0)sfx.tick();if(left<=0)who()});
   on($("#fnd"),who);
   function who(){if(ended)return;ended=true;clearInterval(iv);wr.remove();sfx.go();
    c.mid(`<div class="zbig" style="text-shadow:0 3px 0 #000">C'était : ${esc(word)}</div><button class="btn sm" data-act="nobody">😅 PERSONNE</button>`);
    ACT.nobody=()=>{ACT.nobody=null;c.finish(Array(c.n).fill(0),Array(c.n).fill(0))};
    c.Z.forEach(z=>{if(z.i===d){c.body(d,`<div class="zbig">Qui a trouvé ?</div>`);return}
     c.body(z.i,`<button class="btn">🙋 C'EST MOI !</button>`);on(z.zb.querySelector("button"),()=>{ACT.nobody=null;const n=c.n,pl=Array(n).fill(2),pt=Array(n).fill(0);pl[z.i]=0;pl[d]=1;pt[z.i]=n-1;pt[d]=Math.max(1,Math.ceil((n-1)/2));c.finish(pl,pt)})})}
  }}}
};

tour:{name:"Tour infernale",icon:"🧱",solo:true,th:"candy",mus:"arena",goal:"le plus d'étages gagne",
 rule:"Touche l'écran pour lâcher le bloc qui glisse. Ce qui dépasse tombe ! Empile le plus d'étages possible.",
 run(s){const {cv,x,w,h}=canvasIn(s.sb),bh=Math.max(20,Math.min(34,h*.045)),baseY=h*.88;
  let st=[{x:w*.2,w:w*.6}],cur=null,sp=w*.55,falls=[],cam=0,over=false;
  const spawn=()=>{const t=st[st.length-1],L=st.length%2;cur={x:L?-t.w*.2:w-t.w*.8,w:t.w,d:L?1:-1}};
  const col=(k,l)=>`hsl(${(k*13+300)%360} 90% ${l}%)`;
  const blk=(bx,by,bw,k)=>{x.fillStyle=col(k,56);x.fillRect(bx,by,bw,bh);x.fillStyle=col(k,74);x.fillRect(bx,by,bw,bh*.3);x.strokeStyle="#0007";x.lineWidth=2;x.strokeRect(bx+1,by+1,bw-2,bh-2)};
  const Y=k=>baseY-(k+1)*bh+cam,lab=n=>n+" étage"+(n>1?"s":"");
  spawn();s.score(lab(0));
  on(cv,()=>{if(over||!cur)return;const t=st[st.length-1],l=Math.max(cur.x,t.x),r=Math.min(cur.x+cur.w,t.x+t.w),ov=r-l;
    if(ov<=2){over=true;falls.push({x:cur.x,y:Y(st.length),w:cur.w,k:st.length,vy:0});cur=null;sfx.ko();shake();const n=st.length-1;T(1300,()=>s.end(n,lab(n)));return}
    if(Math.abs(cur.x-t.x)<w*.014){st.push({x:t.x,w:t.w});sfx.coin();s.ft("PARFAIT !","#39ff88")}
    else{falls.push({x:cur.x<t.x?cur.x:r,y:Y(st.length),w:cur.w-ov,k:st.length,vy:0});st.push({x:l,w:ov});sfx.tap(st.length)}
    s.score(lab(st.length-1));sp=Math.min(w*1.7,sp*1.05);spawn()});
  LOOP(dt=>{const target=Math.max(0,(st.length+2)*bh-baseY*.6);cam+=(target-cam)*Math.min(1,dt*6);
    if(cur){cur.x+=cur.d*sp*dt;if(cur.d>0&&cur.x+cur.w>w+cur.w*.2)cur.d=-1;if(cur.d<0&&cur.x<-cur.w*.2)cur.d=1}
    x.clearRect(0,0,w,h);x.fillStyle="#0009";x.fillRect(0,baseY+cam,w,h);
    st.forEach((b,k)=>{const yy=Y(k);if(yy>-bh&&yy<h)blk(b.x,yy,b.w,k)});
    falls.forEach(f=>{f.vy+=1500*dt;f.y+=f.vy*dt;blk(f.x,f.y,f.w,f.k)});falls=falls.filter(f=>f.y<h+60);
    if(cur)blk(cur.x,Y(st.length),cur.w,st.length);
    x.font=`${Math.round(Math.min(96,w*.24))}px Bungee, Impact, sans-serif`;x.textAlign="center";x.fillStyle="#ffffffd0";x.fillText(st.length-1,w/2,h*.2)})}},

memoire:{name:"Mémoire flash",icon:"💡",solo:true,th:"space",mus:"tension",goal:"la plus longue suite gagne",
 rule:"Regarde les couleurs qui s'allument, puis refais la suite dans le même ordre. Elle s'allonge à chaque fois !",
 run(s){musicDuck(.3);s.sb.innerHTML=`<div class="smsg">Regarde…</div><div class="simon">${[0,1,2,3].map(k=>`<button class="sp" data-k="${k}"></button>`).join("")}</div>`;
  const pads=[...s.sb.querySelectorAll(".sp")],msg=s.sb.querySelector(".smsg"),NT=[64,67,71,76],seq=[];let pos=0,inp=false;
  const lab=n=>n+" couleur"+(n>1?"s":"");
  const lit=(k,d)=>{pads[k].classList.add("on");tone(mtof(NT[k]),d/1000+.1,"triangle",0,.17,0,.3);T(d,()=>pads[k].classList.remove("on"))};
  const show=()=>{inp=false;seq.push(Math.random()*4|0);s.score(lab(seq.length-1));msg.textContent="Regarde…";const sp=Math.max(270,560-seq.length*24);
    seq.forEach((k,j)=>T(650+j*sp,()=>lit(k,sp*.65)));T(650+seq.length*sp,()=>{inp=true;pos=0;msg.textContent="À toi !"})};
  pads.forEach(p=>on(p,()=>{if(!inp)return;const k=+p.dataset.k;
    if(k!==seq[pos]){inp=false;pads[seq[pos]].classList.add("hint");sfx.bad();shake();msg.textContent="Raté !";const n=seq.length-1;T(1500,()=>s.end(n,lab(n)));return}
    lit(k,170);pos++;if(pos>=seq.length){inp=false;msg.textContent="Bravo !";sfx.coin();s.ft("+1");T(750,show)}}));
  show()}},

tiles:{name:"Touches folles",icon:"🎹",solo:true,th:"synth",mus:"turbo",goal:"le plus de touches gagne",
 rule:"Des touches néon descendent sur 4 colonnes : touche-les toutes, de la plus basse à la plus haute. Une ratée et c'est fini… et ça accélère !",
 run(s){musicDuck(.45);const {cv,x,w,h}=canvasIn(s.sb),cw=w/4,rh=h/4.3;let rows=[],v=0,hits=0,over=false,last=-1,fail=null;
  const MEL=[72,76,79,76,74,77,81,77,72,76,79,84,83,79,74,71,69,72,76,72,71,74,79,74];
  const add=()=>{let c;do{c=Math.random()*4|0}while(c===last);last=c;rows.push({c,y:rows.length?rows[rows.length-1].y-rh:h-rh*1.7,ok:false})};
  for(let k=0;k<7;k++)add();s.score("Touche la 1re !");
  const lose=(c,y)=>{fail={c,y};over=true;sfx.ko();shake();T(1300,()=>s.end(hits,hits+" touche"+(hits>1?"s":"")))};
  cv.addEventListener("pointerdown",e=>{e.preventDefault();if(over)return;const r=cv.getBoundingClientRect(),px=e.clientX-r.left,py=e.clientY-r.top,c=Math.min(3,Math.max(0,px/cw|0)),row=rows.find(q=>!q.ok);if(!row)return;
    if(c!==row.c)return lose(c,row.y);
    if(py<row.y-rh*.7||py>row.y+rh*1.7)return;
    row.ok=true;hits++;if(!v)v=2.2;v=Math.min(7.5,v+.075);s.score(String(hits));tone(mtof(MEL[(hits-1)%MEL.length]),.22,"triangle",0,.16,0,.2)});
  LOOP(dt=>{if(!over){rows.forEach(q=>q.y+=v*rh*dt);const low=rows.find(q=>!q.ok);if(low&&low.y>h)lose(low.c,h-rh);rows=rows.filter(q=>q.y<h+rh);while(rows.length<9)add()}
    x.clearRect(0,0,w,h);x.fillStyle="#0a022066";x.fillRect(0,0,w,h);x.strokeStyle="#22e4ff33";x.lineWidth=1;
    for(let k=1;k<4;k++){x.beginPath();x.moveTo(k*cw,0);x.lineTo(k*cw,h);x.stroke()}
    rows.forEach(q=>{if(q.ok){x.fillStyle="#ffffff14";x.fillRect(q.c*cw+4,q.y+3,cw-8,rh-6);return}
      const g=x.createLinearGradient(0,q.y,0,q.y+rh);g.addColorStop(0,"#ff2bd6");g.addColorStop(1,"#7b2cff");x.fillStyle=g;x.fillRect(q.c*cw+4,q.y+3,cw-8,rh-6);x.strokeStyle="#ffc4f4";x.lineWidth=2;x.strokeRect(q.c*cw+5,q.y+4,cw-10,rh-8)});
    if(fail){x.fillStyle="#ff3b3bb0";x.fillRect(fail.c*cw,fail.y,cw,rh)}})}},

devine:{name:"Fais deviner",icon:"🗣️",solo:true,th:"studio",mus:"arena",goal:"le plus de mots trouvés gagne",
 rule:"45 secondes pour faire deviner un max de mots aux autres : mime, bruitage ou explication… sans jamais dire le mot ! Touche TROUVÉ ou PASSER.",
 run(s){const words=shuffle([...DEVINE,...WORDS.Facile,...WORDS.Moyen]);let k=0,found=0,t=45,over=false;const lab=n=>n+" mot"+(n>1?"s":"");
  s.sb.innerHTML=`<div class="dvt">45</div><div class="dvw"></div><div class="dvb"><button class="btn ghost" id="dpass">PASSER ↷</button><button class="btn" id="dok">TROUVÉ ✔</button></div>`;
  const W=s.sb.querySelector(".dvw"),TT=s.sb.querySelector(".dvt");
  const show=()=>{W.textContent=words[k++%words.length];W.classList.remove("pop");void W.offsetWidth;W.classList.add("pop")};
  show();s.score(lab(0));
  on(s.sb.querySelector("#dok"),()=>{if(over)return;found++;s.score(lab(found));sfx.coin();s.ft("+1");show()});
  on(s.sb.querySelector("#dpass"),()=>{if(over)return;sfx.whoosh();show()});
  IV(1000,()=>{if(over)return;t--;TT.textContent=t;if(t<=5){sfx.tick();TT.classList.add("hot")}if(t<=0){over=true;sfx.boom();W.textContent="TEMPS ÉCOULÉ !";T(1400,()=>s.end(found,lab(found)))}})}},

cercle:{name:"Cercle parfait",icon:"⭕",solo:true,th:"dojo",mus:"tension",goal:"le cercle le plus parfait gagne",
 rule:"Dessine le cercle le plus parfait possible, d'un seul trait, avec ton doigt. 2 essais, le meilleur compte !",
 run(s){const {cv,x,w,h}=canvasIn(s.sb),fr=v=>String(v).replace(".",",");let pts=[],drawing=false,tries=0,best=0,lock=false;
  const msg=document.createElement("div");msg.className="cmsg";s.sb.appendChild(msg);msg.textContent="Dessine un cercle !";
  const guide=()=>{x.clearRect(0,0,w,h);x.fillStyle="#ffffff55";x.beginPath();x.arc(w/2,h/2,5,0,7);x.fill()};
  guide();s.score("Essai 1/2");
  const pos=e=>{const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
  cv.addEventListener("pointerdown",e=>{e.preventDefault();if(lock)return;drawing=true;try{cv.setPointerCapture(e.pointerId)}catch(_){}pts=[pos(e)];guide();msg.textContent=""});
  cv.addEventListener("pointermove",e=>{if(!drawing)return;const p=pos(e),q=pts[pts.length-1];pts.push(p);x.strokeStyle="#fff";x.lineWidth=7;x.lineCap="round";x.shadowColor="#ff2bd6";x.shadowBlur=14;x.beginPath();x.moveTo(q[0],q[1]);x.lineTo(p[0],p[1]);x.stroke();x.shadowBlur=0});
  const up=()=>{if(!drawing)return;drawing=false;judge()};cv.addEventListener("pointerup",up);cv.addEventListener("pointercancel",up);
  const judge=()=>{if(pts.length<16){msg.textContent="Trop court, recommence !";return}
    let cx=0,cy=0;pts.forEach(p=>{cx+=p[0];cy+=p[1]});cx/=pts.length;cy/=pts.length;
    const rs=pts.map(p=>Math.hypot(p[0]-cx,p[1]-cy)),m=rs.reduce((a,b)=>a+b)/rs.length,sd=Math.sqrt(rs.reduce((a,b)=>a+(b-m)**2,0)/rs.length);
    if(m<45){msg.textContent="Trop petit, fais-le plus grand !";return}
    let ang=0;for(let k=1;k<pts.length;k++){let d=Math.atan2(pts[k][1]-cy,pts[k][0]-cx)-Math.atan2(pts[k-1][1]-cy,pts[k-1][0]-cx);if(d>Math.PI)d-=2*Math.PI;if(d<-Math.PI)d+=2*Math.PI;ang+=d}
    const cov=Math.min(1,Math.abs(ang)/(2*Math.PI));let sc=Math.max(0,100-sd/m*260);if(cov<.93)sc*=cov*.8;sc=Math.round(sc*10)/10;
    tries++;lock=true;best=Math.max(best,sc);
    x.strokeStyle="#39ff88";x.lineWidth=3;x.setLineDash([9,9]);x.beginPath();x.arc(cx,cy,m,0,7);x.stroke();x.setLineDash([]);
    msg.innerHTML=`<b>${fr(sc)} %</b>${sc>=90?" 🔥":cov<.93?"<br>Le cercle n'est pas fermé !":""}`;sc>=90?sfx.win():sfx.coin();
    if(tries>=2)T(1600,()=>s.end(best,fr(best)+" %"));
    else{s.score("Essai 2/2");T(1700,()=>{lock=false;guide();msg.textContent="Encore une fois !"})}}}},

bulles:{name:"Dans l'ordre",icon:"🫧",solo:true,hi:false,th:"ice",mus:"turbo",goal:"le plus rapide gagne",
 rule:"Touche les bulles de 1 à 16, dans l'ordre, le plus vite possible. Une erreur = 1 seconde de pénalité !",
 run(s){const N=16,f=s.sb,W=f.clientWidth,H=f.clientHeight,R=Math.round(Math.max(26,Math.min(40,Math.min(W,H)/8.5))),P=[],fr=v=>v.toFixed(2).replace(".",",");
  for(let k=0;k<N;k++){let p,n=0;do{p=[R+Math.random()*(W-2*R),R+Math.random()*(H-2*R)];n++}while(n<300&&P.some(q=>Math.hypot(q[0]-p[0],q[1]-p[1])<R*2.15));P.push(p)}
  let nx=1,pen=0;const t0=performance.now(),now=()=>(performance.now()-t0)/1000+pen;
  P.forEach((p,k)=>{const b=document.createElement("button");b.className="bub";b.textContent=k+1;b.style.cssText=`left:${p[0]-R}px;top:${p[1]-R}px;width:${2*R}px;height:${2*R}px;font-size:${Math.round(R*.8)}px;animation-delay:${(-Math.random()*3).toFixed(2)}s`;f.appendChild(b);
    on(b,()=>{if(nx>N)return;if(k+1===nx){nx++;b.classList.add("popd");tone(mtof(60+[0,2,4,5,7,9,11,12][nx%8]+(nx>8?12:0)),.1,"sine",0,.15,0,.2);if(nx>N){const t=now();sfx.win();s.score(fr(t)+" s");T(1200,()=>s.end(t,fr(t)+" s"))}}
      else{pen++;sfx.bad();s.ft("+1 s","#ff4d6d");b.classList.add("nope");T(350,()=>b.classList.remove("nope"))}})});
  IV(60,()=>{if(nx<=N)s.score(now().toFixed(1).replace(".",",")+" s")})}},

reflexe:{name:"Réflexe éclair",icon:"⚡",solo:true,hi:false,th:"synth",mus:"tension",goal:"le plus rapide gagne",
 rule:"Attends que l'écran devienne VERT, puis touche-le le plus vite possible. 4 essais. Trop tôt = pénalité !",
 run(s){s.sb.innerHTML=`<div class="rx"><div class="rxb"></div><div class="rxs"></div></div>`;
  const box=s.sb.querySelector(".rx"),big=s.sb.querySelector(".rxb"),sm=s.sb.querySelector(".rxs"),times=[];let k=0,ph="",t0=0,tm=null;
  const round=()=>{if(k>=4){const avg=Math.round(times.reduce((a,b)=>a+b)/times.length);box.className="rx ok";big.textContent=avg+" ms";sm.textContent="Moyenne";T(1000,()=>s.end(avg,avg+" ms"));return}
    ph="wait";box.className="rx wait";big.textContent="Attends…";sm.textContent=`Essai ${k+1}/4`;
    tm=T(1300+Math.random()*2900,()=>{ph="go";box.className="rx go";big.textContent="TOUCHE !";t0=performance.now();sfx.beep()})};
  on(box,()=>{if(ph==="wait"){clearTimeout(tm);ph="";times.push(1000);k++;box.className="rx bad";big.textContent="Trop tôt !";sm.textContent="+1000 ms de pénalité";sfx.bad();shake();T(1200,round)}
    else if(ph==="go"){ph="";const r=Math.round(performance.now()-t0);times.push(r);k++;box.className="rx ok";big.textContent=r+" ms";sm.textContent=r<250?"Éclair ! ⚡":r<350?"Pas mal !":"Un peu lent…";sfx.coin();s.score(`Essai ${k}/4`);T(1100,round)}});
  s.score("Essai 1/4");round()}},

pile10:{name:"Pile 10 secondes",icon:"⏲️",solo:true,hi:false,th:"synth",mus:"tension",goal:"le plus proche de 10 s gagne",
 rule:"Le chrono démarre puis disparaît au bout de 3 secondes. Touche STOP pile à 10,00 secondes !",
 run(s){s.sb.innerHTML=`<div class="chrono">0,00</div><div class="zsm" style="font-size:17px">Objectif : 10,00 s</div><button class="btn big pink" style="padding:30px 60px">STOP !</button>`;
  const c=s.sb.querySelector(".chrono"),m=s.sb.querySelector(".zsm"),t0=performance.now(),f2=v=>v.toFixed(2).replace(".",",");let stop=false;
  IV(30,()=>{if(stop)return;const t=(performance.now()-t0)/1000;if(t<3)c.textContent=f2(t);else{c.classList.add("blur");c.textContent="?,??"}if(t>20){stop=true;s.end(99,"trop tard !")}});
  on(s.sb.querySelector(".btn"),()=>{if(stop)return;stop=true;const t=(performance.now()-t0)/1000,d=Math.abs(t-10),l=(t>=10?"+":"−")+f2(d)+" s";
    c.classList.remove("blur");c.textContent=f2(t);m.textContent=l+(d<.1?" 🔥 Incroyable !":d<.3?" Très fort !":"");d<.3?sfx.win():sfx.coin();T(1500,()=>s.end(d,f2(t)+" s ("+l+")"))})}},

quizx:{name:"Quiz express",icon:"📚",solo:true,th:"studio",mus:"arena",goal:"le plus de points gagne",
 rule:"30 secondes pour répondre à un max de questions. Bonne réponse +1, mauvaise −1 !",
 run(s){const qs=shuffle(QUESTIONS);let k=0,sc=0,t=30,over=false;const lab=n=>n+" point"+(Math.abs(n)>1?"s":"");
  s.sb.innerHTML=`<div class="dvt">30</div><div class="qcat"></div><div class="qq big"></div><div class="opts n4 solo"></div>`;
  const o=s.sb.querySelector(".opts");
  const ask=()=>{const q=qs[k++%qs.length],op=shuffle(q[2]);delete o.dataset.lock;s.sb.querySelector(".qcat").textContent=q[0].toUpperCase();s.sb.querySelector(".qq").textContent=q[1];
    o.innerHTML=op.map(a=>`<button class="opt">${esc(a)}</button>`).join("");
    o.querySelectorAll(".opt").forEach((b,j)=>on(b,()=>{if(over||o.dataset.lock)return;o.dataset.lock=1;const good=op[j]===q[2][0];
      if(good){sc++;b.classList.add("good");sfx.coin();s.ft("+1")}else{sc--;b.classList.add("bad");o.querySelectorAll(".opt").forEach((x,jj)=>{if(op[jj]===q[2][0])x.classList.add("good")});sfx.bad();s.ft("−1","#ff4d6d")}
      s.score(lab(sc));T(good?380:1000,()=>{if(!over)ask()})}))};
  ask();s.score(lab(0));
  IV(1000,()=>{if(over)return;t--;const e=s.sb.querySelector(".dvt");e.textContent=t;if(t<=5){sfx.tick();e.classList.add("hot")}if(t<=0){over=true;sfx.boom();T(1200,()=>s.end(sc,lab(sc)))}})}}
});
