<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07051a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Soirée Arena">
<title>Soirée Arena</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Bungee&display=swap" rel="stylesheet">
<style>
:root{--bg:#07051a;--card:#151036;--pink:#ff2bd6;--cyan:#22e4ff;--green:#39ff88;--yellow:#ffe14d;--red:#ff4d6d;--txt:#f4f1ff;--mut:#9a93c9;--fd:"Bungee",Impact,"Arial Black",system-ui,sans-serif;--fb:"Baloo 2",-apple-system,BlinkMacSystemFont,system-ui,sans-serif}
@property --b{syntax:'<number>';inherits:true;initial-value:0}
:root{transition:--b .16s ease-out}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--txt);font-family:var(--fb);overscroll-behavior:none;touch-action:none}
button{font-family:inherit;cursor:pointer;touch-action:none;color:inherit}
#stage{position:fixed;inset:0;overflow:hidden;z-index:1}

/* ===== Décor ===== */
.bgfx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.rays{position:absolute;left:50%;top:50%;width:240vmax;height:240vmax;margin:-120vmax 0 0 -120vmax;background:repeating-conic-gradient(from 0deg,#ffffff09 0deg 7deg,transparent 7deg 18deg);animation:spin 50s linear infinite}
.glow{position:absolute;inset:-25%;background:radial-gradient(circle at 50% 45%,#7b2cff66,transparent 52%),radial-gradient(circle at 12% 88%,#22e4ff38,transparent 42%),radial-gradient(circle at 88% 10%,#ff2bd638,transparent 42%);opacity:calc(.55 + var(--b)*.45);animation:drift 14s ease-in-out infinite alternate}
.floor{position:absolute;left:-60%;right:-60%;bottom:-8%;height:52%;background-image:linear-gradient(#22e4ff40 2px,transparent 2px),linear-gradient(90deg,#22e4ff40 2px,transparent 2px);background-size:56px 56px;transform:perspective(380px) rotateX(64deg);transform-origin:bottom;animation:floor 2.6s linear infinite;-webkit-mask-image:linear-gradient(transparent,#000 55%);mask-image:linear-gradient(transparent,#000 55%);transition:opacity .4s}
body.table .floor{opacity:0}
body.table .rays{opacity:.45}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes drift{to{transform:translate(6%,4%) scale(1.15) rotate(6deg)}}
@keyframes floor{to{background-position:0 56px}}

/* ===== Menus ===== */
.scr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:max(22px,env(safe-area-inset-top)) 18px max(22px,env(safe-area-inset-bottom));text-align:center;z-index:2;animation:rise .5s cubic-bezier(.2,1.3,.4,1) both}
.scr.scroll{justify-content:flex-start;overflow-y:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch}
@keyframes rise{from{opacity:0;transform:translateY(30px) scale(.95)}}
.orbit{position:relative;width:min(320px,88vw);height:min(320px,88vw);display:flex;align-items:center;justify-content:center;flex:none}
.orb{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px;animation:orb 18s linear infinite;animation-delay:calc(var(--k) * -2.25s)}
.orb svg{filter:drop-shadow(0 0 10px #ff2bd6aa);animation:bob 2.4s ease-in-out infinite;animation-delay:calc(var(--k) * -.3s)}
@keyframes orb{from{transform:rotate(0deg) translateX(min(138px,38vw)) rotate(0deg)}to{transform:rotate(360deg) translateX(min(138px,38vw)) rotate(-360deg)}}
@keyframes bob{50%{transform:translateY(-4px) rotate(4deg)}}
.logo{font-family:var(--fd);line-height:.92;font-size:clamp(46px,15vw,74px);background:linear-gradient(180deg,#fff 0%,#fff3b0 30%,#ffb703 55%,#ff5e00 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 #9b1fd0) drop-shadow(0 8px 0 #2a0b4a) drop-shadow(0 0 26px #ff2bd6aa);transform:rotate(-5deg) scale(calc(1 + var(--b) * .04));position:relative;z-index:2}
.logo small{display:block;font-size:.62em;background:linear-gradient(180deg,#fff,#8ff6ff 45%,#1d6bff);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:3px}
.tag{font-size:18px;color:#e2dcff;margin:0;line-height:1.3;font-weight:700}
.foot{font-size:13px;color:var(--mut)}
.h{font-family:var(--fd);font-size:24px;margin:0;color:#fff;text-shadow:0 3px 0 #7a1fa8,0 0 18px #ff2bd666}
.hint{font-size:15px;color:#cfc8f7;margin:0;max-width:360px;line-height:1.3}
.btn{font-family:var(--fd);font-size:20px;letter-spacing:1px;border:0;border-radius:18px;padding:15px 24px;color:#2a0f00;background:linear-gradient(180deg,#fff27a,#ffb703);box-shadow:0 6px 0 #a35a00,0 12px 26px #0009;position:relative;overflow:hidden;transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #a35a00}
.btn::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,#ffffff77,transparent);transform:skewX(-20deg);animation:sh 3s infinite}
@keyframes sh{0%,55%{left:-60%}100%{left:130%}}
.btn.big{font-size:28px;padding:18px 46px;transform:scale(calc(1 + var(--b) * .03))}
.btn.pink{background:linear-gradient(180deg,#ff8aea,#ff2bd6);color:#fff;box-shadow:0 6px 0 #8a0f72,0 12px 26px #0009}
.btn.ghost{background:#ffffff14;color:#fff;box-shadow:0 4px 0 #0007;border:2px solid #ffffff35;font-size:16px}
.btn.sm{font-size:16px;padding:10px 18px;border-radius:14px}
.btn.sm::after{display:none}
.mute,.back{position:absolute;top:max(14px,env(safe-area-inset-top));width:44px;height:44px;border-radius:50%;border:2px solid #ffffff30;background:#0007;font-size:20px;z-index:5}
.mute{right:14px}.back{left:14px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:100%;max-width:380px}
.ccard{background:var(--card);border:3px solid #3a3380;border-radius:20px;padding:12px 6px 14px;font-family:var(--fd);font-size:36px;color:#fff;transition:transform .15s}
.ccard.on{border-color:var(--yellow);box-shadow:0 0 26px #ffe14d88;transform:scale(1.06)}
.ccard svg{display:block;margin:8px auto 0}
.pills{display:flex;gap:10px}
.pill{font-family:var(--fd);font-size:20px;min-width:74px;padding:10px;border-radius:14px;border:3px solid #3a3380;background:var(--card)}
.pill.on{border-color:var(--yellow);box-shadow:0 0 18px #ffe14d88}
.marq{width:100%;overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 15%,#000 85%,transparent);mask-image:linear-gradient(90deg,transparent,#000 15%,#000 85%,transparent)}
.marq div{display:inline-flex;gap:18px;font-size:30px;white-space:nowrap;animation:marq 22s linear infinite}
@keyframes marq{to{transform:translateX(-50%)}}
.ov{position:fixed;inset:0;z-index:90;background:#07051aee;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;animation:rise .35s both}
.steps{text-align:left;max-width:360px;font-size:16px;line-height:1.35;background:var(--card);border:2px solid #3a3380;border-radius:18px;padding:14px 16px}
.steps b{color:var(--yellow)}
.steps p{margin:0 0 8px}

/* ===== Table : zones des joueurs ===== */
.zone{position:absolute;z-index:1;overflow:hidden;border-radius:22px;background:linear-gradient(160deg,var(--ca),#0d0a26 78%);border:3px solid var(--c);box-shadow:inset 0 0 34px var(--cb),0 0 18px var(--ca);touch-action:none;transition:filter .3s,opacity .3s}
.zin{position:absolute;inset:0;display:flex;flex-direction:column;padding:8px 10px}
.zin.r{transform:rotate(180deg)}
.zh{display:flex;align-items:center;gap:6px;font-weight:800;font-size:15px;min-height:30px;flex:none}
.zh svg{flex:none}
.pn{font-family:var(--fd);font-size:11px;background:var(--c);color:#000;border-radius:7px;padding:3px 6px;flex:none}
.pn.big{font-size:15px;padding:4px 10px}
.nm{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;text-align:left}
.st{font-family:var(--fd);font-size:19px;color:var(--yellow);text-shadow:0 0 10px #ffe14d88;white-space:nowrap}
.zb{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;min-height:0}
.zhuge{font-family:var(--fd);font-size:clamp(30px,10vw,56px);line-height:1;text-shadow:0 0 20px var(--c),0 4px 0 #000}
.zhuge small{font-size:.45em}
.zbig{font-family:var(--fd);font-size:clamp(15px,4.8vw,23px);line-height:1.12}
.zsm{font-size:14px;color:#ddd7ff;font-weight:700}
.zone.wait{background:linear-gradient(160deg,#7a1228,#2a0610)}
.zone.go{background:linear-gradient(160deg,#18c862,#0a6a33)}
.zone.ok{background:linear-gradient(160deg,#1f9d5a,#0d3d24 80%)}
.zone.out{filter:grayscale(.9) brightness(.5)}
.zone.dim{opacity:.6}
.zone.win{animation:zwin .45s ease-in-out infinite alternate;border-color:#ffe14d}
@keyframes zwin{to{box-shadow:inset 0 0 60px #ffe14d77,0 0 44px #ffe14d}}
.zone.hot{animation:zhot .22s ease-in-out infinite alternate}
@keyframes zhot{to{background:linear-gradient(160deg,#ff3b3b,#5a0f1e);box-shadow:0 0 44px #ff3b3b;border-color:#fff}}
.zone.flashg{animation:zfg .4s}@keyframes zfg{30%{background:#1fbf6a}}
.zone.flashr{animation:zfr .4s}@keyframes zfr{30%{background:#c0213f}}
.zone.tapf{animation:ztap .12s}@keyframes ztap{50%{transform:scale(.97);filter:brightness(1.4)}}
.zone.ghost{opacity:.55;pointer-events:none}
.area{position:absolute;left:0;right:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
.mid{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);z-index:6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;pointer-events:none;text-align:center;padding:0 12px}
.mid>div{display:flex;flex-direction:column;align-items:center;gap:4px}
.mid .r,.dual .r,.r{transform:rotate(180deg)}
.mid button{pointer-events:auto}
.pz{position:absolute;left:6px;top:50%;margin-top:-19px;width:38px;height:38px;border-radius:50%;border:2px solid #ffffff40;background:#000a;font-size:15px;z-index:9}
.dual{display:flex;flex-direction:column;align-items:center;justify-content:space-around;height:100%;width:100%;padding:4px 12px;gap:4px}
.dual>div{display:flex;flex-direction:column;align-items:center;gap:4px}
.cd{font-family:var(--fd);font-size:86px;line-height:1;color:#fff;text-shadow:0 0 34px var(--pink),0 6px 0 #000;animation:cd .6s cubic-bezier(.2,1.6,.4,1) both}
.cd.go{color:var(--yellow);text-shadow:0 0 40px var(--yellow),0 6px 0 #000}
@keyframes cd{from{transform:scale(3) rotate(-10deg);opacity:0}}
.fin{font-family:var(--fd);font-size:58px;color:var(--yellow);text-shadow:0 0 34px var(--yellow),0 5px 0 #000;animation:cd .5s both;line-height:1}
.emo{font-size:58px;line-height:1}
.chrono{font-family:var(--fd);font-size:58px;font-variant-numeric:tabular-nums;color:#fff;text-shadow:0 0 22px var(--cyan),0 4px 0 #000;line-height:1}
.chrono.blur{filter:blur(7px);color:var(--pink)}
.ft{position:absolute;left:50%;top:42%;font-family:var(--fd);font-size:38px;color:var(--yellow);text-shadow:0 0 14px currentColor,0 3px 0 #000;animation:ft 1s forwards;pointer-events:none;z-index:6;white-space:nowrap}
@keyframes ft{0%{transform:translate(-50%,0) scale(.4);opacity:0}20%{transform:translate(-50%,-10px) scale(1.3);opacity:1}100%{transform:translate(-50%,-80px) scale(1);opacity:0}}

/* Sélection des héros */
.selav svg{filter:drop-shadow(0 0 18px var(--c));animation:bob 2.4s ease-in-out infinite}
.selrow{display:flex;align-items:center;justify-content:center;gap:6px;width:100%}
.arr{width:38px;height:38px;border-radius:50%;border:0;background:var(--c);color:#000;font-size:15px;box-shadow:0 4px 0 #0008;flex:none}
.arr:active{transform:translateY(3px);box-shadow:none}
.selnm{font-family:var(--fd);font-size:14px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-bottom:2px dotted #ffffff70;padding-bottom:2px}
.rdy{font-family:var(--fd);font-size:19px;border-radius:14px;padding:11px 22px;background:#ffffff1a;border:3px solid var(--c);box-shadow:0 4px 0 #0008}
.zone.ok .rdy{background:#39ff88;color:#04210f;border-color:#fff}

/* Roulette / intro / résultats */
.rt{font-family:var(--fd);font-size:13px;color:var(--cyan);letter-spacing:2px;text-shadow:0 0 10px #22e4ff88}
.rcard{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 20px;border-radius:24px;background:linear-gradient(180deg,#2e2380,#120c38);border:3px solid var(--cyan);box-shadow:0 0 34px #22e4ff88;min-width:72%;margin:8px 0}
.rcard .ri{font-size:68px;line-height:1}
.rcard .rn{font-family:var(--fd);font-size:20px}
.rcard.bump{animation:bump .12s}@keyframes bump{50%{transform:scale(1.07)}}
.rcard.land{animation:land .7s cubic-bezier(.2,1.6,.4,1);border-color:var(--yellow);box-shadow:0 0 60px #ffe14d}
@keyframes land{from{transform:scale(1.7) rotate(-6deg)}}
.gi{font-size:76px;line-height:1;animation:gi .8s cubic-bezier(.2,1.6,.4,1) both;filter:drop-shadow(0 0 22px #ff2bd6)}
@keyframes gi{from{transform:scale(0) rotate(-180deg)}}
.gname{font-family:var(--fd);font-size:22px;color:var(--yellow);text-shadow:0 0 14px #ffe14d88,0 3px 0 #000}
.grule{font-size:15px;line-height:1.2;font-weight:700;max-width:96%}
.medal{font-size:46px;line-height:1;animation:gi .6s both}
.medal.big{font-size:64px}
.plus{font-family:var(--fd);font-size:46px;color:var(--yellow);text-shadow:0 0 22px var(--yellow),0 4px 0 #000;animation:cd .6s both;line-height:1}
.stand{display:flex;gap:12px;justify-content:center;align-items:flex-end}
.sti{display:flex;flex-direction:column;align-items:center;font-family:var(--fd);font-size:17px}
.crn{height:20px;font-size:18px;line-height:1}
.champ svg{filter:drop-shadow(0 0 30px #ffe14d);animation:bob 1.6s ease-in-out infinite}

/* Mini-jeux */
.track{position:relative;width:94%;height:66px}
.lane{position:absolute;left:0;right:0;bottom:6px;height:6px;border-radius:3px;background:repeating-linear-gradient(90deg,#fff 0 12px,transparent 12px 22px);opacity:.5}
.flag{position:absolute;right:-6px;bottom:4px;font-size:30px}
.runner{position:absolute;bottom:8px;transition:left .1s;filter:drop-shadow(0 0 10px var(--c))}
.runner.hop svg{animation:hop .15s}
@keyframes hop{50%{transform:translateY(-12px) rotate(-10deg)}}
.cool{width:70%;height:10px;border-radius:5px;background:#ffffff22;overflow:hidden}
.cool i{display:block;height:100%;width:100%;background:var(--c);box-shadow:0 0 10px var(--c)}
.gcv{position:absolute;left:0;top:0;touch-action:none;z-index:3}
.bomb{position:absolute;left:50%;top:50%;font-size:92px;line-height:1;transform:translate(-50%,-50%) scale(var(--s,1));transition:left .35s cubic-bezier(.3,1.5,.5,1),top .35s cubic-bezier(.3,1.5,.5,1);filter:drop-shadow(0 0 22px #ff7b00)}
.bomb.exp{animation:exp .6s forwards}
@keyframes exp{to{transform:translate(-50%,-50%) scale(3.2);opacity:0;filter:brightness(3)}}
.spotbig{font-size:min(120px,20vh);line-height:1;filter:drop-shadow(0 0 20px #ffffff55)}
.pop{animation:popin .25s cubic-bezier(.2,1.6,.4,1)}
@keyframes popin{from{transform:scale(.3);opacity:.3}}
.cword{font-family:var(--fd);font-size:min(56px,13vw);line-height:1.1;text-shadow:0 4px 0 #000,0 0 14px #0008}
.qq{font-weight:800;font-size:15px;line-height:1.15;max-width:98%}
.qcat{font-family:var(--fd);font-size:11px;color:var(--cyan);letter-spacing:1px}
.opts{display:grid;gap:6px;width:100%;flex:1;align-content:stretch;padding-bottom:2px}
.opts.n4{grid-template-rows:repeat(4,1fr)}
.opts.n2{grid-template-columns:1fr 1fr}
.opt{border:2px solid #ffffff35;border-radius:14px;background:#ffffff14;font-weight:800;font-size:clamp(12px,3.6vw,16px);line-height:1.1;padding:4px 6px;min-height:38px;box-shadow:0 3px 0 #0008}
.opt small{display:block;font-weight:600;font-size:.82em;color:#d4cdff;margin-top:1px}
.opt:active{transform:translateY(2px)}
.opts.n2 .opt{font-family:var(--fd);font-size:21px}
.opts.n2 .opt:first-child{background:#13824a}.opts.n2 .opt:last-child{background:#a3203b}
.opt.good{background:#1fbf6a!important;border-color:#b9ffd6;box-shadow:0 0 22px #39ff88}
.opt.bad{background:#5a0f1e!important;opacity:.6}
.vinyl{width:min(130px,16vh);height:min(130px,16vh);border-radius:50%;background:repeating-radial-gradient(#111 0 3px,#262626 3px 5px);border:5px solid var(--pink);box-shadow:0 0 34px var(--pink);overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:40px}
.vinyl.spin{animation:spin 1.8s linear infinite}
.vinyl img{width:100%;height:100%;object-fit:cover}
.cfield{position:relative;width:100%;height:100%;transition:opacity .2s}
.cfield span{position:absolute;font-size:28px;line-height:1;margin:-14px 0 0 -14px}
.field{position:relative;align-self:stretch;flex:1}
.tgt{position:absolute;width:76px;height:76px;margin:-38px 0 0 -38px;border:0;border-radius:50%;font-size:50px;line-height:76px;padding:0;background:radial-gradient(circle,#ffe14d66,transparent 70%);animation:popin .2s cubic-bezier(.2,1.6,.4,1)}
.tgt.bm{background:radial-gradient(circle,#ff4d6d66,transparent 70%)}
.rope{position:relative;width:100%;height:100%}
.rline{position:absolute;left:50%;top:0;bottom:0;width:10px;margin-left:-5px;background:repeating-linear-gradient(45deg,#d9b277 0 6px,#8a6a3a 6px 12px);border-radius:5px;box-shadow:0 0 12px #0008}
.knot{position:absolute;left:50%;top:50%;font-size:44px;line-height:1;transform:translate(-50%,-50%);transition:top .08s;filter:drop-shadow(0 0 14px #ff2bd6)}
.rmark{position:absolute;left:8%;right:8%;height:5px;border-radius:3px}
.rmark.t{top:5%}.rmark.b{bottom:5%}
.hsc{font-family:var(--fd);font-size:40px;text-shadow:0 4px 0 #000}
.draww{position:absolute;inset:0;z-index:7;background:#0d0a26;display:flex;flex-direction:column}
.draww canvas{flex:1;background:#fff;touch-action:none;width:100%}
.dbar{height:66px;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 8px;flex:none}
.dt{font-family:var(--fd);font-size:24px;min-width:40px}
.dot{width:32px;height:32px;border-radius:50%;border:3px solid transparent;padding:0;font-size:16px;flex:none}
.dot.on{border-color:#fff}
.wordz{color:var(--yellow);font-size:clamp(26px,8vw,44px)}

/* Effets */
.wipe{position:fixed;top:0;bottom:0;left:-30%;right:-30%;z-index:80;pointer-events:none;background:repeating-linear-gradient(115deg,#ff2bd6 0 46px,#7b2cff 46px 92px,#22e4ff 92px 138px);transform:translateX(-120%) skewX(-12deg);animation:wipe .9s cubic-bezier(.7,0,.3,1) forwards}
@keyframes wipe{45%,55%{transform:translateX(0) skewX(-12deg)}100%{transform:translateX(120%) skewX(-12deg)}}
.flash{position:fixed;inset:0;z-index:70;pointer-events:none;animation:fl .35s forwards}
@keyframes fl{from{opacity:.8}to{opacity:0}}
#stage.shake{animation:shk .4s}
@keyframes shk{20%{transform:translate(-8px,5px)}40%{transform:translate(7px,-6px)}60%{transform:translate(-5px,-4px)}80%{transform:translate(4px,5px)}}
</style>
</head>
<body>
<div class="bgfx"><div class="rays"></div><div class="glow"></div><div class="floor"></div></div>
<div id="stage"></div>
<script>
const QUESTIONS=[
["Géographie","Quelle est la capitale de l'Australie ?",["Canberra","Sydney","Melbourne","Perth"]],
["Géographie","Quel est le plus long fleuve de France ?",["La Loire","La Seine","Le Rhône","La Garonne"]],
["Géographie","Quel pays a la forme d'une botte ?",["L'Italie","L'Espagne","La Grèce","Le Portugal"]],
["Géographie","Quel est le plus grand océan du monde ?",["Le Pacifique","L'Atlantique","L'Indien","L'Arctique"]],
["Géographie","Dans quel pays se trouve la ville de Marrakech ?",["Le Maroc","La Tunisie","L'Égypte","L'Algérie"]],

/* Musique de fond générée (aucun fichier) */
const M={on:false,step:0,next:0,bpm:104,mode:"menu",gain:null,timer:null,vol:.3};
function musicStart(){if(muted||M.on)return;try{const a=ac();if(!M.gain){M.gain=a.createGain();M.gain.gain.value=M.vol;M.gain.connect(a.destination)}M.on=true;M.next=a.currentTime+.08;M.step=0;M.timer=setInterval(msched,25)}catch(e){}}
function musicStop(){M.on=false;clearInterval(M.timer)}
function musicMode(m){M.mode=m;M.bpm=m==="battle"?136:104}
function musicDuck(d){if(M.gain&&AC)M.gain.gain.setTargetAtTime(d?.0001:M.vol,AC.currentTime,.12)}
function beat(){const r=document.documentElement.style;r.setProperty("--b",1);setTimeout(()=>r.setProperty("--b",0),70)}
const CH=[[110,[0,3,7]],[87.31,[0,4,7]],[130.81,[0,4,7]],[98,[0,4,7]]],LEAD=[0,-1,1,-1,2,-1,1,2,0,-1,1,-1,3,2,1,-1];
function mnote(f,t,d,type,v,filt){const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);let n=o;if(filt){const fl=AC.createBiquadFilter();fl.type="lowpass";fl.frequency.value=filt;o.connect(fl);n=fl}n.connect(g);g.connect(M.gain);o.start(t);o.stop(t+d+.02)}
function mnz(t,d,v,hp){const s=AC.createBufferSource();s.buffer=NB;const f=AC.createBiquadFilter();f.type="highpass";f.frequency.value=hp;const g=AC.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(f);f.connect(g);g.connect(M.gain);s.start(t);s.stop(t+d+.02)}
function mstep(st,t){
  const i=st&15,[root,ch]=CH[(st>>4)&3],bt=M.mode==="battle";
  if(i%4===0){const o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(40,t+.12);g.gain.setValueAtTime(.95,t);g.gain.exponentialRampToValueAtTime(.0001,t+.22);o.connect(g);g.connect(M.gain);o.start(t);o.stop(t+.25);setTimeout(beat,Math.max(0,(t-AC.currentTime)*1000))}
  if(bt&&(i===4||i===12))mnz(t,.15,.42,1500);
  if(i%2===0)mnz(t,.04,i%4===2?.2:.1,7000);
  if(bt&&i===14)mnz(t,.12,.14,6000);
  if(i%2===0)mnote(root*Math.pow(2,[0,0,12,0,0,12,0,7][i>>1]/12),t,.2,"sawtooth",.3,420);
  mnote(root*4*Math.pow(2,(ch[i%3]+((i>>2)&1?12:0))/12),t,.12,bt?"square":"triangle",bt?.045:.07,2400);
  if(bt&&LEAD[i]>=0)mnote(root*8*Math.pow(2,(ch[LEAD[i]%3]+(LEAD[i]>2?12:0))/12),t,.16,"square",.035,3200);
}
function msched(){if(!AC)return;while(M.next<AC.currentTime+.12){mstep(M.step,M.next);M.next+=60/M.bpm/4;M.step++}}

  c.width=innerWidth;c.height=innerHeight;document.body.appendChild(c);const x=c.getContext("2d");

  const ps=Array.from({length:n},()=>({x:c.width/2,y:c.height/2,vx:(Math.random()-.5)*20,vy:(Math.random()-.5)*20,s:6+Math.random()*7,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[Math.random()*6|0]}));

function layout(n,edge){
  const bot=n===2?[0]:[0,1],top=n===2?[1]:n===3?[2]:[3,2],Z=[];

  top.forEach((p,k)=>{Z[p]={i:p,l:k/top.length,t:0,w:1/top.length,h:edge,rot:180}});
  return Z;
}

/* Buzz : même question pour tous, réponses dans chaque coin */
function buzz(c,{rounds,gen,penalty=false,tmo=15000}){
  const pts=Array(c.n).fill(0);let k=0,cur=null,lock,solved;
  c.Z.forEach(z=>c.score(z.i,0));
  const ask=()=>{if(RUN!==c.run)return;if(k>=rounds)return c.finish(rankBy(pts));k++;cur=gen(k);lock=new Set();solved=false;
    c.area.innerHTML=cur.html;
    c.Z.forEach(z=>{c.cls(z.i,"out",false);c.body(z.i,`<div class="opts n${cur.opts.length}">${cur.opts.map((o,j)=>`<button class="opt" data-j="${j}">${o}</button>`).join("")}</div>`);
      z.zb.querySelectorAll(".opt").forEach(b=>on(b,()=>pickOpt(z.i,+b.dataset.j,b)))});
    if(cur.onShow)cur.onShow();
    cur.tm=T(tmo,()=>reveal(-1))};
  const pickOpt=(i,j,b)=>{if(solved||lock.has(i))return;
    if(j===cur.ok){pts[i]++;c.score(i,pts[i]);b.classList.add("good");c.cls(i,"win");c.ft(i,"+1");sfx.coin();reveal(i)}
    else{lock.add(i);b.classList.add("bad");c.cls(i,"out");sfx.bad();if(penalty){pts[i]--;c.score(i,pts[i]);c.ft(i,"−1","#ff4d6d")}if(lock.size>=c.n)reveal(-1)}};
  const reveal=w=>{if(solved)return;solved=true;clearTimeout(cur.tm);
    c.Z.forEach(z=>z.zb.querySelectorAll(".opt").forEach(b=>{if(+b.dataset.j===cur.ok)b.classList.add("good")}));
    if(cur.onEnd)cur.onEnd(w);
    T(1900,()=>{c.Z.forEach(z=>c.cls(z.i,"win",false));ask()})};
  ask();
}
/* Spot : quelque chose défile au centre, touchez au bon moment */
function spot(c,{next,isHit,render,goal=3,speed=[850,480]}){
  const pts=Array(c.n).fill(0),lock=Array(c.n).fill(0);let cur=null,claimed=false,over=false,k=0;
  c.Z.forEach(z=>c.score(z.i,0));
  const step=()=>{if(over)return;cur=next(cur);claimed=false;render(cur);k++;T(Math.max(speed[1],speed[0]-k*14),step)};
  c.Z.forEach(z=>c.tap(z.i,()=>{const i=z.i;if(over||cur==null||performance.now()<lock[i])return;
    if(isHit(cur)){if(claimed)return;claimed=true;pts[i]++;c.score(i,pts[i]);c.blink(i,"flashg");c.ft(i,"+1");sfx.coin();
      if(pts[i]>=goal){over=true;c.cls(i,"win");T(1000,()=>c.finish(rankBy(pts)))}}
    else{pts[i]--;c.score(i,pts[i]);c.blink(i,"flashr");c.ft(i,"−1","#ff4d6d");sfx.bad();lock[i]=performance.now()+700}}));
  T(1900,step);T(45000,()=>{if(!over){over=true;c.finish(rankBy(pts))}});
}

   render:e=>{["cw1","cw2"].forEach(id=>{const el=$("#"+id);if(!el)return;el.textContent=e.w;el.style.color=e.col;el.classList.remove("pop");void el.offsetWidth;el.classList.add("pop")})}})}},

quiz:{name:"Quiz Buzz",icon:"🧠",edge:.4,
 rule:"Une question au centre, 4 réponses dans votre coin. Le premier qui touche la bonne réponse marque. Une erreur et vous êtes bloqué pour cette question.",
 start(c){const qs=shuffle(QUESTIONS).slice(0,5);
  buzz(c,{rounds:5,gen:k=>{const[cat,q,a]=qs[k-1],o=shuffle(a.map((t,j)=>({t,ok:j===0})));
   return{html:dual(`<div class="qcat">${esc(cat).toUpperCase()} · ${k}/5</div><div class="qq">${esc(q)}</div>`),opts:o.map(x=>esc(x.t)),ok:o.findIndex(x=>x.ok)}}})}},

vf:{name:"Vrai ou Faux",icon:"✅",edge:.36,
 rule:"Une affirmation au centre : touchez VRAI ou FAUX dans votre coin. Le plus rapide marque, mais une erreur coûte un point !",
 start(c){const qs=shuffle(VF).slice(0,6);
  buzz(c,{rounds:6,penalty:true,gen:k=>{const[t,v]=qs[k-1];return{html:dual(`<div class="qcat">${k}/6</div><div class="qq" style="font-size:17px">${esc(t)}</div>`),opts:["VRAI","FAUX"],ok:v?0:1}}})}},

compte:{name:"Compte éclair",icon:"🔢",edge:.36,
 rule:"Des objets apparaissent un court instant au centre. Comptez vite ! Puis touchez le bon nombre dans votre coin.",
 start(c){const E=["⭐","🍕","🐸","🎈","🍩","⚽","🐟","🍒","🦆","🍄"];
  buzz(c,{rounds:5,tmo:9000,gen:k=>{const n=5+(Math.random()*8|0)+k,e=pick(E),cells=shuffle([...Array(32).keys()]).slice(0,n);
   const sp=cells.map(q=>`<span style="left:${(q%8)*12+6+rnd(-2.5,2.5)}%;top:${(q>>3)*24+14+rnd(-5,5)}%">${e}</span>`).join("");
   const cand=shuffle([n-2,n-1,n+1,n+2,n+3].filter(v=>v>0)).slice(0,3),o=[n,...cand].sort((a,b)=>a-b);
   return{html:`<div class="cfield" id="cf">${sp}</div>`,opts:o.map(String),ok:o.indexOf(n),
    onShow:()=>T(Math.max(1100,1900-k*150),()=>{const f=$("#cf");if(f)f.innerHTML=dual(`<div class="zbig">Combien de ${e} ?</div>`)}),
    onEnd:()=>{const f=$("#cf");if(f)f.innerHTML=dual(`<div class="zbig">Il y en avait ${n} ${e}</div>`)}}}})}},

blind:{name:"Blind Test Buzz",icon:"🎧",edge:.4,need:()=>G.tracks&&G.tracks.length>=6,
 rule:"Un extrait de musique démarre. Touchez le bon titre dans votre coin avant les autres ! Une erreur et vous êtes bloqué.",
 start(c){const ts=shuffle(G.tracks);
  buzz(c,{rounds:Math.min(5,ts.length),tmo:22000,gen:k=>{const t=ts[k-1],dec=shuffle(G.tracks.filter(x=>x!==t&&x.artistName!==t.artistName)).slice(0,3),o=shuffle([t,...dec]);
   return{html:`<div class="vinyl spin" id="vy">🎵</div><div class="rt" style="margin-top:8px">${k} / ${Math.min(5,ts.length)}</div>`,
    opts:o.map(x=>`${esc(cleanT(x.trackName))}<small>${esc(x.artistName)}</small>`),ok:o.indexOf(t),
    onShow:()=>{try{BA.src=t.previewUrl;BA.currentTime=0;const p=BA.play();if(p&&p.catch)p.catch(()=>{});musicDuck(true)}catch(e){}},
    onEnd:()=>{try{BA.pause()}catch(e){}musicDuck(false);const v=$("#vy");if(v&&t.artworkUrl100){v.classList.remove("spin");v.innerHTML=`<img src="${esc(t.artworkUrl100.replace("100x100","300x300"))}" alt="">`}}}}})}},

etoiles:{name:"Attrape-étoiles",icon:"⭐",edge:.5,
 rule:"Des étoiles apparaissent dans votre coin, au même endroit pour tout le monde. Touchez-les avant les autres ! Attention aux bombes : moins 1 point.",
 start(c){const pts=Array(c.n).fill(0);let k=0,cur=null,over=false;
  c.Z.forEach(z=>{c.score(z.i,0);c.body(z.i,`<div class="field"></div>`)});
  const clearAll=()=>c.Z.forEach(z=>{const f=z.zb.querySelector(".field");if(f)f.innerHTML=""});
  const spawn=()=>{if(over)return;if(k>=12){over=true;return c.finish(rankBy(pts))}k++;
   const bomb=k>2&&Math.random()<.3,x=12+Math.random()*76,y=14+Math.random()*72,id=k;cur={bomb,id};
   c.Z.forEach(z=>{const f=z.zb.querySelector(".field");f.innerHTML=`<button class="tgt ${bomb?"bm":""}" style="left:${x}%;top:${y}%">${bomb?"💣":"⭐"}</button>`;on(f.firstChild,()=>hit(z.i,id,f))});
   T(bomb?1300:2400,()=>{if(cur&&cur.id===id){cur=null;clearAll();T(350,spawn)}})};
  const hit=(i,id,f)=>{if(over||!cur||cur.id!==id)return;
   if(cur.bomb){pts[i]--;c.score(i,pts[i]);c.blink(i,"flashr");c.ft(i,"−1","#ff4d6d");sfx.bad();f.innerHTML="";return}
   cur=null;pts[i]++;c.score(i,pts[i]);c.blink(i,"flashg");c.ft(i,"+1");sfx.coin();clearAll();T(rnd(400,900),spawn)};
  T(500,spawn)}},

corde:{name:"Tir à la corde",icon:"🪢",edge:.25,
 rule:"L'équipe du bas contre l'équipe du haut ! Tapez votre coin comme des fous pour tirer la corde de votre côté.",
 setup(c){const b=c.Z.find(z=>!z.rot).i,t=c.Z.find(z=>z.rot).i;
  c.area.innerHTML=`<div class="rope"><div class="rmark t" style="background:${PCOL[t]};box-shadow:0 0 14px ${PCOL[t]}"></div><div class="rline"></div><div class="knot" id="kn">🎀</div><div class="rmark b" style="background:${PCOL[b]};box-shadow:0 0 14px ${PCOL[b]}"></div></div>`;
  c.Z.forEach(z=>c.body(z.i,`<div class="zhuge">TIRE !</div><div class="zsm">${z.rot?"Équipe du haut":"Équipe du bas"}</div>`))},
 start(c){const bot=c.Z.filter(z=>!z.rot).map(z=>z.i),top=c.Z.filter(z=>z.rot).map(z=>z.i),kn=$("#kn");let p=0,over=false;
  const win=b=>{over=true;const W=b?bot:top;flash(PCOL[W[0]]);sfx.win();W.forEach(i=>c.cls(i,"win"));T(1300,()=>c.finish(c.Z.map(z=>W.includes(z.i)?0:1),c.Z.map(z=>W.includes(z.i)?c.n-1:0)))};
  c.Z.forEach(z=>c.tap(z.i,()=>{if(over)return;p+=(z.rot?-1:1)*.045/(z.rot?top:bot).length;sfx.tap(z.rot?3:9);c.blink(z.i,"tapf");kn.style.top=(50+p*45)+"%";if(Math.abs(p)>=1)win(p>0)}));
  T(30000,()=>{if(!over)win(p>0)})}},

hockey:{name:"Air Hockey",icon:"🏒",edge:.5,
 rule:"Glissez le doigt dans votre zone pour bouger votre palet. Marquez dans le but d'en face ! Équipe du bas contre équipe du haut, premier à 3 buts (80 secondes max).",
 setup(c){c.Z.forEach(z=>{z.el.classList.add("ghost");c.body(z.i,"")});
  const{cv,x,w,h}=canvasIn(stage),pr=Math.min(w,h)*.08,kr=pr*.72,gw=w*.44;
  const bot=c.Z.filter(z=>!z.rot).map(z=>z.i),top=c.Z.filter(z=>z.rot).map(z=>z.i);
  const pads=c.Z.map(z=>({i:z.i,z,x:(z.l+z.w/2)*w,y:z.rot?h*.2:h*.8,vx:0,vy:0,tx:null,ty:null,img:avImg(c.P[z.i].av)}));
  const pk={x:w/2,y:h/2,vx:0,vy:0},own=new Map();let sb=0,stp=0,over=false,pause=0,tt=0;
  const pos=e=>{const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
  cv.addEventListener("pointerdown",e=>{e.preventDefault();const[px,py]=pos(e),p=pads.find(q=>px>=q.z.l*w&&px<=(q.z.l+q.z.w)*w&&py>=q.z.t*h&&py<=(q.z.t+q.z.h)*h);if(!p)return;own.set(e.pointerId,p);try{cv.setPointerCapture(e.pointerId)}catch(_){}p.tx=px;p.ty=py});
  cv.addEventListener("pointermove",e=>{const p=own.get(e.pointerId);if(!p)return;const[px,py]=pos(e);p.tx=px;p.ty=py});
  const up=e=>own.delete(e.pointerId);cv.addEventListener("pointerup",up);cv.addEventListener("pointercancel",up);
  c.hscore=()=>{bot.forEach(i=>c.score(i,"⚽ "+sb+" – "+stp));top.forEach(i=>c.score(i,"⚽ "+stp+" – "+sb))};
  const goal=b=>{if(b)sb++;else stp++;c.hscore();sfx.goal();flash(PCOL[(b?bot:top)[0]]);shake();(b?bot:top).forEach(i=>c.ft(i,"BUT !"));say("But !");
   if(sb>=3||stp>=3){over=true;const W=sb>=3?bot:top;W.forEach(i=>{c.Z[i].el.classList.remove("ghost");c.cls(i,"win")});T(1600,()=>c.finish(c.Z.map(z=>W.includes(z.i)?0:1),c.Z.map(z=>W.includes(z.i)?c.n-1:0)));return}
   pk.x=w/2;pk.y=h/2;pk.vx=0;pk.vy=(b?-1:1)*h*.12;pause=1};
  LOOP(dt=>{
   pads.forEach(p=>{if(p.tx==null||!c.go){p.vx=p.vy=0;return}const z=p.z,nx=Math.min(Math.max(p.tx,z.l*w+pr),(z.l+z.w)*w-pr),ny=Math.min(Math.max(p.ty,z.t*h+pr),(z.t+z.h)*h-pr);p.vx=(nx-p.x)/Math.max(dt,.008);p.vy=(ny-p.y)/Math.max(dt,.008);p.x=nx;p.y=ny});
   if(c.go&&!over){tt+=dt;if(tt>80){over=true;if(sb===stp){c.finish(c.Z.map(()=>0),c.Z.map(()=>0));return false}const W=sb>stp?bot:top;W.forEach(i=>{c.Z[i].el.classList.remove("ghost");c.cls(i,"win")});sfx.win();T(1500,()=>c.finish(c.Z.map(z=>W.includes(z.i)?0:1),c.Z.map(z=>W.includes(z.i)?c.n-1:0)));return}
    if(pause>0)pause-=dt;else{pk.x+=pk.vx*dt;pk.y+=pk.vy*dt}
    const f=Math.pow(.75,dt);pk.vx*=f;pk.vy*=f;
    if(pk.x<kr){pk.x=kr;pk.vx=Math.abs(pk.vx)*.9;sfx.wall()}else if(pk.x>w-kr){pk.x=w-kr;pk.vx=-Math.abs(pk.vx)*.9;sfx.wall()}
    const ing=Math.abs(pk.x-w/2)<gw/2-kr*.3;
    if(pk.y<kr&&!ing){pk.y=kr;pk.vy=Math.abs(pk.vy)*.9;sfx.wall()}else if(pk.y>h-kr&&!ing){pk.y=h-kr;pk.vy=-Math.abs(pk.vy)*.9;sfx.wall()}
    if(pk.y<-kr)goal(true);else if(pk.y>h+kr)goal(false);
    pads.forEach(p=>{const dx=pk.x-p.x,dy=pk.y-p.y,d=Math.hypot(dx,dy)||1;if(d<pr+kr){const nx=dx/d,ny=dy/d;pk.x=p.x+nx*(pr+kr);pk.y=p.y+ny*(pr+kr);const rv=(pk.vx-p.vx)*nx+(pk.vy-p.vy)*ny;if(rv<0){pk.vx-=1.85*rv*nx;pk.vy-=1.85*rv*ny;sfx.hit()}}});
    const sp=Math.hypot(pk.vx,pk.vy),mx=h*2.4;if(sp>mx){pk.vx*=mx/sp;pk.vy*=mx/sp}}
   x.clearRect(0,0,w,h);
   x.strokeStyle="#22e4ff66";x.lineWidth=3;x.beginPath();x.moveTo(0,h/2);x.lineTo(w,h/2);x.stroke();x.beginPath();x.arc(w/2,h/2,Math.min(w,h)*.16,0,7);x.stroke();
   x.save();x.shadowBlur=22;x.fillStyle=x.shadowColor=PCOL[top[0]];x.fillRect(w/2-gw/2,0,gw,8);x.fillStyle=x.shadowColor=PCOL[bot[0]];x.fillRect(w/2-gw/2,h-8,gw,8);x.restore();
   pads.forEach(p=>{const col=PCOL[p.i];x.save();x.translate(p.x,p.y);x.beginPath();x.arc(0,0,pr,0,7);x.fillStyle=col;x.shadowColor=col;x.shadowBlur=24;x.fill();x.shadowBlur=0;x.beginPath();x.arc(0,0,pr*.8,0,7);x.fillStyle="#0d0a26";x.fill();
    if(p.img.complete&&p.img.naturalWidth){x.beginPath();x.arc(0,0,pr*.74,0,7);x.clip();x.drawImage(p.img,-pr*.74,-pr*.74,pr*1.48,pr*1.48)}x.restore()});
   x.save();x.beginPath();x.arc(pk.x,pk.y,kr,0,7);x.fillStyle="#fff";x.shadowColor="#22e4ff";x.shadowBlur=28;x.fill();x.restore();
  })},
 start(c){T(650,()=>c.hscore&&c.hscore())}},

dessin:{name:"Dessin éclair",icon:"✏️",edge:.5,
 rule:"Un joueur tiré au sort dessine un mot secret, les autres crient leurs réponses. Celui qui trouve gagne des points, le dessinateur aussi !",
 start(c){const d=Math.random()*c.n|0,word=pick([...WORDS["Facile"],...WORDS["Moyen"]]),nm=esc(c.P[d].name);
  c.Z.forEach(z=>c.body(z.i,z.i===d?`<div class="zbig">C'est toi qui dessines !</div><button class="btn sm" id="see">👀 VOIR MON MOT</button>`:`<div class="zhuge">🙈</div><div class="zbig">${nm} dessine</div><div class="zsm">Ne regarde pas son coin !</div>`));
  c.cls(d,"win");c.mid(`<div class="zbig" style="text-shadow:0 3px 0 #000">✏️ ${nm}</div>`);say(c.P[d].name+" dessine !");
  on($("#see"),()=>{c.body(d,`<div class="zsm">Ton mot secret</div><div class="zhuge wordz">${esc(word)}</div><button class="btn sm" id="drw">✏️ JE DESSINE</button>`);on($("#drw"),draw)});
  function draw(){c.cls(d,"win",false);c.mid("");
   const wr=document.createElement("div");wr.className="draww";
   wr.innerHTML=`<canvas></canvas><div class="dbar"><div class="dt" id="dt">60</div>${COLORS.map((col,k)=>`<button class="dot ${k?"":"on"}" style="background:${col}" data-c="${col}"></button>`).join("")}<button class="dot" data-c="#ffffff" style="background:#fff">🧽</button><button class="btn sm" id="fnd">TROUVÉ !</button></div>`;
   stage.appendChild(wr);
   const cv=wr.querySelector("canvas"),dpr=Math.min(2,window.devicePixelRatio||1),w=cv.clientWidth,h=cv.clientHeight;cv.width=w*dpr;cv.height=h*dpr;
   const x=cv.getContext("2d");x.scale(dpr,dpr);x.fillStyle="#fff";x.fillRect(0,0,w,h);x.lineCap=x.lineJoin="round";
   let col=COLORS[0],sz=5,dr=false,lx=0,ly=0,left=60,ended=false;
   const ps=e=>{const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
   cv.addEventListener("pointerdown",e=>{e.preventDefault();dr=true;[lx,ly]=ps(e);try{cv.setPointerCapture(e.pointerId)}catch(_){}x.strokeStyle=col;x.lineWidth=sz;x.beginPath();x.moveTo(lx,ly);x.lineTo(lx+.1,ly+.1);x.stroke()});
   cv.addEventListener("pointermove",e=>{if(!dr)return;const[px,py]=ps(e);x.strokeStyle=col;x.lineWidth=sz;x.beginPath();x.moveTo(lx,ly);x.lineTo(px,py);x.stroke();lx=px;ly=py});
   cv.addEventListener("pointerup",()=>dr=false);cv.addEventListener("pointercancel",()=>dr=false);
   wr.querySelectorAll(".dot").forEach(b=>on(b,()=>{col=b.dataset.c;sz=col==="#ffffff"?26:5;wr.querySelectorAll(".dot").forEach(o=>o.classList.toggle("on",o===b))}));
   const iv=IV(1000,()=>{left--;const e=$("#dt");if(e)e.textContent=left;if(left<=5&&left>0)sfx.tick();if(left<=0)who()});
   on($("#fnd"),who);
   function who(){if(ended)return;ended=true;clearInterval(iv);wr.remove();sfx.go();
    c.mid(`<div class="zbig" style="text-shadow:0 3px 0 #000">C'était : ${esc(word)}</div><button class="btn sm" data-act="nobody">😅 PERSONNE</button>`);
    ACT.nobody=()=>{ACT.nobody=null;c.finish(Array(c.n).fill(0),Array(c.n).fill(0))};
    c.Z.forEach(z=>{if(z.i===d){c.body(d,`<div class="zbig">Qui a trouvé ?</div>`);return}
     c.body(z.i,`<button class="btn">🙋 C'EST MOI !</button>`);on(z.zb.querySelector("button"),()=>{ACT.nobody=null;const n=c.n,pl=Array(n).fill(2),pt=Array(n).fill(0);pl[z.i]=0;pl[d]=1;pt[z.i]=n-1;pt[d]=Math.max(1,Math.ceil((n-1)/2));c.finish(pl,pt)})})}
  }}}
};
