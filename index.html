<style>

let AC=null,muted=load("muted",false);
function tone(f,d=.15,type="sine",t0=0,v=.15){if(muted)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+t0;o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.02)}catch(e){}}
const sfx={win:()=>[523,659,784,1047].forEach((f,k)=>tone(f,.25,"triangle",k*.09)),
 big:()=>[523,659,784,1047,1319,1568,2093].forEach((f,k)=>tone(f,.3,"triangle",k*.08)),
 lose:()=>{tone(220,.25,"sawtooth",0,.08);tone(165,.4,"sawtooth",.18,.08)},
 tick:()=>tone(880,.06,"square",0,.05),tap:()=>tone(650,.04,"square",0,.05)};

/* Confettis */
function confetti(n=90){
  const c=document.createElement("canvas");c.style.cssText="position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60";
  c.width=innerWidth;c.height=innerHeight;document.body.appendChild(c);const x=c.getContext("2d");
  const cols=["#ff2bd6","#22e4ff","#39ff88","#ffe14d","#ff4d6d","#ffffff"];
  const ps=Array.from({length:n},()=>({x:c.width/2,y:c.height*.42,vx:(Math.random()-.5)*18,vy:-Math.random()*17-4,s:6+Math.random()*7,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[Math.random()*6|0]}));
  let f=0;(function a(){x.clearRect(0,0,c.width,c.height);ps.forEach(p=>{p.vy+=.45;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/3,p.s,p.s*.6);x.restore()});if(++f<120)requestAnimationFrame(a);else c.remove()})();
}

/* Scores + belle animation de points */
function add(pts,i=S.turn){S.scores[i]=(S.scores[i]||0)+pts}
function nextTurn(){S.turn=(S.turn+1)%S.players.length}
function resetScores(){S.scores={};S.turn=0;S.streak={}}
function award(pts,i,cb,label){
  const before=S.scores[i]||0;add(pts,i);
  const p=S.players[i],o=document.createElement("div");o.className="ov";
  o.innerHTML=pts>0?`<div class="avb">${avatar(p.av,140)}</div><div class="plus">+${pts}</div><div class="nm">${esc(p.name)}</div><div class="tot">${label?esc(label)+"<br>":""}Total : <b id="ct">${before}</b></div>`
    :`<div class="avb sad">${avatar(p.av,120)}</div><div class="nm">${esc(p.name)}</div><div class="tot">${esc(label||"Dommage… 0 point")}</div>`;
  document.body.appendChild(o);
  if(pts>0){sfx[pts>=3?"big":"win"]();confetti(45+pts*35);
    const t0=performance.now();(function c(){const k=Math.min(1,(performance.now()-t0-500)/600),e=$("#ct");if(e){e.textContent=Math.round(before+pts*Math.max(0,k))}if(k<1&&document.body.contains(o))requestAnimationFrame(c)})();
  }else sfx.lose();
  let done=false;const end=()=>{if(done)return;done=true;o.classList.add("out");setTimeout(()=>{o.remove();cb&&cb()},200)};
  o.onclick=end;setTimeout(end,pts>0?2200:1500);
}

}

  const d=()=>c.groups.forEach(g=>{$("#g_"+g.k).innerHTML=g.o.map(([val,lab])=>`<button class="pill ${val===v[g.k]?'on':''}" data-k="${g.k}" data-v="${esc(val)}">${esc(lab)}</button>`).join("")});
  d();

let jpN=0;
function jsonp(url){return new Promise(res=>{const cb="itcb"+(++jpN),sc=document.createElement("script");
  const end=r=>{delete window[cb];sc.remove();res(r)};
  window[cb]=d=>end(d);sc.onerror=()=>end(null);setTimeout(()=>end(null),8000);
  sc.src=url+"&callback="+cb;document.head.appendChild(sc)})}
async function blindGo(th,n,fromSetup){

  const hi=cfg.better==="high";
  const s=[...res].sort((a,b)=>hi?b.v-a.v:a.v-b.v);
  s.forEach(x=>{x.r=s.filter(y=>hi?y.v>x.v:y.v<x.v).length;x.pts=[3,2,1][x.r]||0});
  screen(`${topbar(cfg.title)}<h2 class="center">Résultats</h2>
  <div class="card">${s.map(x=>`<div class="rk"><b>${["🥇","🥈","🥉"][x.r]||x.r+1+"."}</b>${avatar(S.players[x.i].av,40)}<span>${esc(S.players[x.i].name)}</span><em>${esc(x.label)}</em><i>+${x.pts}</i></div>`).join("")}</div>
  ${cfg.reveal?`<p class="center" style="font-size:18px">${cfg.reveal}</p>`:""}
  <button class="btn pink" id="dist">Distribuer les points 🎉</button>`);
  bindBack();
  $("#dist").onclick=()=>{const q=s.filter(x=>x.pts>0);const go=()=>{const x=q.shift();if(!x)return endGame(cfg.title);award(x.pts,x.i,go,x.r===0?"👑 Vainqueur !":"")};go()};
}

/* ===== Musique de fond rythmée (générée, aucun fichier) ===== */
const M={on:false,step:0,next:0,bpm:104,mode:"menu",gain:null,noise:null,timer:null,vol:.38};
function mCtx(){AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume();
  if(!M.gain){M.gain=AC.createGain();M.gain.gain.value=M.vol;M.gain.connect(AC.destination);const b=AC.createBuffer(1,AC.sampleRate*.5,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;M.noise=b}}
function musicStart(){if(muted||M.on)return;try{mCtx();M.on=true;M.next=AC.currentTime+.08;M.step=0;M.timer=setInterval(msched,25)}catch(e){}}
function musicStop(){M.on=false;clearInterval(M.timer)}
function musicMode(m){M.mode=m;M.bpm=m==="menu"?104:128}
function musicDuck(d){if(M.gain&&AC)M.gain.gain.setTargetAtTime(d?.0001:M.vol,AC.currentTime,.12)}
function beat(){const r=document.documentElement.style;r.setProperty("--b",1);setTimeout(()=>r.setProperty("--b",0),70)}
const CH=[[110,[0,3,7]],[87.31,[0,4,7]],[130.81,[0,4,7]],[98,[0,4,7]]];
function mnote(f,t,d,type,v,filt){const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);let n=o;if(filt){const fl=AC.createBiquadFilter();fl.type="lowpass";fl.frequency.value=filt;o.connect(fl);n=fl}n.connect(g);g.connect(M.gain);o.start(t);o.stop(t+d+.02)}
function mnoise(t,d,v,hp){const s=AC.createBufferSource();s.buffer=M.noise;const f=AC.createBiquadFilter();f.type="highpass";f.frequency.value=hp;const g=AC.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(f);f.connect(g);g.connect(M.gain);s.start(t);s.stop(t+d+.02)}
function mstep(st,t){
  const i=st&15,[root,ch]=CH[(st>>4)&3],game=M.mode!=="menu";
  if(i%4===0){const o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(40,t+.12);g.gain.setValueAtTime(.95,t);g.gain.exponentialRampToValueAtTime(.0001,t+.22);o.connect(g);g.connect(M.gain);o.start(t);o.stop(t+.25);setTimeout(beat,Math.max(0,(t-AC.currentTime)*1000))}
  if(game&&(i===4||i===12))mnoise(t,.14,.4,1500);
  if(i%2===0)mnoise(t,.04,i%4===2?.2:.1,7000);
  if(game&&i===14)mnoise(t,.12,.14,6000);
  if(i%2===0)mnote(root*Math.pow(2,[0,0,12,0,0,12,0,7][i>>1]/12),t,.2,"sawtooth",.3,420);
  mnote(root*4*Math.pow(2,(ch[i%3]+((i>>2)&1?12:0))/12),t,.13,game?"square":"triangle",game?.06:.08,2400);
}
function msched(){if(!AC)return;while(M.next<AC.currentTime+.12){mstep(M.step,M.next);M.next+=60/M.bpm/4;M.step++}}
document.addEventListener("pointerdown",()=>{if(!muted&&!M.on)musicStart();else if(AC&&AC.state==="suspended")AC.resume()},{passive:true});
/* Décor animé */
(function(){const bg=document.createElement("div");bg.className="bg";const E=["⭐","🎵","⚡","🎨","🧠","🎧","✨","🔥","🎯","🎹"];
  bg.innerHTML=Array.from({length:16},(_,k)=>`<i style="left:${Math.random()*100}%;font-size:${18+Math.random()*30}px;animation-duration:${9+Math.random()*12}s;animation-delay:-${Math.random()*18}s">${E[k%E.length]}</i>`).join("");
  document.body.prepend(bg);const p=document.createElement("div");p.className="pulse";document.body.prepend(p)})();

home();
