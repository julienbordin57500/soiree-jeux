<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1a5ee0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Soirée Arena">
<title>Soirée Arena</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Lilita+One&display=swap" rel="stylesheet">
<style>
:root{--bg:#07051a;--card:#151036;--pink:#ff2bd6;--cyan:#22e4ff;--green:#39ff88;--yellow:#ffe14d;--red:#ff4d6d;--txt:#f4f1ff;--mut:#9a93c9;--fd:"Bungee",Impact,"Arial Black",system-ui,sans-serif;--fb:"Baloo 2",-apple-system,BlinkMacSystemFont,system-ui,sans-serif}
@property --b{syntax:'<number>';inherits:true;initial-value:0}
:root{transition:--b .16s ease-out}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--txt);font-family:var(--fb);overscroll-behavior:none;touch-action:none}
button{font-family:inherit;cursor:pointer;touch-action:none;color:inherit}
#stage{position:fixed;inset:0;overflow:hidden;z-index:1}

/* ===== Décors (un par univers de jeu) ===== */
.bgfx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0;background:#07051a}
.bgfx>*{position:absolute;opacity:0;transition:opacity .8s}
.bgfx>.sky,.bgfx>.vig,.bgfx>#fxc{opacity:1}
.sky{inset:0;background:var(--sky);transition:none}
.vig{inset:0;background:radial-gradient(120% 90% at 50% 45%,transparent 55%,#000a 100%)}
#fxc{inset:0;width:100%;height:100%}
.aur{inset:-20%;background:radial-gradient(40% 30% at 30% 30%,var(--a1,#7b2cff66),transparent 70%),radial-gradient(35% 28% at 70% 60%,var(--a2,#ff2bd655),transparent 70%),radial-gradient(30% 25% at 40% 80%,var(--a3,#22e4ff44),transparent 70%);animation:aur 18s ease-in-out infinite alternate}
@keyframes aur{50%{transform:translate(5%,-4%) rotate(8deg) scale(1.1)}100%{transform:translate(-4%,5%) rotate(-6deg) scale(1.05)}}
.rays{left:50%;top:45%;width:240vmax;height:240vmax;margin:-120vmax 0 0 -120vmax;background:repeating-conic-gradient(from 0deg,#ffffff16 0deg 8deg,transparent 8deg 20deg);animation:spin 40s linear infinite}
.dots{inset:0;background-image:radial-gradient(circle,#9fb6ff38 1.3px,transparent 1.8px);background-size:15px 15px;-webkit-mask-image:radial-gradient(90% 60% at 50% 30%,#000,transparent 80%);mask-image:radial-gradient(90% 60% at 50% 30%,#000,transparent 80%);opacity:0}
.beams i{position:absolute;bottom:-12%;width:46vmax;height:135vmax;margin-left:-23vmax;transform-origin:50% 100%;background:linear-gradient(to top,var(--bc),transparent 80%);clip-path:polygon(46% 100%,54% 100%,100% 0,0 0);mix-blend-mode:screen;opacity:.42;animation:sweep 6s ease-in-out infinite alternate}
.beams i:nth-child(1){left:8%;--bc:#ff2bd6;--r0:-35deg;--r1:20deg}
.beams i:nth-child(2){left:50%;--bc:#ffe14d;--r0:14deg;--r1:-14deg;animation-duration:8s;opacity:.25}
.beams i:nth-child(3){left:92%;--bc:#22e4ff;--r0:35deg;--r1:-20deg;animation-duration:7s}
@keyframes sweep{from{transform:rotate(var(--r0))}to{transform:rotate(var(--r1))}}
.sun{left:50%;border-radius:50%;transform:translateX(-50%)}
.planet{right:-8%;top:9%;width:min(52vw,260px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 32% 30%,#ffb3e6,#b14bff 45%,#3a1380 75%,#16063a);box-shadow:0 0 60px #b14bff66,inset -20px -18px 40px #0008;animation:float 9s ease-in-out infinite}
.planet::after{content:"";position:absolute;left:-28%;right:-28%;top:42%;height:16%;border-radius:50%;border:5px solid #ffd6f5aa;border-top-color:transparent;transform:rotate(-16deg)}
@keyframes float{50%{transform:translateY(-12px)}}
.floor{left:-60%;right:-60%;bottom:-6%;height:var(--fh,40%);background-image:linear-gradient(var(--fl,#ff2bd6aa) 2px,transparent 2px),linear-gradient(90deg,var(--fl,#ff2bd6aa) 2px,transparent 2px);background-size:54px 54px;transform:perspective(320px) rotateX(66deg);transform-origin:bottom;animation:floor 1.8s linear infinite;-webkit-mask-image:linear-gradient(transparent,#000 50%);mask-image:linear-gradient(transparent,#000 50%)}
@keyframes floor{to{background-position:0 54px}}
.land{left:0;width:100%;bottom:0;height:var(--lh,24%)}
.crowd{left:-2%;right:-2%;bottom:0;height:14%;display:flex;flex-direction:column;justify-content:flex-end}
.crowd svg{display:block;width:100%;height:100%;transform:translateY(calc(var(--b) * 5px));transition:transform .12s}
.crowd svg.crb{position:absolute;bottom:20%;height:80%;opacity:.7;transform:translateY(calc(var(--b) * -3px))}

/* Arène : concert néon */
[data-th=arena]{--sky:radial-gradient(110% 60% at 50% 100%,#ff2bd640,transparent 60%),linear-gradient(#08051f,#170a43 55%,#33115e)}
[data-th=arena] .aur,[data-th=arena] .beams,[data-th=arena] .crowd{opacity:1}
/* Far West : coucher de soleil */
[data-th=western]{--sky:linear-gradient(#22093a 0%,#6e1c55 28%,#d6423f 55%,#ff8f3c 74%,#ffd27a 100%)}
[data-th=western] .sun{opacity:1;bottom:22%;width:min(60vw,300px);aspect-ratio:1;background:radial-gradient(circle,#fff8d6,#ffd36b 50%,#ff8a3c 72%);box-shadow:0 0 90px 30px #ff8a3c77}
[data-th=western] .l-west{opacity:1}
/* Dojo : soleil levant, montagne et pétales */
[data-th=dojo]{--sky:linear-gradient(#26050d,#5e0d1f 40%,#b0283a 75%,#e8664a)}
[data-th=dojo] .sun{opacity:.9;top:12%;width:min(64vw,320px);aspect-ratio:1;background:radial-gradient(circle,#fff1dd,#ffd9b8 60%,#ffb08a);box-shadow:0 0 80px 20px #ffb08a55}
[data-th=dojo] .l-dojo{opacity:1}
/* Espace */
[data-th=space]{--sky:radial-gradient(70% 50% at 20% 80%,#2d1b8a55,transparent 70%),radial-gradient(60% 40% at 80% 20%,#8a1b7a44,transparent 70%),linear-gradient(#02010a,#090726 60%,#140a38)}
[data-th=space] .planet{opacity:1}
/* Plateau télé */
[data-th=studio]{--sky:radial-gradient(90% 55% at 50% 0%,#2f6bff50,transparent 70%),linear-gradient(#040a2c,#0f0a48 60%,#2a0b5e)}
[data-th=studio] .beams,[data-th=studio] .crowd{opacity:1}
[data-th=studio] .dots{opacity:1}
[data-th=studio] .beams i:nth-child(1){--bc:#2f8bff}[data-th=studio] .beams i:nth-child(3){--bc:#ff2bd6}
/* Glace */
[data-th=ice]{--sky:linear-gradient(#020d26,#0a3364 50%,#1f7fb3 82%,#a9e8ff);--a1:#39ff8844;--a2:#22e4ff55;--a3:#7b2cff33}
[data-th=ice] .aur,[data-th=ice] .l-ice{opacity:1}
/* Rétro-futur */
[data-th=synth]{--sky:linear-gradient(#0a0220 0%,#250844 38%,#6e1665 60%,#0d0322 60.3%,#0a0220)}
[data-th=synth] .sun{opacity:1;bottom:40%;width:min(58vw,280px);aspect-ratio:1;background:linear-gradient(#fff36b,#ff9a3c 40%,#ff2bd6 80%);box-shadow:0 0 70px #ff2bd688;-webkit-mask-image:linear-gradient(#000 52%,transparent 52% 56%,#000 56% 63%,transparent 63% 68%,#000 68% 75%,transparent 75% 81%,#000 81% 88%,transparent 88%);mask-image:linear-gradient(#000 52%,transparent 52% 56%,#000 56% 63%,transparent 63% 68%,#000 68% 75%,transparent 75% 81%,#000 81% 88%,transparent 88%)}
[data-th=synth] .floor,[data-th=synth] .l-synth{opacity:1}
/* Bonbons */
[data-th=candy]{--sky:radial-gradient(circle at 50% 45%,#ff6fb5 0%,#b81d7c 42%,#3d0b5e 100%)}
[data-th=candy] .rays{opacity:1}

/* ===== Menus ===== */
.scr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:max(22px,env(safe-area-inset-top)) 18px max(22px,env(safe-area-inset-bottom));text-align:center;z-index:2;animation:rise .5s cubic-bezier(.2,1.3,.4,1) both}
.scr.scroll{justify-content:flex-start;overflow-y:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch}
@keyframes rise{from{opacity:0;transform:translateY(30px) scale(.95)}}
.orbit{position:relative;width:min(320px,88vw);height:min(320px,88vw);display:flex;align-items:center;justify-content:center;flex:none}
.orb{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px;animation:orb 18s linear infinite;animation-delay:calc(var(--k) * -2.25s)}
.orb svg{filter:drop-shadow(0 0 10px #ff2bd6aa);animation:bob 2.4s ease-in-out infinite;animation-delay:calc(var(--k) * -.3s)}
@keyframes orb{from{transform:rotate(0deg) translateX(min(138px,38vw)) rotate(0deg)}to{transform:rotate(360deg) translateX(min(138px,38vw)) rotate(-360deg)}}
@keyframes bob{50%{transform:translateY(-4px) rotate(4deg)}}
.logo{font-family:var(--fd);line-height:.92;font-size:clamp(46px,15vw,74px);background:linear-gradient(180deg,#fff 0%,#fff3b0 30%,#ffb703 55%,#ff5e00 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 #9b1fd0) drop-shadow(0 8px 0 #2a0b4a) drop-shadow(0 0 26px #ff2bd6aa);transform:rotate(-5deg) scale(calc(1 + var(--b) * .04));position:relative;z-index:2}
.logo small{display:block;font-size:.62em;background:linear-gradient(180deg,#fff,#8ff6ff 45%,#1d6bff);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:3px}
.tag{font-size:18px;color:#e2dcff;margin:0;line-height:1.3;font-weight:700}
.foot{font-size:13px;color:var(--mut)}
.h{font-family:var(--fd);font-size:24px;margin:0;color:#fff;text-shadow:0 3px 0 #7a1fa8,0 0 18px #ff2bd666}
.hint{font-size:15px;color:#cfc8f7;margin:0;max-width:360px;line-height:1.3}
.btn{font-family:var(--fd);font-size:20px;letter-spacing:1px;border:0;border-radius:18px;padding:15px 24px;color:#2a0f00;background:linear-gradient(180deg,#fff27a,#ffb703);box-shadow:0 6px 0 #a35a00,0 12px 26px #0009;position:relative;overflow:hidden;transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #a35a00}
.btn::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,#ffffff77,transparent);transform:skewX(-20deg);animation:sh 3s infinite}
@keyframes sh{0%,55%{left:-60%}100%{left:130%}}
.btn.big{font-size:28px;padding:18px 46px;transform:scale(calc(1 + var(--b) * .03))}
.btn.pink{background:linear-gradient(180deg,#ff8aea,#ff2bd6);color:#fff;box-shadow:0 6px 0 #8a0f72,0 12px 26px #0009}
.btn.ghost{background:#ffffff14;color:#fff;box-shadow:0 4px 0 #0007;border:2px solid #ffffff35;font-size:16px}
.btn.sm{font-size:16px;padding:10px 18px;border-radius:14px}
.btn.sm::after{display:none}
.mute,.back{position:absolute;top:max(14px,env(safe-area-inset-top));width:44px;height:44px;border-radius:50%;border:2px solid #ffffff30;background:#0007;font-size:20px;z-index:5}
.mute{right:14px}.back{left:14px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:100%;max-width:380px}
.ccard{background:var(--card);border:3px solid #3a3380;border-radius:20px;padding:12px 6px 14px;font-family:var(--fd);font-size:36px;color:#fff;transition:transform .15s}
.ccard.on{border-color:var(--yellow);box-shadow:0 0 26px #ffe14d88;transform:scale(1.06)}
.ccard svg{display:block;margin:8px auto 0}
.pills{display:flex;gap:10px}
.pill{font-family:var(--fd);font-size:20px;min-width:74px;padding:10px;border-radius:14px;border:3px solid #3a3380;background:var(--card)}
.pill.on{border-color:var(--yellow);box-shadow:0 0 18px #ffe14d88}
.marq{width:100%;overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 15%,#000 85%,transparent);mask-image:linear-gradient(90deg,transparent,#000 15%,#000 85%,transparent)}
.marq div{display:inline-flex;gap:18px;font-size:30px;white-space:nowrap;animation:marq 22s linear infinite}
@keyframes marq{to{transform:translateX(-50%)}}
.ov{position:fixed;inset:0;z-index:90;background:#07051aee;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;animation:rise .35s both}
.steps{text-align:left;max-width:360px;font-size:16px;line-height:1.35;background:var(--card);border:2px solid #3a3380;border-radius:18px;padding:14px 16px}
.steps b{color:var(--yellow)}
.steps p{margin:0 0 8px}

/* ===== Table : zones des joueurs ===== */
.zone{position:absolute;z-index:1;overflow:hidden;border-radius:22px;background:linear-gradient(160deg,var(--ca),#0d0a26b8 78%);border:3px solid var(--c);box-shadow:inset 0 0 34px var(--cb),0 0 18px var(--ca);touch-action:none;transition:filter .3s,opacity .3s}
.zin{position:absolute;inset:0;display:flex;flex-direction:column;padding:8px 10px}
.zin.r{transform:rotate(180deg)}
.zh{display:flex;align-items:center;gap:6px;font-weight:800;font-size:15px;min-height:30px;flex:none}
.zh svg{flex:none}
.pn{font-family:var(--fd);font-size:11px;background:var(--c);color:#000;border-radius:7px;padding:3px 6px;flex:none}
.pn.big{font-size:15px;padding:4px 10px}
.nm{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;text-align:left}
.st{font-family:var(--fd);font-size:19px;color:var(--yellow);text-shadow:0 0 10px #ffe14d88;white-space:nowrap}
.zb{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;min-height:0}
.zhuge{font-family:var(--fd);font-size:clamp(30px,10vw,56px);line-height:1;text-shadow:0 0 20px var(--c),0 4px 0 #000}
.zhuge small{font-size:.45em}
.zbig{font-family:var(--fd);font-size:clamp(15px,4.8vw,23px);line-height:1.12}
.zsm{font-size:14px;color:#ddd7ff;font-weight:700}
.zone.wait{background:linear-gradient(160deg,#7a1228,#2a0610)}
.zone.go{background:linear-gradient(160deg,#18c862,#0a6a33)}
.zone.ok{background:linear-gradient(160deg,#1f9d5a,#0d3d24 80%)}
.zone.out{filter:grayscale(.9) brightness(.5)}
.zone.dim{opacity:.6}
.zone.win{animation:zwin .45s ease-in-out infinite alternate;border-color:#ffe14d}
@keyframes zwin{to{box-shadow:inset 0 0 60px #ffe14d77,0 0 44px #ffe14d}}
.zone.hot{animation:zhot .22s ease-in-out infinite alternate}
@keyframes zhot{to{background:linear-gradient(160deg,#ff3b3b,#5a0f1e);box-shadow:0 0 44px #ff3b3b;border-color:#fff}}
.zone.flashg{animation:zfg .4s}@keyframes zfg{30%{background:#1fbf6a}}
.zone.flashr{animation:zfr .4s}@keyframes zfr{30%{background:#c0213f}}
.zone.tapf{animation:ztap .12s}@keyframes ztap{50%{transform:scale(.97);filter:brightness(1.4)}}
.zone.ghost{opacity:.55;pointer-events:none}
.area{position:absolute;left:0;right:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
.mid{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);z-index:6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;pointer-events:none;text-align:center;padding:0 12px}
.mid>div{display:flex;flex-direction:column;align-items:center;gap:4px}
.mid .r,.dual .r,.r{transform:rotate(180deg)}
.mid button{pointer-events:auto}
.pz{position:absolute;left:6px;top:50%;margin-top:-19px;width:38px;height:38px;border-radius:50%;border:2px solid #ffffff40;background:#000a;font-size:15px;z-index:9}
.dual{display:flex;flex-direction:column;align-items:center;justify-content:space-around;height:100%;width:100%;padding:4px 12px;gap:4px}
.dual>div{display:flex;flex-direction:column;align-items:center;gap:4px}
.cd{font-family:var(--fd);font-size:86px;line-height:1;color:#fff;text-shadow:0 0 34px var(--pink),0 6px 0 #000;animation:cd .6s cubic-bezier(.2,1.6,.4,1) both}
.cd.go{color:var(--yellow);text-shadow:0 0 40px var(--yellow),0 6px 0 #000}
@keyframes cd{from{transform:scale(3) rotate(-10deg);opacity:0}}
.fin{font-family:var(--fd);font-size:58px;color:var(--yellow);text-shadow:0 0 34px var(--yellow),0 5px 0 #000;animation:cd .5s both;line-height:1}
.emo{font-size:58px;line-height:1}
.chrono{font-family:var(--fd);font-size:58px;font-variant-numeric:tabular-nums;color:#fff;text-shadow:0 0 22px var(--cyan),0 4px 0 #000;line-height:1}
.chrono.blur{filter:blur(7px);color:var(--pink)}
.ft{position:absolute;left:50%;top:42%;font-family:var(--fd);font-size:38px;color:var(--yellow);text-shadow:0 0 14px currentColor,0 3px 0 #000;animation:ft 1s forwards;pointer-events:none;z-index:6;white-space:nowrap}
@keyframes ft{0%{transform:translate(-50%,0) scale(.4);opacity:0}20%{transform:translate(-50%,-10px) scale(1.3);opacity:1}100%{transform:translate(-50%,-80px) scale(1);opacity:0}}

/* Sélection des héros */
.selav svg{filter:drop-shadow(0 0 18px var(--c));animation:bob 2.4s ease-in-out infinite}
.selrow{display:flex;align-items:center;justify-content:center;gap:6px;width:100%}
.arr{width:38px;height:38px;border-radius:50%;border:0;background:var(--c);color:#000;font-size:15px;box-shadow:0 4px 0 #0008;flex:none}
.arr:active{transform:translateY(3px);box-shadow:none}
.selnm{font-family:var(--fd);font-size:14px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-bottom:2px dotted #ffffff70;padding-bottom:2px}
.rdy{font-family:var(--fd);font-size:19px;border-radius:14px;padding:11px 22px;background:#ffffff1a;border:3px solid var(--c);box-shadow:0 4px 0 #0008}
.zone.ok .rdy{background:#39ff88;color:#04210f;border-color:#fff}

/* Roulette / intro / résultats */
.rt{font-family:var(--fd);font-size:13px;color:var(--cyan);letter-spacing:2px;text-shadow:0 0 10px #22e4ff88}
.rcard{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 20px;border-radius:24px;background:linear-gradient(180deg,#2e2380,#120c38);border:3px solid var(--cyan);box-shadow:0 0 34px #22e4ff88;min-width:72%;margin:8px 0}
.rcard .ri{font-size:68px;line-height:1}
.rcard .rn{font-family:var(--fd);font-size:20px}
.rcard.bump{animation:bump .12s}@keyframes bump{50%{transform:scale(1.07)}}
.rcard.land{animation:land .7s cubic-bezier(.2,1.6,.4,1);border-color:var(--yellow);box-shadow:0 0 60px #ffe14d}
@keyframes land{from{transform:scale(1.7) rotate(-6deg)}}
.gi{font-size:76px;line-height:1;animation:gi .8s cubic-bezier(.2,1.6,.4,1) both;filter:drop-shadow(0 0 22px #ff2bd6)}
@keyframes gi{from{transform:scale(0) rotate(-180deg)}}
.gname{font-family:var(--fd);font-size:22px;color:var(--yellow);text-shadow:0 0 14px #ffe14d88,0 3px 0 #000}
.grule{font-size:15px;line-height:1.2;font-weight:700;max-width:96%}
.medal{font-size:46px;line-height:1;animation:gi .6s both}
.medal.big{font-size:64px}
.plus{font-family:var(--fd);font-size:46px;color:var(--yellow);text-shadow:0 0 22px var(--yellow),0 4px 0 #000;animation:cd .6s both;line-height:1}
.stand{display:flex;gap:12px;justify-content:center;align-items:flex-end}
.sti{display:flex;flex-direction:column;align-items:center;font-family:var(--fd);font-size:17px}
.crn{height:20px;font-size:18px;line-height:1}
.champ svg{filter:drop-shadow(0 0 30px #ffe14d);animation:bob 1.6s ease-in-out infinite}

/* Mini-jeux */
.track{position:relative;width:94%;height:66px}
.lane{position:absolute;left:0;right:0;bottom:6px;height:6px;border-radius:3px;background:repeating-linear-gradient(90deg,#fff 0 12px,transparent 12px 22px);opacity:.5}
.flag{position:absolute;right:-6px;bottom:4px;font-size:30px}
.runner{position:absolute;bottom:8px;transition:left .1s;filter:drop-shadow(0 0 10px var(--c))}
.runner.hop svg{animation:hop .15s}
@keyframes hop{50%{transform:translateY(-12px) rotate(-10deg)}}
.cool{width:70%;height:10px;border-radius:5px;background:#ffffff22;overflow:hidden}
.cool i{display:block;height:100%;width:100%;background:var(--c);box-shadow:0 0 10px var(--c)}
.gcv{position:absolute;left:0;top:0;touch-action:none;z-index:3}
.bomb{position:absolute;left:50%;top:50%;font-size:92px;line-height:1;transform:translate(-50%,-50%) scale(var(--s,1));transition:left .35s cubic-bezier(.3,1.5,.5,1),top .35s cubic-bezier(.3,1.5,.5,1);filter:drop-shadow(0 0 22px #ff7b00)}
.bomb.exp{animation:exp .6s forwards}
@keyframes exp{to{transform:translate(-50%,-50%) scale(3.2);opacity:0;filter:brightness(3)}}
.spotbig{font-size:min(120px,20vh);line-height:1;filter:drop-shadow(0 0 20px #ffffff55)}
.pop{animation:popin .25s cubic-bezier(.2,1.6,.4,1)}
@keyframes popin{from{transform:scale(.3);opacity:.3}}
.cword{font-family:var(--fd);font-size:min(56px,13vw);line-height:1.1;text-shadow:0 4px 0 #000,0 0 14px #0008}
.qq{font-weight:800;font-size:15px;line-height:1.15;max-width:98%}
.qcat{font-family:var(--fd);font-size:11px;color:var(--cyan);letter-spacing:1px}
.opts{display:grid;gap:6px;width:100%;flex:1;align-content:stretch;padding-bottom:2px}
.opts.n4{grid-template-rows:repeat(4,1fr)}
.opts.n2{grid-template-columns:1fr 1fr}
.opt{border:2px solid #ffffff35;border-radius:14px;background:#ffffff14;font-weight:800;font-size:clamp(12px,3.6vw,16px);line-height:1.1;padding:4px 6px;min-height:38px;box-shadow:0 3px 0 #0008}
.opt small{display:block;font-weight:600;font-size:.82em;color:#d4cdff;margin-top:1px}
.opt:active{transform:translateY(2px)}
.opts.n2 .opt{font-family:var(--fd);font-size:21px}
.opts.n2 .opt:first-child{background:#13824a}.opts.n2 .opt:last-child{background:#a3203b}
.opt.good{background:#1fbf6a!important;border-color:#b9ffd6;box-shadow:0 0 22px #39ff88}
.opt.bad{background:#5a0f1e!important;opacity:.6}
.vinyl{width:min(130px,16vh);height:min(130px,16vh);border-radius:50%;background:repeating-radial-gradient(#111 0 3px,#262626 3px 5px);border:5px solid var(--pink);box-shadow:0 0 34px var(--pink);overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:40px}
.vinyl.spin{animation:spin 1.8s linear infinite}
.vinyl img{width:100%;height:100%;object-fit:cover}
.cfield{position:relative;width:100%;height:100%;transition:opacity .2s}
.cfield span{position:absolute;font-size:28px;line-height:1;margin:-14px 0 0 -14px}
.field{position:relative;align-self:stretch;flex:1}
.tgt{position:absolute;width:76px;height:76px;margin:-38px 0 0 -38px;border:0;border-radius:50%;font-size:50px;line-height:76px;padding:0;background:radial-gradient(circle,#ffe14d66,transparent 70%);animation:popin .2s cubic-bezier(.2,1.6,.4,1)}
.tgt.bm{background:radial-gradient(circle,#ff4d6d66,transparent 70%)}
.rope{position:relative;width:100%;height:100%}
.rline{position:absolute;left:50%;top:0;bottom:0;width:10px;margin-left:-5px;background:repeating-linear-gradient(45deg,#d9b277 0 6px,#8a6a3a 6px 12px);border-radius:5px;box-shadow:0 0 12px #0008}
.knot{position:absolute;left:50%;top:50%;font-size:44px;line-height:1;transform:translate(-50%,-50%);transition:top .08s;filter:drop-shadow(0 0 14px #ff2bd6)}
.rmark{position:absolute;left:8%;right:8%;height:5px;border-radius:3px}
.rmark.t{top:5%}.rmark.b{bottom:5%}
.hsc{font-family:var(--fd);font-size:40px;text-shadow:0 4px 0 #000}
.draww{position:absolute;inset:0;z-index:7;background:#0d0a26;display:flex;flex-direction:column}
.draww canvas{flex:1;background:#fff;touch-action:none;width:100%}
.dbar{height:66px;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 8px;flex:none}
.dt{font-family:var(--fd);font-size:24px;min-width:40px}
.dot{width:32px;height:32px;border-radius:50%;border:3px solid transparent;padding:0;font-size:16px;flex:none}
.dot.on{border-color:#fff}
.wordz{color:var(--yellow);font-size:clamp(26px,8vw,44px)}

/* Effets */
.wipe{position:fixed;top:0;bottom:0;left:-30%;right:-30%;z-index:80;pointer-events:none;background:repeating-linear-gradient(115deg,#ff2bd6 0 46px,#7b2cff 46px 92px,#22e4ff 92px 138px);transform:translateX(-120%) skewX(-12deg);animation:wipe .9s cubic-bezier(.7,0,.3,1) forwards}
@keyframes wipe{45%,55%{transform:translateX(0) skewX(-12deg)}100%{transform:translateX(120%) skewX(-12deg)}}
.flash{position:fixed;inset:0;z-index:70;pointer-events:none;animation:fl .35s forwards}
@keyframes fl{from{opacity:.8}to{opacity:0}}
#stage.shake{animation:shk .4s}
@keyframes shk{20%{transform:translate(-8px,5px)}40%{transform:translate(7px,-6px)}60%{transform:translate(-5px,-4px)}80%{transform:translate(4px,5px)}}

/* ===== Modes de jeu ===== */
.modes{display:flex;flex-direction:column;gap:12px;width:100%;max-width:420px}
.mcard{display:flex;align-items:center;gap:14px;text-align:left;background:linear-gradient(160deg,#2c2075ee,#120c38ee);border:3px solid #4a3fa0;border-radius:22px;padding:14px 16px;box-shadow:0 6px 0 #0008;transition:transform .12s}
.mcard:active{transform:translateY(3px) scale(.98)}
.mcard.on{border-color:var(--yellow);box-shadow:0 0 24px #ffe14d55,0 6px 0 #0008}
.mi{font-size:44px;line-height:1;flex:none;filter:drop-shadow(0 0 12px #ff2bd688)}
.mt b{display:block;font-family:var(--fd);font-size:18px;color:#fff;font-weight:400}
.mt span{display:block;font-size:14px;line-height:1.25;color:#d6cffc;margin:3px 0 5px}
.mt em{font-style:normal;font-size:12px;font-weight:800;color:var(--cyan);letter-spacing:.5px}
.cards.c4{grid-template-columns:repeat(4,1fr);max-width:400px}
.cards.c4 .ccard{font-size:30px;padding:10px 4px}
.ppl{font-size:16px;margin-top:2px}
.ccard{background:#151036dd}
/* ===== Liste des joueurs ===== */
.plist{display:flex;flex-direction:column;gap:8px;width:100%;max-width:420px}
.prow{display:flex;align-items:center;gap:7px;background:linear-gradient(90deg,var(--ca),#ffffff08);border:2px solid var(--c);border-radius:18px;padding:6px 10px}
.prow .arr{width:32px;height:32px;font-size:12px}
.pav2{flex:none;height:50px}.pav2 svg{display:block;filter:drop-shadow(0 0 10px var(--c))}
.pnm{flex:1;min-width:0;text-align:left;font-family:var(--fd);font-size:14px;background:none;border:0;padding:6px 2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pnm span{opacity:.6;font-size:12px}
/* ===== Chacun son tour ===== */
.pass .pav svg{filter:drop-shadow(0 0 30px var(--c));animation:bob 2s ease-in-out infinite}
.pname{font-family:var(--fd);font-size:clamp(30px,10vw,46px);color:#fff;text-shadow:0 0 22px var(--c),0 4px 0 #000;line-height:1}
.solo{position:absolute;inset:0;display:flex;flex-direction:column;padding:max(8px,env(safe-area-inset-top)) 10px max(10px,env(safe-area-inset-bottom));z-index:2}
.sh{display:flex;align-items:center;gap:8px;min-height:50px;padding-left:46px;flex:none;font-weight:800}
.sh .pn{background:var(--c)}
.sh .nm{font-size:16px}
.ssc{font-family:var(--fd);font-size:19px;color:var(--yellow);text-shadow:0 0 12px #ffe14d88;white-space:nowrap}
.sb{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;min-height:0;text-align:center}
.scd{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:20;pointer-events:none}
.scd .cd{font-size:120px}
.tend{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#07051add;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);animation:rise .4s both;text-align:center;padding:20px}
.tsc{font-family:var(--fd);font-size:clamp(32px,10vw,54px);color:var(--yellow);text-shadow:0 0 26px var(--yellow),0 5px 0 #000;animation:cd .6s both;line-height:1.05}
.pz.tl{left:10px;top:max(10px,env(safe-area-inset-top));margin-top:0}
.gname.big{font-size:30px}
.grule.big{font-size:18px;max-width:380px;line-height:1.3}
.rcard.solo1{min-width:min(300px,80vw);padding:22px}
.rcard.solo1 .ri{font-size:96px}
.stand{flex-wrap:wrap}
/* ===== Résultats en liste ===== */
.rlist{display:flex;flex-direction:column;gap:8px;width:100%;max-width:440px}
.rrow{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:18px;background:linear-gradient(90deg,var(--ca,#ffffff22),#0d0a26cc);border:2px solid var(--c);animation:slidein .5s cubic-bezier(.2,1.4,.4,1) both}
@keyframes slidein{from{opacity:0;transform:translateX(-40px)}}
.rrow.w{box-shadow:0 0 26px #ffe14d88;border-color:#ffe14d}
.rm{font-size:24px;width:30px;text-align:center;flex:none;font-family:var(--fd)}
.rnm{flex:1;min-width:0;text-align:left;display:flex;flex-direction:column}
.rnm b{font-family:var(--fd);font-weight:400;font-size:14px;line-height:1.1;overflow-wrap:anywhere}
.rnm small{font-size:13px;color:#d6cffc;font-weight:700}
.rp{font-family:var(--fd);font-size:20px;color:var(--yellow);text-shadow:0 0 12px #ffe14d88}
.rtot{font-family:var(--fd);font-size:14px;color:#fff;opacity:.85;min-width:36px;text-align:right}
.rtot.big{font-size:20px;opacity:1}
/* ===== Jeux à se passer ===== */
.simon{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:min(86vw,52vh,420px);aspect-ratio:1}
.sp{border:0;border-radius:26px;background:var(--pc);opacity:.32;box-shadow:inset 0 -8px 0 #0005,0 6px 0 #0007;transition:opacity .08s,transform .08s}
.sp:nth-child(1){--pc:#33e07a;border-top-left-radius:50%}.sp:nth-child(2){--pc:#ff3b5c;border-top-right-radius:50%}.sp:nth-child(3){--pc:#ffd23f;border-bottom-left-radius:50%}.sp:nth-child(4){--pc:#2f8bff;border-bottom-right-radius:50%}
.sp.on{opacity:1;transform:scale(1.04);box-shadow:0 0 44px var(--pc),inset 0 0 30px #fff8}
.sp.hint{opacity:1;animation:zwin .3s infinite alternate}
.smsg{font-family:var(--fd);font-size:24px;min-height:30px;text-shadow:0 3px 0 #000}
.dvt{font-family:var(--fd);font-size:44px;color:#fff;text-shadow:0 0 18px var(--cyan),0 4px 0 #000;line-height:1}
.dvt.hot{color:#ff4d6d;text-shadow:0 0 22px #ff4d6d,0 4px 0 #000}
.dvw{font-family:var(--fd);font-size:clamp(32px,10vw,58px);line-height:1.08;color:var(--yellow);text-shadow:0 0 26px #ffe14d88,0 5px 0 #000;padding:20px 10px;min-height:2.4em;display:flex;align-items:center;justify-content:center;overflow-wrap:anywhere}
.dvb{display:flex;gap:12px;width:100%;max-width:440px}
.dvb .btn{flex:1;padding:24px 8px;font-size:20px}
.cmsg{position:absolute;left:0;right:0;top:8px;font-family:var(--fd);font-size:20px;line-height:1.2;text-shadow:0 3px 0 #000;pointer-events:none;z-index:4}
.cmsg b{font-size:46px;color:var(--yellow);font-weight:400}
.bub{position:absolute;border-radius:50%;border:3px solid #ffffffcc;background:radial-gradient(circle at 32% 28%,#ffffffdd,#9fe4ffcc 30%,#2f8bffaa 72%);color:#06204a;font-family:var(--fd);box-shadow:0 0 18px #22e4ff88;padding:0;animation:bfl 3s ease-in-out infinite;transition:transform .15s,opacity .2s}
@keyframes bfl{50%{translate:0 -6px}}
.bub.popd{transform:scale(1.6);opacity:0;pointer-events:none}
.bub.nope{background:#ff4d6d}
.rx{position:absolute;inset:4px;border-radius:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;border:3px solid #ffffff30}
.rx.wait{background:linear-gradient(160deg,#9a1430,#3a0612)}
.rx.go{background:linear-gradient(160deg,#25e07a,#0b7a3c)}
.rx.bad{background:linear-gradient(160deg,#5a0f1e,#200008)}
.rx.ok{background:linear-gradient(160deg,#2c2075,#120c38)}
.rxb{font-family:var(--fd);font-size:clamp(40px,13vw,72px);text-shadow:0 5px 0 #0008;line-height:1}
.rxs{font-size:18px;font-weight:800}
.opts.solo{flex:none;width:100%;max-width:440px;grid-template-rows:none}
.opts.solo .opt{min-height:58px;font-size:17px}
.qq.big{font-size:20px;max-width:440px}

/* ===================== STYLE CARTOON EN RELIEF ===================== */
:root{--ink:#1b1440;--bg:#1a5ee0;--card:#2f74e6;--pink:#ff4fa3;--cyan:#3cc8ff;--green:#3be08a;--yellow:#ffd23f;--red:#ff4d6d;--txt:#fff;--mut:#d8e6ff;
 --fd:"Lilita One","Arial Black",Impact,system-ui,sans-serif;
 --ol:2px 0 0 var(--ink),-2px 0 0 var(--ink),0 2px 0 var(--ink),0 -2px 0 var(--ink),1.4px 1.4px 0 var(--ink),-1.4px 1.4px 0 var(--ink),1.4px -1.4px 0 var(--ink),-1.4px -1.4px 0 var(--ink);
 --olb:var(--ol),0 4px 0 var(--ink);
 --ol1:1.3px 0 0 var(--ink),-1.3px 0 0 var(--ink),0 1.3px 0 var(--ink),0 -1.3px 0 var(--ink),0 2.5px 0 var(--ink);
 --panel:linear-gradient(180deg,#5aa2ff 0%,#3d86f5 46%,#2f74e6 54%,#2563d1 100%);
 --gold:linear-gradient(180deg,#fff07a 0%,#ffd23f 46%,#ffbe1a 54%,#ffa600 100%);
 --lift:inset 0 3px 0 #ffffff70,inset 0 -5px 0 #00000026,0 5px 0 var(--ink)}
html,body{background:var(--bg)}
body{font-weight:700}
.h,.gname,.zhuge,.cd,.fin,.plus,.tsc,.pname,.ssc,.st,.rp,.rtot,.medal,.selnm,.zbig,.cword,.hsc,.chrono,.dvt,.dvw,.smsg,.rxb,.mt b,.rn,.dt,.pnm,.rnm b,.ccard,.pill,.rdy,.opts.n2 .opt{font-family:var(--fd);font-weight:400}
.h{font-size:30px;color:#fff;text-shadow:var(--olb);letter-spacing:.5px;text-wrap:balance}
.tag{color:#fff;text-shadow:var(--ol1);font-size:18px}
.hint{color:#fff;text-shadow:0 2px 0 #0004;font-weight:700}
.foot{color:#d8e6ff;text-shadow:0 1px 0 #0005}
.rt{font-family:var(--fd);font-size:15px;letter-spacing:1px;color:#fff;text-shadow:var(--ol1)}
.logo{font-family:var(--fd);font-size:clamp(56px,17vw,86px);line-height:.86;letter-spacing:1px;background:linear-gradient(180deg,#fffbe0 0%,#ffe766 30%,#ffc21a 58%,#ff8a00 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
 filter:drop-shadow(3px 0 0 var(--ink)) drop-shadow(-3px 0 0 var(--ink)) drop-shadow(0 3px 0 var(--ink)) drop-shadow(0 -3px 0 var(--ink)) drop-shadow(0 7px 0 var(--ink)) drop-shadow(0 12px 14px #0005);transform:rotate(-4deg) scale(calc(1 + var(--b) * .035))}
.logo small{font-size:.64em;letter-spacing:4px;background:linear-gradient(180deg,#ffffff,#bfe9ff 45%,#3cc8ff 70%,#1d8bff);-webkit-background-clip:text;background-clip:text;color:transparent}
.orb svg{filter:drop-shadow(0 4px 0 var(--ink))}

/* Boutons en relief */
.btn{font-family:var(--fd);font-weight:400;letter-spacing:.5px;color:#fff;text-shadow:var(--ol),0 3px 0 var(--ink);border:3px solid var(--ink);border-radius:18px;padding:14px 26px;background:var(--gold);box-shadow:var(--lift),0 10px 18px #0003;transition:transform .07s,box-shadow .07s,filter .2s}
.btn:active{transform:translateY(5px) scale(.97);box-shadow:inset 0 3px 0 #ffffff70,inset 0 -3px 0 #00000026,0 0 0 var(--ink)}
.btn::after{background:linear-gradient(100deg,transparent,#ffffff99,transparent);width:28%}
.btn.big{font-size:30px;padding:16px 44px;border-radius:22px;border-width:4px}
.btn.pink{background:linear-gradient(180deg,#ff9ad0 0%,#ff5fae 46%,#f2449a 54%,#d92a82 100%);color:#fff;box-shadow:var(--lift),0 10px 18px #0003}
.btn.green{background:linear-gradient(180deg,#8dfcb8 0%,#3be08a 46%,#22cc74 54%,#13a85c 100%)}
.btn.ghost{background:var(--panel);border:3px solid var(--ink);color:#fff;box-shadow:var(--lift);font-size:17px}
.btn.sm{font-size:17px;padding:10px 18px;border-radius:15px}
.btn.cta{animation:cta 1.6s ease-in-out infinite}
@keyframes cta{0%,100%{scale:1}50%{scale:1.05}}
.mute,.back,.pz{border:3px solid var(--ink);background:var(--panel);box-shadow:var(--lift);color:#fff;font-family:var(--fd);text-shadow:var(--ol1)}
.mute:active,.back:active,.pz:active{transform:translateY(3px);box-shadow:none}

/* Cartes et panneaux */
.ccard,.pill,.mcard{background:var(--panel);border:3px solid var(--ink);box-shadow:var(--lift);color:#fff;text-shadow:var(--olb)}
.ccard.on,.pill.on,.mcard.on{background:var(--gold);transform:translateY(-3px) scale(1.05);box-shadow:var(--lift),0 0 0 4px #ffffff88}
.mcard{border-radius:22px}
.mcard:active,.ccard:active,.pill:active{transform:translateY(3px) scale(.98)}
.mi{filter:drop-shadow(0 3px 0 var(--ink))}
.mt b{font-size:21px;color:#fff;text-shadow:var(--olb)}
.mt span{color:#fff;text-shadow:0 1px 0 #0006;font-weight:700}
.mt em{color:#fff27a;text-shadow:0 1px 0 var(--ink)}
.ccard svg rect:first-child{fill:#1b1440}
.ov{background:radial-gradient(120% 80% at 50% 30%,#2f7cf6ee,#123ea8f2);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.steps{background:#ffffff;color:var(--ink);border:3px solid var(--ink);box-shadow:0 6px 0 var(--ink);font-weight:700}
.steps b{color:#d92a82}
.marq div{filter:drop-shadow(0 3px 0 #0005)}

/* Zones des joueurs (table) */
.zone{border:4px solid var(--ink);border-radius:26px;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 80%,#fff 20%) 0%,color-mix(in srgb,var(--c) 88%,transparent) 30%,color-mix(in srgb,var(--c) 62%,#0a1a5a 20%) 100%);box-shadow:inset 0 4px 0 #ffffff55,inset 0 -7px 0 #0003,0 5px 0 var(--ink)}
.zone::before{content:"";position:absolute;inset:0;border-radius:inherit;background:repeating-linear-gradient(135deg,#ffffff12 0 16px,transparent 16px 32px);pointer-events:none}
.zh{font-family:var(--fd);font-weight:400}
.zh .nm{color:#fff;text-shadow:var(--ol1);font-size:16px}
.zh svg{filter:drop-shadow(0 2px 0 var(--ink))}
.pn{font-family:var(--fd);color:#fff;background:var(--c,var(--ink));border:2px solid var(--ink);border-radius:9px;text-shadow:var(--ol1);padding:2px 7px;font-size:13px}
.pn.big{font-size:17px;padding:3px 10px;box-shadow:0 3px 0 var(--ink)}
.st,.ssc{display:inline-block;color:#ffe766;font-size:22px;text-shadow:var(--ol1)}
.zhuge{color:#fff;text-shadow:var(--olb);font-size:clamp(34px,11vw,60px)}
.zbig{color:#fff;text-shadow:var(--ol1)}
.zsm{color:#fff;text-shadow:0 2px 0 #0006}
.zone.wait{background:linear-gradient(180deg,#ff6a6a,#d8323f)}
.zone.go{background:linear-gradient(180deg,#8dfcb8,#22cc74)}
.zone.ok{background:linear-gradient(180deg,#8dfcb8 0%,#3be08a 40%,#159e58 100%)}
.zone.win{animation:zwin2 .5s ease-in-out infinite alternate;border-color:var(--ink)}
@keyframes zwin2{from{box-shadow:inset 0 4px 0 #ffffff55,0 5px 0 var(--ink),0 0 0 0 #ffe766}to{box-shadow:inset 0 4px 0 #ffffff55,0 5px 0 var(--ink),0 0 0 6px #ffe766,0 0 30px 8px #ffe76699}}
.zone.out{filter:grayscale(.85) brightness(.7)}
.zone.dim{opacity:.72}
.cd{color:#fff;text-shadow:var(--olb),0 10px 0 #0003;font-size:110px}
.cd.go{color:#ffe766;font-size:120px}
.fin{color:#ffe766;text-shadow:var(--olb);font-size:64px}
.plus{color:#ffe766;text-shadow:var(--olb)}
.medal{filter:drop-shadow(0 4px 0 var(--ink))}
.ft{font-family:var(--fd);color:#ffe766;text-shadow:var(--olb);font-size:40px}
.selav svg{filter:drop-shadow(0 6px 0 var(--ink))}
.arr{border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);color:#fff;text-shadow:var(--ol1);font-family:var(--fd)}
.selnm{color:#fff;text-shadow:var(--ol1);font-size:18px;border-bottom:3px dotted #ffffffaa}
.rdy{color:#fff;text-shadow:var(--ol1);background:var(--panel);border:3px solid var(--ink);box-shadow:var(--lift);font-size:21px}
.zone.ok .rdy{background:var(--gold);color:#fff;border-color:var(--ink)}
.rcard{background:var(--panel);border:4px solid var(--ink);box-shadow:var(--lift),0 14px 24px #0004;border-radius:26px}
.rcard .rn{color:#fff;text-shadow:var(--olb);font-size:22px}
.rcard .ri{filter:drop-shadow(0 4px 0 var(--ink))}
.rcard.land{border-color:var(--ink);background:var(--gold);box-shadow:var(--lift),0 0 0 6px #fff,0 0 50px 10px #ffe766}
.gi{filter:drop-shadow(0 6px 0 var(--ink))}
.gname{color:#ffe766;text-shadow:var(--olb);font-size:26px}
.grule{color:#fff;text-shadow:0 2px 0 #0007}
.sti{color:#fff;text-shadow:var(--ol1)}
.sti svg{filter:drop-shadow(0 3px 0 var(--ink))}

function jsonp(url){return new Promise(res=>{const cb="itcb"+(++jpN),sc=document.createElement("script");

let AC=null,NB=null,OUT=null,REV=null,DLY=null,muted=load("muted",false);
const mtof=n=>440*Math.pow(2,(n-69)/12);
function ac(){
  if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();const sr=AC.sampleRate;
    const b=AC.createBuffer(1,sr*2,sr),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;NB=b;
    const comp=AC.createDynamicsCompressor();comp.threshold.value=-10;comp.knee.value=10;comp.ratio.value=3;comp.attack.value=.003;comp.release.value=.18;comp.connect(AC.destination);
    OUT=AC.createGain();OUT.gain.value=.8;OUT.connect(comp);MOUT=AC.createGain();MOUT.connect(comp);
    const len=sr*2.4|0,ir=AC.createBuffer(2,len,sr);for(let c=0;c<2;c++){const x=ir.getChannelData(c);for(let i=0;i<len;i++)x[i]=(Math.random()*2-1)*Math.pow(1-i/len,3.4)}
    REV=AC.createConvolver();REV.buffer=ir;const rg=AC.createGain();rg.gain.value=.34;REV.connect(rg);rg.connect(OUT);
    DLY=AC.createDelay(1.5);DLY.delayTime.value=.35;const fb=AC.createGain();fb.gain.value=.33;const dl=AC.createBiquadFilter();dl.type="lowpass";dl.frequency.value=2800;
    DLY.connect(dl);dl.connect(fb);fb.connect(DLY);const dg=AC.createGain();dg.gain.value=.45;dl.connect(dg);dg.connect(OUT)}
  if(AC.state==="suspended")AC.resume();return AC}
function sendTo(n,fx,v){if(!fx||!v)return;const s=AC.createGain();s.gain.value=v;n.connect(s);s.connect(fx)}
/* Voix de synthé générique */
function vo(type,f,t,d,v,dest,o={}){
  const os=AC.createOscillator(),g=AC.createGain(),a=o.a||.004;os.type=type;os.frequency.setValueAtTime(f,t);if(o.f2)os.frequency.exponentialRampToValueAtTime(o.f2,t+d);if(o.det)os.detune.value=o.det;
  let n=os;if(o.cut){const fl=AC.createBiquadFilter();fl.type="lowpass";fl.Q.value=o.q||1;fl.frequency.setValueAtTime(o.ce||o.cut,t);if(o.ce)fl.frequency.exponentialRampToValueAtTime(o.cut,t+Math.min(d,.3));os.connect(fl);n=fl}
  n.connect(g);g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+a+d);g.connect(dest);
  sendTo(g,REV,o.rev);sendTo(g,DLY,o.dly);os.start(t);os.stop(t+a+d+.05)}
function nz(t,d,v,dest,type,f,o={}){
  const s=AC.createBufferSource();s.buffer=NB;s.loop=true;const fl=AC.createBiquadFilter();fl.type=type;fl.frequency.setValueAtTime(f,t);if(o.f2)fl.frequency.exponentialRampToValueAtTime(o.f2,t+d);fl.Q.value=o.q||1;
  const g=AC.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(fl);fl.connect(g);g.connect(dest);sendTo(g,REV,o.rev);s.start(t,Math.random()*1.5);s.stop(t+d+.05)}
/* Raccourcis pour les bruitages (instantanés) */
function tone(f,d=.15,type="sine",t0=0,v=.15,f2,rev=.12){if(muted)return;try{const a=ac();vo(type,f,a.currentTime+t0,d,v,OUT,{f2,rev})}catch(e){}}
function noise(d=.2,v=.3,type="lowpass",f=1200,t0=0,f2,rev=.1){if(muted)return;try{const a=ac();nz(a.currentTime+t0,d,v,OUT,type,f,{f2,rev})}catch(e){}}
function brass(n,t0,d,v=.06){if(muted)return;try{const a=ac(),t=a.currentTime+t0,f=mtof(n);[-8,8].forEach(dt=>{const o=a.createOscillator(),fl=a.createBiquadFilter(),g=a.createGain();o.type="sawtooth";o.frequency.value=f;o.detune.value=dt;fl.type="lowpass";fl.Q.value=1.5;fl.frequency.setValueAtTime(300,t);fl.frequency.linearRampToValueAtTime(Math.min(9000,f*7),t+.05);fl.frequency.exponentialRampToValueAtTime(Math.min(6000,f*2.6),t+d);g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+.025);g.gain.setValueAtTime(v*.85,t+d*.75);g.gain.exponentialRampToValueAtTime(.0001,t+d+.08);o.connect(fl);fl.connect(g);g.connect(OUT);sendTo(g,REV,.3);o.start(t);o.stop(t+d+.12)})}catch(e){}}

   const sc=SONGS[M.song].sc;M.sc.gain.cancelScheduledValues(t);M.sc.gain.setValueAtTime(sc,t);M.sc.gain.linearRampToValueAtTime(1,t+.26);

function seqStart(){if(muted||M.on)return;try{const a=ac();if(!M.bus){M.bus=a.createGain();M.bus.gain.value=M.vol;M.bus.connect(OUT);M.sc=a.createGain();M.sc.connect(M.bus)}M.on=true;M.next=a.currentTime+.08;M.step=0;M.timer=setInterval(msched,25)}catch(e){}}
function musicStop(){M.on=false;clearInterval(M.timer)}
function seqMode(m){if(m==="battle")m=G.round%2?"turbo":"arena";if(!SONGS[m]||M.song===m)return;M.song=m;M.step=0;if(AC){M.next=Math.max(M.next,AC.currentTime+.04);if(DLY)DLY.delayTime.setValueAtTime(60/SONGS[m].bpm*.75,AC.currentTime)}}
function musicDuck(d){if(M.bus&&AC)M.bus.gain.setTargetAtTime(d===true?.0001:d===false?M.vol:M.vol*d,AC.currentTime,.12)}
function beat(){const r=document.documentElement.style;r.setProperty("--b",1);FX.beat=1;setTimeout(()=>r.setProperty("--b",0),70)}
function msched(){if(!AC||!M.on)return;const S=SONGS[M.song],s=60/S.bpm/4;while(M.next<AC.currentTime+.12){const i=M.step&15,bar=M.step>>4;let t=M.next;if(S.swing&&i%2)t+=s*S.swing;try{S.step(i,bar,t,s)}catch(e){}M.next+=s;M.step++}}
function toggleMute(){muted=!muted;save("muted",muted);if(muted)musicStop();else{musicStart();sfx.select()}}

/* ===================== DÉCORS ANIMÉS ===================== */
const FX={c:null,x:null,ps:[],th:"arena",beat:0,t:0,w:0,h:0};
const FXN={arena:24,studio:20,space:110,western:36,dojo:26,ice:70,synth:45,candy:20};
function theme(t){const b=document.getElementById("bg");if(!b||b.dataset.th===t)return;b.dataset.th=t;FX.th=t;FX.ps=[]}
function fxMake(th,init){const w=FX.w,h=FX.h,R=Math.random;
  switch(th){
   case"arena":case"studio":return{k:"bk",x:R()*w,y:init?R()*h:h+60,r:18+R()*55,vx:(R()-.5)*8,vy:-(6+R()*14),c:pick(th==="arena"?["255,43,214","34,228,255","123,44,255","255,225,77"]:["47,139,255","255,43,214","255,255,255"]),a:.05+R()*.1};
   case"space":case"synth":return{k:"st",x:R()*w,y:R()*h*(th==="synth"?.58:1),r:.5+R()*1.6,ph:R()*7,sp:1+R()*3};
   case"western":return{k:"du",x:init?R()*w:-10,y:R()*h,r:1+R()*2.4,vx:14+R()*30,ph:R()*7,a:.25+R()*.4};
   case"dojo":return{k:"pe",x:R()*w*1.2-w*.2,y:init?R()*h:-20,r:4+R()*5,vx:18+R()*30,vy:28+R()*40,rot:R()*7,vr:(R()-.5)*3,ph:R()*7};
   case"ice":return{k:"sn",x:R()*w,y:init?R()*h:-10,r:1+R()*2.8,vy:18+R()*45,ph:R()*7,sw:10+R()*25};
   case"candy":return{k:"bu",x:R()*w,y:init?R()*h:h+30,r:5+R()*20,vy:-(18+R()*40),ph:R()*7,a:.25+R()*.35};
  }}
function fxStep(dt){const x=FX.x,w=FX.w,h=FX.h;if(!x)return;FX.t+=dt;FX.beat*=Math.pow(.02,dt);
  const n=FXN[FX.th]||0;while(FX.ps.length<n)FX.ps.push(fxMake(FX.th,true));
  x.clearRect(0,0,w,h);
  FX.ps.forEach((p,j)=>{let dead=false;
   switch(p.k){
    case"bk":{p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.y<-80)dead=true;const a=p.a*(1+FX.beat*1.2),g=x.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r);g.addColorStop(0,`rgba(${p.c},${a})`);g.addColorStop(1,`rgba(${p.c},0)`);x.fillStyle=g;x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fill();break}
    case"st":{const a=.35+.65*Math.abs(Math.sin(FX.t*p.sp+p.ph));x.fillStyle=`rgba(255,255,255,${a})`;x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fill();break}
    case"du":{p.x+=p.vx*dt;p.y+=Math.sin(FX.t+p.ph)*8*dt;if(p.x>w+10)dead=true;x.fillStyle=`rgba(255,214,150,${p.a})`;x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fill();break}

  CF.ps=CF.ps.filter(p=>{p.t+=dt;p.vy+=p.g*dt;p.vx*=Math.pow(p.dr,dt*60);p.vy*=Math.pow(p.dr,dt*60);p.x+=p.vx*dt;p.y+=p.vy*dt;p.r+=p.vr*dt;
    const life=p.t/p.L;if(life>=1||p.y>innerHeight+40)return false;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.globalAlpha=life>.8?(1-life)*5:1;
    x.fillStyle=p.c;x.strokeStyle="#1b1440";x.lineWidth=1.6;
    if(p.k==="rb"){const sy=Math.cos(p.t*p.fl);x.scale(1,sy);x.fillRect(-p.s,-p.s*.32,p.s*2,p.s*.64);x.strokeRect(-p.s,-p.s*.32,p.s*2,p.s*.64)}
    else if(p.k==="st"){x.beginPath();for(let i=0;i<10;i++){const a=i*Math.PI/5,rr=i%2?p.s*.45:p.s;x.lineTo(Math.cos(a)*rr,Math.sin(a)*rr)}x.closePath();x.fill();x.stroke()}
    else if(p.k==="sp"){x.globalAlpha=1-life;x.beginPath();x.arc(0,0,p.s*(1-life*.6),0,7);x.fill()}
    else{x.beginPath();x.arc(0,0,p.s*.55,0,7);x.fill();x.stroke()}
    x.restore();return true})}
function cfAdd(o){CF.ps.push(Object.assign({t:0,L:3.2,g:900,dr:.985,r:rnd(0,6),vr:rnd(-8,8),fl:rnd(6,14),s:rnd(6,10),c:pick(CFC),k:pick(["rb","rb","st","ci"])},o))}
/* Canons à confettis des deux coins du bas (ou explosion depuis un point) */
function confetti(n=90,at){cfLayer();const w=innerWidth,h=innerHeight;
  for(let i=0;i<n;i++){if(at){const a=rnd(0,7),v=rnd(250,750);cfAdd({x:at.x,y:at.y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-200})}
    else{const L=i%2===0,a=(L?-62:-118)*Math.PI/180+rnd(-.28,.28),v=rnd(900,1500)*(h/800+.25);cfAdd({x:L?-10:w+10,y:h+10,vx:Math.cos(a)*v,vy:Math.sin(a)*v,L:rnd(2.6,3.8)})}}}
function sparks(x0,y0,n=6,col){cfLayer();for(let i=0;i<n;i++){const a=rnd(0,7),v=rnd(120,320);cfAdd({x:x0,y:y0,vx:Math.cos(a)*v,vy:Math.sin(a)*v,g:300,L:.45,k:i%3?"sp":"st",s:rnd(4,8),c:col||pick(["#ffe766","#ffffff","#ffd23f"])})}}

/* ===== Décors : confettis qui flottent pour l'accueil (remplace les bulles de lumière) ===== */
function fxMake(th,init){const w=FX.w,h=FX.h,R=Math.random;
  switch(th){
   case"arena":return{k:"cf",x:R()*w,y:init?R()*h:-20,s:5+R()*7,vy:26+R()*40,vx:(R()-.5)*20,rot:R()*7,vr:(R()-.5)*3,fl:3+R()*5,ph:R()*7,c:pick(CFC),sh:R()<.6?0:1};
   case"studio":return{k:"bk",x:R()*w,y:init?R()*h:h+60,r:18+R()*55,vx:(R()-.5)*8,vy:-(6+R()*14),c:pick(["255,122,217","255,255,255","60,200,255"]),a:.06+R()*.1};
   case"space":case"synth":return{k:"st",x:R()*w,y:R()*h*(th==="synth"?.58:1),r:.5+R()*1.6,ph:R()*7,sp:1+R()*3};
   case"western":return{k:"du",x:init?R()*w:-10,y:R()*h,r:1+R()*2.4,vx:14+R()*30,ph:R()*7,a:.25+R()*.4};
   case"dojo":return{k:"pe",x:R()*w*1.2-w*.2,y:init?R()*h:-20,r:4+R()*5,vx:18+R()*30,vy:28+R()*40,rot:R()*7,vr:(R()-.5)*3,ph:R()*7};
   case"ice":return{k:"sn",x:R()*w,y:init?R()*h:-10,r:1+R()*2.8,vy:18+R()*45,ph:R()*7,sw:10+R()*25};
   case"candy":return{k:"bu",x:R()*w,y:init?R()*h:h+30,r:5+R()*20,vy:-(18+R()*40),ph:R()*7,a:.3+R()*.35};
  }}
FXN.arena=34;
function fxStep(dt){const x=FX.x,w=FX.w,h=FX.h;if(!x)return;FX.t+=dt;FX.beat*=Math.pow(.02,dt);
  const n=FXN[FX.th]||0;while(FX.ps.length<n)FX.ps.push(fxMake(FX.th,true));
  x.clearRect(0,0,w,h);
  FX.ps.forEach((p,j)=>{let dead=false;
   switch(p.k){
    case"cf":{p.x+=p.vx*dt+Math.sin(FX.t+p.ph)*12*dt;p.y+=p.vy*dt*(1+FX.beat*.8);p.rot+=p.vr*dt;if(p.y>h+20)dead=true;x.save();x.translate(p.x,p.y);x.rotate(p.rot);x.fillStyle=p.c;x.globalAlpha=.85;
      if(p.sh){x.beginPath();x.arc(0,0,p.s*.5,0,7);x.fill()}else{x.scale(1,Math.cos(FX.t*p.fl+p.ph));x.fillRect(-p.s,-p.s*.3,p.s*2,p.s*.6)}x.restore();break}
    case"bk":{p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.y<-80)dead=true;const a=p.a*(1+FX.beat*1.2),g=x.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r);g.addColorStop(0,`rgba(${p.c},${a})`);g.addColorStop(1,`rgba(${p.c},0)`);x.fillStyle=g;x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fill();break}
    case"st":{const a=.35+.65*Math.abs(Math.sin(FX.t*p.sp+p.ph));x.fillStyle=`rgba(255,255,255,${a})`;x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fill();break}
    case"du":{p.x+=p.vx*dt;p.y+=Math.sin(FX.t+p.ph)*8*dt;if(p.x>w+10)dead=true;x.fillStyle=`rgba(255,214,150,${p.a})`;x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fill();break}
    case"pe":{p.x+=p.vx*dt+Math.sin(FX.t*2+p.ph)*20*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;if(p.y>h+20)dead=true;x.save();x.translate(p.x,p.y);x.rotate(p.rot);x.fillStyle="rgba(255,190,215,.85)";x.beginPath();x.ellipse(0,0,p.r,p.r*.55,0,0,7);x.fill();x.restore();break}
    case"sn":{p.y+=p.vy*dt;const sx=p.x+Math.sin(FX.t+p.ph)*p.sw;if(p.y>h+10)dead=true;x.fillStyle="rgba(255,255,255,.9)";x.beginPath();x.arc(sx,p.y,p.r,0,7);x.fill();break}
    case"bu":{p.y+=p.vy*dt;const bx=p.x+Math.sin(FX.t*1.5+p.ph)*10;if(p.y<-40)dead=true;x.strokeStyle=`rgba(255,255,255,${p.a})`;x.lineWidth=2;x.beginPath();x.arc(bx,p.y,p.r,0,7);x.stroke();x.fillStyle=`rgba(255,255,255,${p.a*.5})`;x.beginPath();x.arc(bx-p.r*.35,p.y-p.r*.35,p.r*.22,0,7);x.fill();break}
   }
   if(dead)FX.ps[j]=fxMake(FX.th,false)});
  if(FX.th==="space"&&Math.random()<dt*.25)FX.shoot={x:Math.random()*w,y:Math.random()*h*.4,l:0};
  if(FX.shoot&&FX.th==="space"){const s=FX.shoot;s.l+=dt*1.6;const g=x.createLinearGradient(s.x,s.y,s.x-120,s.y-50);g.addColorStop(0,`rgba(255,255,255,${1-s.l})`);g.addColorStop(1,"rgba(255,255,255,0)");x.strokeStyle=g;x.lineWidth=2;x.beginPath();x.moveTo(s.x,s.y);x.lineTo(s.x-120,s.y-50);x.stroke();s.x+=500*dt;s.y+=210*dt;if(s.l>=1)FX.shoot=null}
}

/* ===== Statistiques de la partie (pour les titres et les étoiles bonus) ===== */
const CAT={degaine:"vite",reflexe:"vite",course:"vite",tiles:"vite",etoiles:"vite",bulles:"vite",quiz:"tete",vf:"tete",compte:"tete",quizx:"tete",memoire:"tete",couleur:"tete",blind:"tete",chrono:"vise",cible:"vise",pile10:"vise",cercle:"vise",tour:"vise",sumo:"force",corde:"force",hockey:"force",bombe:"show",dessin:"show",devine:"show"};
function statInit(){G.st=G.P.map(()=>({w:0,last:0,run:0,best:0,worst:0,cat:{}}))}
function statRound(key,places,pts){const n=G.n,c=CAT[key]||"show",top=places.every(p=>p===places[0]);
  G.st.forEach((s,i)=>{const won=!top&&places[i]===0&&pts[i]>0;if(won){s.w++;s.run++;s.best=Math.max(s.best,s.run);s.cat[c]=(s.cat[c]||0)+1}else s.run=0;
    if(!top&&places[i]===Math.max(...places))s.last++});
  const rk=rankBy(G.scores);G.st.forEach((s,i)=>s.worst=Math.max(s.worst,rk[i]))}
const BONUS=[
 {k:"vite",i:"⚡",t:"L'éclair",d:"le plus de victoires aux jeux de vitesse",f:s=>s.cat.vite||0},
 {k:"tete",i:"🧠",t:"Le cerveau",d:"le plus de victoires aux jeux de réflexion",f:s=>s.cat.tete||0},
 {k:"vise",i:"🎯",t:"Le sniper",d:"le plus de victoires aux jeux de précision",f:s=>s.cat.vise||0},
 {k:"force",i:"💪",t:"Le costaud",d:"le plus de victoires aux jeux de force",f:s=>s.cat.force||0},
 {k:"show",i:"🎭",t:"Le showman",d:"le plus de victoires aux jeux d'ambiance",f:s=>s.cat.show||0},
 {k:"run",i:"🔥",t:"En feu",d:"la plus longue série de victoires",f:s=>s.best>=2?s.best:0},
 {k:"last",i:"🍀",t:"Pas de chance",d:"le plus souvent dernier (lot de consolation)",f:s=>s.last},
 {k:"remo",i:"🎢",t:"La remontada",d:"la plus belle remontée au classement",f:(s,i)=>Math.max(0,s.worst-rankBy(G.scores)[i])}];
function bonusPick(){const out=[];shuffle(BONUS).forEach(b=>{if(out.length>=2)return;const v=G.st.map((s,i)=>b.f(s,i)),m=Math.max(...v);if(m<=0)return;const w=v.map((x,i)=>x===m?i:-1).filter(i=>i>=0);if(w.length<G.n)out.push({b,w})});return out}
function titleOf(i,champ){const s=G.st[i];if(champ)return"👑 Le boss";if(s.best>=3)return"🔥 En feu";
  const c=Object.entries(s.cat).sort((a,b)=>b[1]-a[1])[0];if(c){const b=BONUS.find(x=>x.k===c[0]);return b.i+" "+b.t}return s.last>1?"🍀 Pas de chance":"🫶 Fair-play"}

function avail(){return Object.keys(GAMES).filter(k=>{const g=GAMES[k];if(g.need&&!g.need())return false;return G.mode==="mix"||(G.mode==="tour")===!!g.solo})}
function drawGame(){if(G.forced){const k=G.forced;G.forced=null;G.bag=G.bag.filter(x=>x!==k);G.last=k;return k}
  const av=avail();G.bag=G.bag.filter(k=>av.includes(k));if(!G.bag.length){G.bag=shuffle(av);if(G.bag[0]===G.last&&G.bag.length>1)G.bag.push(G.bag.shift())}const k=G.bag.shift();G.last=k;return k}
function nextRound(){if(G.round>=G.rounds)return endMatch();
  if(G.rounds>=6&&G.round===G.rounds-1){G.mult=2;G.finale=true;return roulette()}
  if(G.round>=2&&G.round<G.rounds-1&&G.round-G.evLast>=2&&Math.random()<.35){G.evLast=G.round;return eventScreen(roulette)}
  roulette()}

/* Buzz : même question pour tous, réponses dans chaque coin */
function buzz(c,{rounds,gen,penalty=false,tmo=15000}){
  const pts=Array(c.n).fill(0);let k=0,cur=null,lock,solved;
  c.Z.forEach(z=>c.score(z.i,0));
  const ask=()=>{if(RUN!==c.run)return;if(k>=rounds)return c.finish(rankBy(pts));k++;cur=gen(k);lock=new Set();solved=false;
    c.area.innerHTML=cur.html;
    c.Z.forEach(z=>{c.cls(z.i,"out",false);c.body(z.i,`<div class="opts n${cur.opts.length}">${cur.opts.map((o,j)=>`<button class="opt" data-j="${j}">${o}</button>`).join("")}</div>`);
      z.zb.querySelectorAll(".opt").forEach(b=>on(b,()=>pickOpt(z.i,+b.dataset.j,b)))});
    if(cur.onShow)cur.onShow();
    cur.tm=T(tmo,()=>reveal(-1))};
  const pickOpt=(i,j,b)=>{if(solved||lock.has(i))return;
    if(j===cur.ok){pts[i]++;c.score(i,pts[i]);b.classList.add("good");c.cls(i,"win");c.ft(i,"+1");sfx.coin();reveal(i)}
    else{lock.add(i);b.classList.add("bad");c.cls(i,"out");sfx.bad();if(penalty){pts[i]--;c.score(i,pts[i]);c.ft(i,"−1","#ff4d6d")}if(lock.size>=c.n)reveal(-1)}};
  const reveal=w=>{if(solved)return;solved=true;clearTimeout(cur.tm);
    c.Z.forEach(z=>z.zb.querySelectorAll(".opt").forEach(b=>{if(+b.dataset.j===cur.ok)b.classList.add("good")}));
    if(cur.onEnd)cur.onEnd(w);
    T(1900,()=>{c.Z.forEach(z=>c.cls(z.i,"win",false));ask()})};
  ask();
}
/* Spot : quelque chose défile au centre, touchez au bon moment */
function spot(c,{next,isHit,render,goal=3,speed=[850,480]}){
  const pts=Array(c.n).fill(0),lock=Array(c.n).fill(0);let cur=null,claimed=false,over=false,k=0;
  c.Z.forEach(z=>c.score(z.i,0));
  const step=()=>{if(over)return;cur=next(cur);claimed=false;render(cur);k++;T(Math.max(speed[1],speed[0]-k*14),step)};
  c.Z.forEach(z=>c.tap(z.i,()=>{const i=z.i;if(over||cur==null||performance.now()<lock[i])return;
    if(isHit(cur)){if(claimed)return;claimed=true;pts[i]++;c.score(i,pts[i]);c.blink(i,"flashg");c.ft(i,"+1");sfx.coin();
      if(pts[i]>=goal){over=true;c.cls(i,"win");T(1000,()=>c.finish(rankBy(pts)))}}
    else{pts[i]--;c.score(i,pts[i]);c.blink(i,"flashr");c.ft(i,"−1","#ff4d6d");sfx.bad();lock[i]=performance.now()+700}}));
  T(1900,step);T(45000,()=>{if(!over){over=true;c.finish(rankBy(pts))}});
}

 start(c){const wins=Array(c.n).fill(0);let r=0,phase="",out=new Set(),t0=0;
  c.Z.forEach(z=>c.score(z.i,0));
  const next=()=>{if(r>=3||Math.max(...wins)>=2)return c.finish(rankBy(wins));round()};
  const round=()=>{r++;phase="wait";out=new Set();
   c.Z.forEach(z=>{["go","out","win"].forEach(k=>c.cls(z.i,k,false));c.cls(z.i,"wait");c.body(z.i,`<div class="zsm">Manche ${r}</div><div class="zhuge">✋</div><div class="zbig">Attends…</div>`)});
   c.mid(`<div class="emo">🤠</div>`);
   T(rnd(1800,4800),()=>{phase="fire";t0=performance.now();sfx.shot();flash("#39ff88");c.mid(`<div class="emo">💥</div>`);
    c.Z.forEach(z=>{if(!out.has(z.i)){c.cls(z.i,"wait",false);c.cls(z.i,"go");c.body(z.i,`<div class="zhuge">FEU !</div>`)}})})};
  c.Z.forEach(z=>c.tap(z.i,()=>{const i=z.i;if(out.has(i)||phase==="end"||!phase)return;
   if(phase==="wait"){out.add(i);c.cls(i,"wait",false);c.cls(i,"out");c.body(i,`<div class="zhuge">🙈</div><div class="zbig">Trop tôt !</div>`);sfx.bad();if(out.size>=c.n){phase="end";T(1300,next)}return}
   phase="end";const ms=Math.round(performance.now()-t0);wins[i]++;c.score(i,wins[i]);c.cls(i,"go",false);c.cls(i,"win");
   c.body(i,`<div class="zhuge">🎯</div><div class="zbig">${ms} ms</div>`);c.ft(i,"+1");sfx.coin();
   c.Z.forEach(o=>{if(o.i!==i&&!out.has(o.i)){c.cls(o.i,"go",false);c.body(o.i,`<div class="zhuge">🐢</div><div class="zbig">Trop lent…</div>`)}});
   T(1600,next)}));
  round()}},

course:{name:"Course folle",icon:"🏃",edge:.5,
 rule:"Tapez votre coin le plus vite possible pour faire courir votre héros. Le premier à la ligne d'arrivée gagne !",
 setup(c){c.Z.forEach(z=>c.body(z.i,`<div class="track"><div class="lane"></div><div class="flag">🏁</div><div class="runner" style="left:0%">${avatar(c.P[z.i].av,46)}</div></div><div class="zhuge cnt">0%</div><div class="zsm">TAPE ! TAPE ! TAPE !</div>`))},
 start(c){const GOAL=38,prog=Array(c.n).fill(0);let over=false;
  c.Z.forEach(z=>{const run=z.zb.querySelector(".runner"),cnt=z.zb.querySelector(".cnt");
   c.tap(z.i,()=>{if(over)return;prog[z.i]++;const p=Math.min(1,prog[z.i]/GOAL);run.style.left=(p*80)+"%";cnt.textContent=Math.round(p*100)+"%";sfx.tap(prog[z.i]);
    run.classList.remove("hop");void run.offsetWidth;run.classList.add("hop");
    if(prog[z.i]>=GOAL){over=true;c.cls(z.i,"win");c.ft(z.i,"1er !");sfx.win();T(1000,()=>c.finish(rankBy(prog)))}})});
  T(25000,()=>{if(!over){over=true;c.finish(rankBy(prog))}})}},

sumo:{name:"Sumo Arena",icon:"🥋",edge:.17,
 rule:"Votre héros tourne sur lui-même : touchez votre coin pour foncer dans le sens de la flèche. Éjectez les autres du ring, le dernier debout gagne !",
 setup(c){c.Z.forEach(z=>c.body(z.i,`<div class="zbig">💥 TOUCHE = FONCE</div><div class="cool"><i></i></div>`));
  const{x,w,h}=canvasIn(c.area),W=stage.clientWidth,H=stage.clientHeight,cx=w/2,cy=h/2,R0=Math.min(w,h)*.46,r=R0*.17;let R=R0,t=0,over=false;const elim=[];
  const pl=c.Z.map((z,k)=>{const a=Math.atan2((z.t+z.h/2)*H-H/2,(z.l+z.w/2)*W-W/2);return{i:z.i,x:cx+Math.cos(a)*R0*.58,y:cy+Math.sin(a)*R0*.58,vx:0,vy:0,a:a+Math.PI,sp:(k%2?-1:1)*(2.6+k*.2),alive:true,fall:0,cd:0,img:avImg(c.P[z.i].av)}});
  c.Z.forEach((z,k)=>c.tap(z.i,()=>{const p=pl[k];if(!c.go||over||!p.alive||p.cd>0)return;p.vx+=Math.cos(p.a)*R0*1.15;p.vy+=Math.sin(p.a)*R0*1.15;p.cd=.4;sfx.dash();
   const b=z.zb.querySelector(".cool i");if(b){b.style.transition="none";b.style.width="0%";void b.offsetWidth;b.style.transition="width .4s linear";b.style.width="100%"}}));
  LOOP(dt=>{
   if(c.go&&!over){t+=dt;if(t>10)R=Math.max(R0*.5,R-R0*.035*dt);const f=Math.pow(.14,dt);
    pl.forEach(p=>{if(!p.alive)return;p.a+=p.sp*dt;p.cd-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=f;p.vy*=f});
    for(let a=0;a<pl.length;a++)for(let b=a+1;b<pl.length;b++){const p=pl[a],q=pl[b];if(!p.alive||!q.alive)continue;const dx=q.x-p.x,dy=q.y-p.y,d=Math.hypot(dx,dy)||1;
     if(d<2*r){const nx=dx/d,ny=dy/d,ov=(2*r-d)/2;p.x-=nx*ov;p.y-=ny*ov;q.x+=nx*ov;q.y+=ny*ov;const rv=(q.vx-p.vx)*nx+(q.vy-p.vy)*ny;
      if(rv<0){const j=1.2*rv;p.vx+=j*nx;p.vy+=j*ny;q.vx-=j*nx;q.vy-=j*ny;if(-rv>R0*.35){sfx.thud();shake()}}}}
    pl.forEach(p=>{if(p.alive&&Math.hypot(p.x-cx,p.y-cy)>R+r*.35){p.alive=false;elim.push(p.i);sfx.ko();c.cls(p.i,"out");c.body(p.i,`<div class="zhuge">💫</div><div class="zbig">ÉJECTÉ !</div>`);}});
    const al=pl.filter(p=>p.alive);
    if(al.length<=1||t>45){over=true;al.sort((p,q)=>Math.hypot(p.x-cx,p.y-cy)-Math.hypot(q.x-cx,q.y-cy));al.forEach(p=>c.cls(p.i,"win"));T(1400,()=>c.finish(fromOrder([...al.map(p=>p.i),...elim.slice().reverse()])))}}
   pl.forEach(p=>{if(!p.alive)p.fall+=dt});
   x.clearRect(0,0,w,h);
   x.save();x.beginPath();x.arc(cx,cy,R,0,7);const g=x.createRadialGradient(cx,cy,0,cx,cy,R);g.addColorStop(0,"#3a2b8f");g.addColorStop(1,"#140d3d");x.fillStyle=g;x.fill();
   x.lineWidth=7;x.strokeStyle=t>10?"#ff4d6d":"#22e4ff";x.shadowColor=x.strokeStyle;x.shadowBlur=24;x.stroke();x.restore();
   x.strokeStyle="#ffffff1c";x.lineWidth=3;x.beginPath();x.arc(cx,cy,R*.3,0,7);x.stroke();
   pl.forEach(p=>{const s=p.alive?1:1-p.fall*1.6;if(s<=0)return;const col=PCOL[p.i];x.save();x.translate(p.x,p.y);x.scale(s,s);
    if(p.alive){x.save();x.rotate(p.a);x.fillStyle=col;x.shadowColor=col;x.shadowBlur=14;x.beginPath();x.moveTo(r*1.9,0);x.lineTo(r*1.25,-r*.55);x.lineTo(r*1.25,r*.55);x.closePath();x.fill();x.restore()}else x.rotate(p.fall*9);
    x.beginPath();x.arc(0,0,r,0,7);x.fillStyle=col;x.shadowColor=col;x.shadowBlur=18;x.fill();x.shadowBlur=0;
    if(p.img.complete&&p.img.naturalWidth){x.beginPath();x.arc(0,0,r*.86,0,7);x.clip();x.drawImage(p.img,-r*.86,-r*.86,r*1.72,r*1.72)}
    x.restore()});
  })}},

bombe:{name:"Patate chaude",icon:"💣",edge:.26,
 rule:"La bombe va exploser ! Quand elle est devant vous, tapez vite votre coin le nombre de fois demandé pour la renvoyer. Celui qui l'a au moment du BOUM est éliminé.",
 setup(c){c.area.innerHTML=`<div class="bomb" id="bomb">💣</div>`},
 start(c){const alive=new Set(c.Z.map(z=>z.i)),elim=[],bomb=$("#bomb");let holder=-1,need=0,cnt=0,fuse=0,nt=0,t=0,over=false;
  const give=i=>{holder=i;need=4+(Math.random()*4|0);cnt=0;const z=c.Z[i];
   c.Z.forEach(o=>{c.cls(o.i,"hot",o.i===i);if(alive.has(o.i))c.body(o.i,o.i===i?`<div class="zhuge">TAPE !</div><div class="zhuge left" style="color:var(--yellow)">${need}</div>`:`<div class="zhuge">😅</div><div class="zsm">Ouf… pour l'instant</div>`)});
   bomb.style.left=((z.l+z.w/2)*100)+"%";bomb.style.top=(z.rot?20:80)+"%";sfx.whoosh()};
  c.Z.forEach(z=>c.tap(z.i,()=>{if(over||z.i!==holder||!alive.has(z.i))return;cnt++;sfx.tap(cnt*2);c.blink(z.i,"tapf");const e=z.zb.querySelector(".left");if(e)e.textContent=Math.max(0,need-cnt);
   if(cnt>=need)give(pick([...alive].filter(j=>j!==holder)))}));
  fuse=rnd(7,14);give(pick([...alive]));
  LOOP(dt=>{if(over)return false;t+=dt;fuse-=dt;nt-=dt;
   if(fuse<50&&nt<=0){nt=Math.max(.1,Math.min(.6,fuse/10));sfx.tick()}
   bomb.style.setProperty("--s",1+(fuse<3?.16:.06)*Math.sin(t*(fuse<3?30:14)));
   if(fuse<=0){sfx.boom();flash("#ff7b00");shake();const d=holder;alive.delete(d);elim.push(d);holder=-1;c.cls(d,"hot",false);c.cls(d,"out");c.body(d,`<div class="zhuge">💥</div><div class="zbig">BOUM !</div>`);bomb.classList.add("exp");
    if(alive.size<=1){over=true;const w=[...alive][0];c.cls(w,"win");T(1500,()=>c.finish(fromOrder([w,...elim.slice().reverse()])));return false}
    fuse=99;T(1400,()=>{bomb.classList.remove("exp");fuse=rnd(6,12);give(pick([...alive]))})}
  })}},

chrono:{name:"Chrono parfait",icon:"⏱️",edge:.5,
 rule:"Un chrono démarre au centre puis disparaît. Touchez votre coin pile au temps demandé, une seule fois. Le plus proche gagne !",
 start(c){const target=5+(Math.random()*5|0),got=Array(c.n).fill(null),t0=performance.now();let over=false;
  c.Z.forEach(z=>c.body(z.i,`<div class="zsm">Touche à exactement</div><div class="zhuge">${target},00 s</div><div class="zsm">Une seule chance !</div>`));
  const iv=IV(50,()=>{const t=(performance.now()-t0)/1000;c.mid(t<2.5?`<div class="chrono">${t.toFixed(2)}</div>`:`<div class="chrono blur">?.??</div>`);if(t>target+4)end()});
  c.Z.forEach(z=>c.tap(z.i,()=>{if(over||got[z.i]!=null)return;got[z.i]=(performance.now()-t0)/1000;c.cls(z.i,"ok");c.body(z.i,`<div class="zhuge">🔒</div><div class="zbig">Verrouillé !</div>`);sfx.select();if(got.every(v=>v!=null))end()}));
  function end(){if(over)return;over=true;clearInterval(iv);const diff=got.map(v=>v==null?99:Math.abs(v-target)),pl=rankBy(diff,false);
   c.mid(`<div class="zsm">Objectif</div><div class="chrono">${target.toFixed(2)}</div>`);
   c.Z.forEach(z=>{const v=got[z.i];c.cls(z.i,"ok",false);c.cls(z.i,"win",pl[z.i]===0&&v!=null);c.body(z.i,`<div class="zhuge">${v==null?"—":v.toFixed(2)+" s"}</div><div class="zbig">${v==null?"Pas joué":(v>=target?"+":"−")+Math.abs(v-target).toFixed(2)+" s"}</div>`)});
   sfx.win();T(2800,()=>c.finish(pl))}}},

cible:{name:"Cible !",icon:"🎯",edge:.3,
 rule:"Retenez votre cible. Des images défilent au centre : touchez votre coin dès que la cible apparaît. Erreur = moins 1. Le premier à 3 gagne !",
 start(c){const set=shuffle(["🍕","🍔","🌭","🌮","🍟","🍩","🍪","🧁","🥐","🍉","🍓","🍒"]).slice(0,7),tg=set[0];
  c.Z.forEach(z=>c.body(z.i,`<div class="zsm">Ta cible</div><div class="zhuge" style="font-size:64px">${tg}</div>`));
  c.area.innerHTML=`<div class="zsm r">Votre cible</div><div class="spotbig" id="sp">${tg}</div><div class="zsm">Votre cible</div>`;
  const sp=$("#sp");
  spot(c,{next:p=>{if(p!==tg&&Math.random()<.3)return tg;let e;do{e=pick(set.slice(1))}while(e===p);return e},isHit:e=>e===tg,
   render:e=>{sp.parentNode.querySelectorAll(".zsm").forEach(x=>x.style.visibility="hidden");sp.textContent=e;sp.classList.remove("pop");void sp.offsetWidth;sp.classList.add("pop")}})}},

couleur:{name:"Bonne couleur",icon:"🎨",edge:.3,
 rule:"Un mot de couleur s'affiche. Touchez votre coin seulement si le mot est écrit dans SA couleur : ROUGE écrit en rouge. Erreur = moins 1. Le premier à 3 gagne !",
 start(c){const C=[["ROUGE","#ff3b3b"],["BLEU","#3b8bff"],["VERT","#2fe05a"],["JAUNE","#ffe14d"],["ROSE","#ff5ad8"],["BLANC","#ffffff"]];
  c.area.innerHTML=`<div class="r"><div class="cword" id="cw1">PRÊTS ?</div></div><div style="height:12px"></div><div><div class="cword" id="cw2">PRÊTS ?</div></div>`;
  c.Z.forEach(z=>c.body(z.i,`<div class="zsm">Touche si :</div><div class="zbig"><span style="color:#ff3b3b">ROUGE</span> ✔<br><span style="color:#3b8bff">ROUGE</span> ✘</div>`));
  spot(c,{speed:[1050,620],next:p=>{const w=pick(C),hit=!(p&&p.hit)&&Math.random()<.3,col=hit?w[1]:pick(C.filter(x=>x!==w))[1];return{w:w[0],col,hit}},isHit:e=>e.hit,
   render:e=>{["cw1","cw2"].forEach(id=>{const el=$("#"+id);if(!el)return;el.textContent=e.w;el.style.color=e.col;el.classList.remove("pop");void el.offsetWidth;el.classList.add("pop")})}})}},

quiz:{name:"Quiz Buzz",icon:"🧠",edge:.4,
 rule:"Une question au centre, 4 réponses dans votre coin. Le premier qui touche la bonne réponse marque. Une erreur et vous êtes bloqué pour cette question.",
 start(c){const qs=shuffle(QUESTIONS).slice(0,5);
  buzz(c,{rounds:5,gen:k=>{const[cat,q,a]=qs[k-1],o=shuffle(a.map((t,j)=>({t,ok:j===0})));
   return{html:dual(`<div class="qcat">${esc(cat).toUpperCase()} · ${k}/5</div><div class="qq">${esc(q)}</div>`),opts:o.map(x=>esc(x.t)),ok:o.findIndex(x=>x.ok)}}})}},

vf:{name:"Vrai ou Faux",icon:"✅",edge:.36,
 rule:"Une affirmation au centre : touchez VRAI ou FAUX dans votre coin. Le plus rapide marque, mais une erreur coûte un point !",
 start(c){const qs=shuffle(VF).slice(0,6);
  buzz(c,{rounds:6,penalty:true,gen:k=>{const[t,v]=qs[k-1];return{html:dual(`<div class="qcat">${k}/6</div><div class="qq" style="font-size:17px">${esc(t)}</div>`),opts:["VRAI","FAUX"],ok:v?0:1}}})}},

compte:{name:"Compte éclair",icon:"🔢",edge:.36,
 rule:"Des objets apparaissent un court instant au centre. Comptez vite ! Puis touchez le bon nombre dans votre coin.",
 start(c){const E=["⭐","🍕","🐸","🎈","🍩","⚽","🐟","🍒","🦆","🍄"];
  buzz(c,{rounds:5,tmo:9000,gen:k=>{const n=5+(Math.random()*8|0)+k,e=pick(E),cells=shuffle([...Array(32).keys()]).slice(0,n);
   const sp=cells.map(q=>`<span style="left:${(q%8)*12+6+rnd(-2.5,2.5)}%;top:${(q>>3)*24+14+rnd(-5,5)}%">${e}</span>`).join("");
   const cand=shuffle([n-2,n-1,n+1,n+2,n+3].filter(v=>v>0)).slice(0,3),o=[n,...cand].sort((a,b)=>a-b);
   return{html:`<div class="cfield" id="cf">${sp}</div>`,opts:o.map(String),ok:o.indexOf(n),
    onShow:()=>T(Math.max(1100,1900-k*150),()=>{const f=$("#cf");if(f)f.innerHTML=dual(`<div class="zbig">Combien de ${e} ?</div>`)}),
    onEnd:()=>{const f=$("#cf");if(f)f.innerHTML=dual(`<div class="zbig">Il y en avait ${n} ${e}</div>`)}}}})}},

blind:{name:"Blind Test Buzz",icon:"🎧",edge:.4,need:()=>G.tracks&&G.tracks.length>=6,
 rule:"Un extrait de musique démarre. Touchez le bon titre dans votre coin avant les autres ! Une erreur et vous êtes bloqué.",
 start(c){const ts=shuffle(G.tracks);
  buzz(c,{rounds:Math.min(5,ts.length),tmo:22000,gen:k=>{const t=ts[k-1],dec=shuffle(G.tracks.filter(x=>x!==t&&x.artistName!==t.artistName)).slice(0,3),o=shuffle([t,...dec]);
   return{html:`<div class="vinyl spin" id="vy">🎵</div><div class="rt" style="margin-top:8px">${k} / ${Math.min(5,ts.length)}</div>`,
    opts:o.map(x=>`${esc(cleanT(x.trackName))}<small>${esc(x.artistName)}</small>`),ok:o.indexOf(t),
    onShow:()=>{try{BA.src=t.previewUrl;BA.currentTime=0;const p=BA.play();if(p&&p.catch)p.catch(()=>{});musicDuck(true)}catch(e){}},
    onEnd:()=>{try{BA.pause()}catch(e){}musicDuck(false);const v=$("#vy");if(v&&t.artworkUrl100){v.classList.remove("spin");v.innerHTML=`<img src="${esc(t.artworkUrl100.replace("100x100","300x300"))}" alt="">`}}}}})}},

etoiles:{name:"Attrape-étoiles",icon:"⭐",edge:.5,
 rule:"Des étoiles apparaissent dans votre coin, au même endroit pour tout le monde. Touchez-les avant les autres ! Attention aux bombes : moins 1 point.",
 start(c){const pts=Array(c.n).fill(0);let k=0,cur=null,over=false;
  c.Z.forEach(z=>{c.score(z.i,0);c.body(z.i,`<div class="field"></div>`)});
  const clearAll=()=>c.Z.forEach(z=>{const f=z.zb.querySelector(".field");if(f)f.innerHTML=""});
  const spawn=()=>{if(over)return;if(k>=12){over=true;return c.finish(rankBy(pts))}k++;
   const bomb=k>2&&Math.random()<.3,x=12+Math.random()*76,y=14+Math.random()*72,id=k;cur={bomb,id};
   c.Z.forEach(z=>{const f=z.zb.querySelector(".field");f.innerHTML=`<button class="tgt ${bomb?"bm":""}" style="left:${x}%;top:${y}%">${bomb?"💣":"⭐"}</button>`;on(f.firstChild,()=>hit(z.i,id,f))});
   T(bomb?1300:2400,()=>{if(cur&&cur.id===id){cur=null;clearAll();T(350,spawn)}})};
  const hit=(i,id,f)=>{if(over||!cur||cur.id!==id)return;
   if(cur.bomb){pts[i]--;c.score(i,pts[i]);c.blink(i,"flashr");c.ft(i,"−1","#ff4d6d");sfx.bad();f.innerHTML="";return}
   cur=null;pts[i]++;c.score(i,pts[i]);c.blink(i,"flashg");c.ft(i,"+1");sfx.coin();clearAll();T(rnd(400,900),spawn)};
  T(500,spawn)}},

corde:{name:"Tir à la corde",icon:"🪢",edge:.25,
 rule:"L'équipe du bas contre l'équipe du haut ! Tapez votre coin comme des fous pour tirer la corde de votre côté.",
 setup(c){const b=c.Z.find(z=>!z.rot).i,t=c.Z.find(z=>z.rot).i;
  c.area.innerHTML=`<div class="rope"><div class="rmark t" style="background:${PCOL[t]};box-shadow:0 0 14px ${PCOL[t]}"></div><div class="rline"></div><div class="knot" id="kn">🎀</div><div class="rmark b" style="background:${PCOL[b]};box-shadow:0 0 14px ${PCOL[b]}"></div></div>`;
  c.Z.forEach(z=>c.body(z.i,`<div class="zhuge">TIRE !</div><div class="zsm">${z.rot?"Équipe du haut":"Équipe du bas"}</div>`))},
 start(c){const bot=c.Z.filter(z=>!z.rot).map(z=>z.i),top=c.Z.filter(z=>z.rot).map(z=>z.i),kn=$("#kn");let p=0,over=false;
  const win=b=>{over=true;const W=b?bot:top;flash(PCOL[W[0]]);sfx.win();W.forEach(i=>c.cls(i,"win"));T(1300,()=>c.finish(c.Z.map(z=>W.includes(z.i)?0:1),c.Z.map(z=>W.includes(z.i)?c.n-1:0)))};
  c.Z.forEach(z=>c.tap(z.i,()=>{if(over)return;p+=(z.rot?-1:1)*.045/(z.rot?top:bot).length;sfx.tap(z.rot?3:9);c.blink(z.i,"tapf");kn.style.top=(50+p*45)+"%";if(Math.abs(p)>=1)win(p>0)}));
  T(30000,()=>{if(!over)win(p>0)})}},

hockey:{name:"Air Hockey",icon:"🏒",edge:.5,
 rule:"Glissez le doigt dans votre zone pour bouger votre palet. Marquez dans le but d'en face ! Équipe du bas contre équipe du haut, premier à 3 buts (80 secondes max).",
 setup(c){c.Z.forEach(z=>{z.el.classList.add("ghost");c.body(z.i,"")});
  const{cv,x,w,h}=canvasIn(stage),pr=Math.min(w,h)*.08,kr=pr*.72,gw=w*.44;
  const bot=c.Z.filter(z=>!z.rot).map(z=>z.i),top=c.Z.filter(z=>z.rot).map(z=>z.i);
  const pads=c.Z.map(z=>({i:z.i,z,x:(z.l+z.w/2)*w,y:z.rot?h*.2:h*.8,vx:0,vy:0,tx:null,ty:null,img:avImg(c.P[z.i].av)}));

 run(s){const {x,w,h}=canvasIn(s.sb);let y=h*.5,vy=0,up=false,dist=0,sp=170,over=false;

   x.beginPath();x.moveTo(0,h);for(let sx=0;sx<=w+8;sx+=8){const d=dist+sx;x.lineTo(sx,cen(d)+gap(d)/2)}x.lineTo(w,h);x.closePath();x.fill();x.stroke();
   let hit=false;const k0=Math.floor(dist/OB);
   for(let k=Math.max(2,k0);k<=k0+Math.ceil(w/OB)+1;k++){const ox=k*OB-dist,dd=k*OB,oy=cen(dd)+(orand(k)-.5)*gap(dd)*.55,bh=h*.15;
    x.fillStyle="#ff4fa3";x.beginPath();x.roundRect?x.roundRect(ox-bw/2,oy-bh/2,bw,bh,8):x.rect(ox-bw/2,oy-bh/2,bw,bh);x.fill();x.stroke();
    if(Math.abs(ox-hx)<bw/2+14&&Math.abs(oy-y)<bh/2+11)hit=true}
   const dh=dist+hx;if(y-11<cen(dh)-gap(dh)/2||y+11>cen(dh)+gap(dh)/2)hit=true;
   x.save();x.translate(hx,y);x.rotate(Math.max(-.35,Math.min(.35,vy/900)));x.scale(-1,1);x.font="34px serif";x.textAlign="center";x.textBaseline="middle";x.fillText("🚁",0,0);x.restore();
   const m=Math.round(dist/10);s.score(m+" m");
   if(hit){over=true;sfx.boom();impact();sparks(...Object.values(ctr(s.sb)),12);T(1000,()=>s.end(m,m+" m"))}})}},

intrus:{name:"Trouve l'intrus",icon:"🔍",solo:true,th:"studio",mus:"turbo",goal:"le plus d'intrus trouvés gagne",
 rule:"Une image n'est pas comme les autres : trouve-la ! 30 secondes pour en trouver un maximum. Une erreur coûte 2 secondes.",
 run(s){let t=30,sc=0,over=false;const lab=n=>n+" intrus";
  s.sb.innerHTML=`<div class="dvt">30</div><div class="igrid"></div>`;const gd=s.sb.querySelector(".igrid"),tt=s.sb.querySelector(".dvt");
  const next=()=>{const N=Math.min(6,3+Math.floor(sc/2)),pr=pick(INTRUS),sw=Math.random()<.5,a=sw?pr[1]:pr[0],b=sw?pr[0]:pr[1],odd=Math.random()*N*N|0;
   gd.style.gridTemplateColumns=`repeat(${N},1fr)`;gd.style.setProperty("--fs",Math.round(Math.min(56,260/N))+"px");
   gd.innerHTML=Array.from({length:N*N},(_,k)=>`<button class="ic" data-k="${k}">${k===odd?b:a}</button>`).join("");
   gd.querySelectorAll(".ic").forEach(bt=>on(bt,()=>{if(over)return;if(+bt.dataset.k===odd){sc++;bt.classList.add("good");sfx.coin(sc);s.ft("+1");s.score(lab(sc));over=true;T(220,()=>{over=false;next()})}
    else{t=Math.max(0,t-2);tt.textContent=t;bt.classList.add("bad");sfx.bad();s.ft("−2 s","#ff4d6d")}}))};
  s.score(lab(0));next();
  IV(1000,()=>{t--;tt.textContent=Math.max(0,t);tt.classList.toggle("hot",t<=5);if(t<=5&&t>0)sfx.tick();if(t<=0&&!s.done){over=true;sfx.boom();T(900,()=>s.end(sc,lab(sc)))}})}},

calcul:{name:"Calcul éclair",icon:"🧮",solo:true,th:"space",mus:"turbo",goal:"le plus de points gagne",
 rule:"30 secondes pour résoudre un max de calculs. Bonne réponse +1, mauvaise −1 !",
 run(s){let t=30,sc=0,k=0,over=false;const lab=n=>n+" point"+(Math.abs(n)>1?"s":"");
  s.sb.innerHTML=`<div class="dvt">30</div><div class="calc"></div><div class="opts n4 solo"></div>`;const o=s.sb.querySelector(".opts"),q=s.sb.querySelector(".calc"),tt=s.sb.querySelector(".dvt");
  const gen=()=>{const lv=Math.min(3,k/4|0),op=pick(lv<1?["+","−"]:["+","−","×"]);let a,b,r;
   if(op==="+"){a=2+Math.random()*(10+lv*15)|0;b=2+Math.random()*(10+lv*15)|0;r=a+b}else if(op==="−"){a=5+Math.random()*(15+lv*15)|0;b=1+Math.random()*a|0;r=a-b}else{a=2+Math.random()*(5+lv*2)|0;b=2+Math.random()*8|0;r=a*b}
   const S=new Set([r]);while(S.size<4){const d=pick([1,2,3,10,-1,-2,-3,-10]);if(r+d>=0)S.add(r+d)}return{txt:`${a} ${op} ${b}`,r,ops:shuffle([...S])}};
  const ask=()=>{const Q=gen();k++;delete o.dataset.lock;q.textContent=Q.txt+" = ?";o.innerHTML=Q.ops.map(v=>`<button class="opt">${v}</button>`).join("");
   o.querySelectorAll(".opt").forEach((b,j)=>on(b,()=>{if(over||o.dataset.lock)return;o.dataset.lock=1;
    if(Q.ops[j]===Q.r){sc++;b.classList.add("good");sfx.coin(sc);s.ft("+1")}else{sc--;b.classList.add("bad");o.querySelectorAll(".opt").forEach((x,jj)=>{if(Q.ops[jj]===Q.r)x.classList.add("good")});sfx.bad();s.ft("−1","#ff4d6d")}
    s.score(lab(sc));T(380,()=>{if(!over)ask()})}))};
  s.score(lab(0));ask();
  IV(1000,()=>{t--;tt.textContent=Math.max(0,t);tt.classList.toggle("hot",t<=5);if(t<=5&&t>0)sfx.tick();if(t<=0&&!over){over=true;sfx.boom();T(900,()=>s.end(sc,lab(sc)))}})}}
});
